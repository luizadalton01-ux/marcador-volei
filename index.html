<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Marcação Vôlei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1119;
  --bg-elev:#141b26;
  --bg-elev-2:#1b2432;
  --line:#26313f;
  --text:#eef1f5;
  --muted:#8b96a6;
  --muted-2:#5c6779;
  --teamA:#2fb8c6;
  --teamA-dim:#1a4249;
  --teamB:#e8823a;
  --teamB-dim:#4a3320;
  --good:#37c98a;
  --good-dim:#123527;
  --bad:#e5566a;
  --bad-dim:#3a1a20;
  --net-white:#eef1f5;
  --radius:14px;
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100%;overscroll-behavior:none;}
body{min-height:100vh; display:flex; flex-direction:column;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

.court-bg{
  position:fixed; inset:0; z-index:-1;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(47,184,198,0.08), transparent 60%),
    radial-gradient(ellipse 900px 500px at 50% 110%, rgba(232,130,58,0.07), transparent 60%),
    var(--bg);
}

/* ===== Net divider (signature element) ===== */
.net-divider{
  position:relative;
  height:22px;
  margin:0 12px;
  background-image:
    repeating-linear-gradient(90deg, transparent 0 14px, rgba(238,241,245,0.16) 14px 15px),
    repeating-linear-gradient(0deg, transparent 0 6px, rgba(238,241,245,0.16) 6px 7px);
  border-top:2px solid rgba(238,241,245,0.5);
  border-bottom:2px solid rgba(238,241,245,0.5);
  opacity:0.7;
}
.net-antenna{
  position:absolute; top:-2px; bottom:-2px; width:4px;
  background:repeating-linear-gradient(0deg, #e5566a 0 6px, #eef1f5 6px 12px);
  border-radius:2px;
}

/* ===== Top bar ===== */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; border-bottom:1px solid var(--line);
  background:rgba(20,27,38,0.7); backdrop-filter:blur(8px);
  position:sticky; top:0; z-index:20;
}
.brand{display:flex; align-items:center; gap:8px; font-family:'Teko',sans-serif; font-size:22px; letter-spacing:0.5px; font-weight:600; color:var(--text);}
.brand .ball{width:16px;height:16px;border-radius:50%;background:conic-gradient(from 45deg,#2fb8c6 0 90deg,#eef1f5 90deg 180deg,#e8823a 180deg 270deg,#eef1f5 270deg 360deg); box-shadow:0 0 0 1px rgba(255,255,255,0.15) inset;}
.topbar-actions{display:flex; gap:8px; align-items:center;}
.version-badge{
  display:flex; flex-direction:column; align-items:flex-end; justify-content:center;
  background:var(--bg-elev-2); border:1px solid var(--line); border-radius:10px;
  padding:4px 10px; cursor:pointer; line-height:1.2;
}
.version-badge #versionTag{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; color:var(--text);}
.version-badge .version-date{font-size:9px; color:var(--muted-2); font-weight:600;}
.version-badge:active{transform:scale(0.96);}

.width-panel{
  display:flex; flex-direction:column; gap:8px; padding:10px 14px;
  background:rgba(20,27,38,0.92); border-bottom:1px solid var(--line); backdrop-filter:blur(8px);
}
.dim-row{display:flex; align-items:center; gap:10px;}
.width-panel-label{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; flex-shrink:0; width:48px;}
.width-panel input[type=range]{
  flex:1; -webkit-appearance:none; appearance:none; height:4px; border-radius:2px;
  background:var(--line); outline:none; cursor:pointer;
}
.width-panel input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:18px; height:18px; border-radius:50%;
  background:var(--teamA); cursor:pointer; border:2px solid var(--bg);
}
.width-panel input[type=range]::-moz-range-thumb{
  width:18px; height:18px; border-radius:50%; background:var(--teamA); cursor:pointer; border:2px solid var(--bg);
}
.width-panel-value{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); flex-shrink:0; width:52px; text-align:right;}
.dim-actions{display:flex; gap:8px; justify-content:center;}
.width-panel-reset{
  background:var(--bg-elev-2); border:1px solid var(--line); color:var(--muted);
  font-size:10.5px; font-weight:700; padding:6px 12px; border-radius:8px; cursor:pointer;
}
.width-panel-reset:active{background:var(--bg-elev);}
#widthSavePrefs{color:var(--good); border-color:rgba(55,201,138,0.35); background:var(--good-dim);}

#btnWidthAdjust{font-size:12px; letter-spacing:-2px;}
.changelog-sheet .sheet{max-height:78vh;}
.changelog-entry{border-bottom:1px solid var(--line); padding:12px 2px;}
.changelog-entry:last-child{border-bottom:none;}
.changelog-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px;}
.changelog-ver{font-family:'Teko',sans-serif; font-size:20px; font-weight:600; color:var(--teamA);}
.changelog-date{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted-2);}
.changelog-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px;}
.changelog-list li{font-size:13px; color:var(--muted); padding-left:14px; position:relative;}
.changelog-list li::before{content:"–"; position:absolute; left:0; color:var(--muted-2);}
.changelog-current-tag{font-size:9px; text-transform:uppercase; letter-spacing:0.4px; font-weight:700; color:var(--good); background:var(--good-dim); padding:2px 6px; border-radius:5px;}

.archive-item{border-bottom:1px solid var(--line); padding:14px 2px;}
.archive-item:last-child{border-bottom:none;}
.archive-item-head{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:6px;}
.archive-matchup{font-family:'Teko',sans-serif; font-size:19px; font-weight:600;}
.archive-vs{color:var(--muted-2); font-size:14px; margin:0 4px;}
.archive-date{font-size:10.5px; color:var(--muted-2); font-family:'JetBrains Mono',monospace; white-space:nowrap; padding-top:3px;}
.archive-sets-score{font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; color:var(--text); margin-bottom:6px;}
.archive-sets-label{font-size:10px; color:var(--muted-2); text-transform:uppercase; font-weight:600; font-family:'Inter',sans-serif;}
.archive-sets-list{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
.set-pill-mini{font-family:'JetBrains Mono',monospace; font-size:11px; background:var(--bg-elev-2); border:1px solid var(--line); border-radius:7px; padding:3px 8px; color:var(--muted);}
.archive-stats-toggle{font-size:11.5px; font-weight:700; color:var(--teamA); cursor:pointer; display:inline-block;}
.archive-stats-block{margin-top:10px; display:none;}
.archive-stats-block.show{display:block;}
.icon-btn{
  background:var(--bg-elev-2); border:1px solid var(--line); color:var(--muted);
  width:36px;height:36px;border-radius:10px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:16px; position:relative;
}
.icon-btn:active{transform:scale(0.94);}
.icon-btn.listening{
  background:var(--bad-dim); border-color:rgba(229,86,106,0.5); color:var(--bad);
  animation: micPulse 1.2s ease-in-out infinite;
}
@keyframes micPulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(229,86,106,0.45); }
  50%{ box-shadow:0 0 0 6px rgba(229,86,106,0); }
}
.unsaved-dot{
  position:absolute; top:-3px; right:-3px; width:11px; height:11px; border-radius:50%;
  background:var(--bad); border:2px solid var(--bg); display:none;
}
.unsaved-dot.show{display:block;}

/* ===== Layout ===== */
.app{flex:1; display:flex; flex-direction:column; max-width:720px; margin:0 auto; width:100%; padding-bottom:16px;}
.hidden{display:none !important;}

/* ===== Setup screen ===== */
.setup-wrap{padding:20px 16px 40px;}
.setup-hero{text-align:center; margin-bottom:24px;}
.setup-hero h1{font-family:'Teko',sans-serif; font-size:52px; line-height:0.95; margin:0; font-weight:700; letter-spacing:0.5px;}
.setup-hero p{color:var(--muted); margin:6px 0 0; font-size:14px;}
.card{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
.card h2{font-family:'Teko',sans-serif; font-size:24px; font-weight:600; margin:0 0 12px; letter-spacing:0.3px; color:var(--muted);}
.team-setup{display:flex; gap:12px; margin-bottom:14px;}
.team-setup .card{flex:1; margin-bottom:0;}
.team-setup.stacked{flex-direction:column;}
input[type=text], input[type=password], select{
  width:100%; background:var(--bg-elev-2); border:1px solid var(--line); color:var(--text);
  padding:10px 12px; border-radius:10px; font-size:15px; font-family:'Inter',sans-serif; outline:none;
}
input[type=text]:focus, input[type=password]:focus, select:focus{border-color:var(--muted-2);}
.team-name-input{font-family:'Teko',sans-serif; font-size:22px; font-weight:600; padding:8px 12px;}
.color-dot{width:10px;height:10px;border-radius:50%;display:inline-block; margin-right:6px;}
label.field-label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted-2); margin:10px 0 5px; font-weight:600;}

.player-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.player-row input[type=text]{flex:1;}
.player-row select{width:88px; flex-shrink:0;}
.player-row .rm-btn{
  width:34px;height:34px;flex-shrink:0; border-radius:9px; border:1px solid var(--line); background:var(--bg-elev-2);
  color:var(--bad); font-size:16px; cursor:pointer;
}
.add-player-btn{
  width:100%; padding:10px; border-radius:10px; border:1px dashed var(--line); background:transparent;
  color:var(--muted); font-size:14px; cursor:pointer; margin-top:2px; font-weight:600;
}
.add-player-btn:active{background:var(--bg-elev-2);}

.team-card{position:relative; padding:10px;}
#teamsContainer{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;}
.team-card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; gap:4px;}
.team-card-head h2{font-size:16px; margin:0;}
.team-card .field-label{font-size:9px; margin:6px 0 4px;}
.team-card .player-row{gap:4px; margin-bottom:5px;}
.team-card .player-row input[type=text]{padding:6px 6px; font-size:11px; border-radius:7px;}
.team-card .player-row select{width:38px; flex-shrink:0; padding:6px 1px; font-size:9.5px; border-radius:7px;}
.team-card .player-row .rm-btn{width:22px; height:22px; font-size:12px; border-radius:6px; flex-shrink:0;}
.team-card .add-player-btn{padding:6px; font-size:11px;}
.rm-team-btn{
  background:transparent; border:1px solid var(--line); color:var(--bad); font-size:9.5px; font-weight:700;
  padding:4px 6px; border-radius:7px; cursor:pointer; white-space:nowrap; flex-shrink:0;
}
.rm-team-btn:active{background:var(--bad-dim);}
.add-team-btn{
  width:100%; padding:12px; border-radius:12px; border:1px dashed var(--muted-2); background:transparent;
  color:var(--text); font-size:14px; cursor:pointer; margin-bottom:14px; font-weight:700;
}
.add-team-btn:active{background:var(--bg-elev-2);}
.infinite-note{
  background:var(--good-dim); border:1px solid rgba(55,201,138,0.3); border-radius:10px;
  padding:10px 12px; font-size:12.5px; color:var(--muted); margin-bottom:14px; line-height:1.5;
}
.infinite-note strong{color:var(--good);}
#matchupWrap{margin-bottom:14px;}
#matchupWrap .opt-row select{
  flex:1; background:var(--bg-elev-2); border:1px solid var(--line); color:var(--text);
  padding:10px; border-radius:10px; font-family:'Teko',sans-serif; font-size:17px; font-weight:600;
}
.opt-row{display:flex; gap:8px;}
.opt-btn{
  flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg-elev-2);
  color:var(--muted); font-weight:700; cursor:pointer; font-family:'Teko',sans-serif; font-size:18px;
}
.opt-btn.active{background:var(--bg-elev-2); border-color:currentColor;}
.opt-btn.active.a{color:var(--teamA); box-shadow:0 0 0 1px var(--teamA) inset;}
.opt-btn.active.b{color:var(--teamB); box-shadow:0 0 0 1px var(--teamB) inset;}

.start-btn{
  width:100%; padding:16px; border-radius:14px; border:none; margin-top:6px;
  background:linear-gradient(180deg, #37c98a, #279c6b); color:#06231a; font-weight:800; font-size:17px;
  cursor:pointer; box-shadow:var(--shadow);
}
.start-btn:active{transform:scale(0.99);}
.start-btn.secondary{background:var(--bg-elev-2); border:1px solid var(--line); color:var(--text); box-shadow:none;}
.start-btn.danger{background:var(--bad-dim); border:1px solid rgba(229,86,106,0.4); color:var(--bad); box-shadow:none;}
.err-msg{color:var(--bad); font-size:13px; margin-top:8px; text-align:center;}

/* ===== Scoreboard ===== */
.scoreboard{
  display:flex; align-items:stretch; gap:0; margin:14px 12px 6px; border-radius:16px; overflow:hidden;
  border:1px solid var(--line); box-shadow:var(--shadow);
}
.score-side{flex:1; padding:21px 15px 18px; text-align:center; position:relative;}
.score-side.a{background:linear-gradient(180deg, var(--teamA-dim), var(--bg-elev));}
.score-side.b{background:linear-gradient(180deg, var(--teamB-dim), var(--bg-elev));}
.score-name{font-size:18px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.score-side.a .score-name{color:var(--teamA);}
.score-side.b .score-name{color:var(--teamB);}
.score-num{font-family:'Teko',sans-serif; font-size:114px; line-height:0.9; font-weight:700; margin:2px 0 0;}
.serve-dot{
  display:inline-block; font-size:15px; line-height:1; margin-left:6px; margin-bottom:2px;
  animation: serveSpin 1.1s linear infinite;
}
@keyframes serveSpin{
  from{ transform:rotate(0deg); }
  to{ transform:rotate(360deg); }
}
.score-mid{
  width:111px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--bg-elev-2); border-left:1px solid var(--line); border-right:1px solid var(--line); padding:12px 6px;
}
.set-label{font-size:15px; color:var(--muted-2); text-transform:uppercase; letter-spacing:0.5px; font-weight:700;}
.set-num{font-family:'Teko',sans-serif; font-size:45px; font-weight:700; line-height:1;}
.sets-score{font-family:'JetBrains Mono',monospace; font-size:20px; color:var(--muted); margin-top:4px;}

/* ===== Tabs ===== */
.tabs{display:flex; margin:14px 12px 0; background:var(--bg-elev); border:1px solid var(--line); border-radius:12px; padding:3px;}
.tab-btn{flex:1; text-align:center; padding:9px 4px; border-radius:9px; font-size:13px; font-weight:700; color:var(--muted); cursor:pointer; border:none; background:transparent; font-family:'Inter',sans-serif;}
.tab-btn.active{background:var(--bg-elev-2); color:var(--text);}

/* ===== Court view: players ===== */
.court-view{padding:14px 12px 0; display:flex; gap:10px;}
#tabCourt.hidden{display:flex !important;} /* quadra fica sempre visível; estatísticas/histórico aparecem abaixo dela */
.team-col{flex:1; display:flex; flex-direction:column; gap:8px;}
.team-col-header{display:flex; align-items:center; justify-content:space-between; padding:0 2px 2px;}
.team-col-header .tname{font-family:'Teko',sans-serif; font-size:19px; font-weight:600; letter-spacing:0.3px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.team-col.a .tname{color:var(--teamA);}
.team-col.b .tname{color:var(--teamB);}
.quick-pt{
  font-size:10px; font-weight:700; color:var(--muted); background:var(--bg-elev-2); border:1px solid var(--line);
  border-radius:7px; padding:4px 7px; cursor:pointer; flex-shrink:0;
}
.player-card{
  display:flex; flex-direction:column; gap:8px;
  background:var(--bg-elev); border:1px solid var(--line); border-radius:12px; padding:9px 10px;
}
.player-info{display:flex; align-items:center; gap:7px; min-width:0;}
.pos-badge{
  font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; width:26px; height:20px; flex-shrink:0;
  border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--bg);
}
.team-col.a .pos-badge{background:var(--teamA);}
.team-col.b .pos-badge{background:var(--teamB);}
.player-name{flex:1; min-width:0; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.player-pts{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted-2); flex-shrink:0;}

.player-card.is-serving{border-color:rgba(244,199,68,0.55); box-shadow:0 0 0 1px rgba(244,199,68,0.35) inset;}
.serving-tag{
  font-size:9.5px; font-weight:800; color:#0c0904; background:#f4c744;
  padding:2px 6px; border-radius:6px; white-space:nowrap; flex-shrink:0; letter-spacing:0.2px;
}

.mini-action-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:9px;}
.mini-action{
  padding:20px 8px; min-height:58px; border-radius:10px; border:1px solid var(--line); background:var(--bg-elev-2);
  color:var(--text); font-size:14px; font-weight:700; cursor:pointer; text-align:center; font-family:'Inter',sans-serif;
}

/* Modo de expansão: ativado pela régua de altura, faz os quadrinhos dos
   jogadores crescerem para preencher a altura escolhida (mesmo que ultrapasse
   a tela visível — a página rola normalmente para mostrar o restante). */
body.court-expand-mode #playersA,
body.court-expand-mode #playersB{
  display:flex; flex-direction:column; min-height:0;
}
body.court-expand-mode .player-card{
  flex:1; min-height:0; display:flex; flex-direction:column;
}
body.court-expand-mode .player-info{flex-shrink:0;}
body.court-expand-mode .mini-action-grid{
  flex:1; min-height:0; grid-auto-rows:1fr;
}
body.court-expand-mode .mini-action{
  display:flex; align-items:center; justify-content:center;
}
.mini-action.good{border-color:rgba(55,201,138,0.35); background:var(--good-dim); color:var(--good);}
.mini-action.bad{border-color:rgba(229,86,106,0.35); background:var(--bad-dim); color:var(--bad);}
.mini-action.neutral{color:var(--muted);}
.mini-action.yellow{border-color:rgba(244,199,68,0.5); background:rgba(244,199,68,0.16); color:#f4c744;}
.mini-action:active{transform:scale(0.94);}

/* ===== Stats tab ===== */
.stats-view{padding:14px 12px 0;}
.export-btn{
  width:100%; padding:11px; border-radius:12px; border:1px solid rgba(47,184,198,0.4);
  background:var(--teamA-dim); color:var(--teamA); font-weight:700; font-size:13px;
  cursor:pointer; margin-bottom:14px;
}
.export-btn:active{transform:scale(0.98);}
.stats-team-block{margin-bottom:16px;}
.stats-team-title{font-family:'Teko',sans-serif; font-size:20px; font-weight:600; margin:0 0 8px 2px;}
.team-col.a .stats-team-title, .stats-team-title.a{color:var(--teamA);}
.team-col.b .stats-team-title, .stats-team-title.b{color:var(--teamB);}
table.stats-table{width:100%; border-collapse:collapse; font-size:11.5px; background:var(--bg-elev); border-radius:12px; overflow:hidden; border:1px solid var(--line);}
table.stats-table th, table.stats-table td{padding:7px 5px; text-align:center; border-bottom:1px solid var(--line); font-family:'JetBrains Mono',monospace;}
table.stats-table th{color:var(--muted-2); font-weight:600; font-size:9.5px; text-transform:uppercase; letter-spacing:0.3px;}
table.stats-table td:first-child, table.stats-table th:first-child{text-align:left; font-family:'Inter',sans-serif; font-weight:600; padding-left:10px; color:var(--text); font-size:12px;}
table.stats-table tr:last-child td{border-bottom:none;}
.tot-row td{font-weight:700; color:var(--text); background:rgba(255,255,255,0.02);}

/* ===== History tab ===== */
.history-view{padding:14px 12px 0;}
.hist-item{display:flex; align-items:center; gap:10px; padding:9px 12px; background:var(--bg-elev); border:1px solid var(--line); border-radius:10px; margin-bottom:6px; font-size:13px;}
.hist-dot{width:8px;height:8px;border-radius:50%; flex-shrink:0;}
.hist-dot.a{background:var(--teamA);} .hist-dot.b{background:var(--teamB);}
.hist-text{flex:1; color:var(--muted);}
.hist-text b{color:var(--text); font-weight:600;}
.hist-set{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--muted-2);}
.empty-note{text-align:center; color:var(--muted-2); font-size:13px; padding:30px 10px;}
.sets-summary{margin-bottom:14px;}
.sets-summary-title{font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted-2); font-weight:700; margin:0 2px 8px;}
.sets-summary-list{display:flex; flex-wrap:wrap; gap:8px;}
.set-pill{
  display:flex; flex-direction:column; align-items:center; gap:2px;
  background:var(--bg-elev); border:1px solid var(--line); border-radius:10px; padding:7px 12px;
}
.set-pill-num{font-size:9.5px; color:var(--muted-2); text-transform:uppercase; letter-spacing:0.4px; font-weight:700;}
.set-pill-score{font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700; color:var(--text);}
.set-pill-score.a{color:var(--teamA);}
.set-pill-score.b{color:var(--teamB);}

/* ===== Bottom action bar ===== */
.bottombar{
  display:flex; gap:8px; width:100%;
  margin:64px auto 24px; max-width:720px;
  background:rgba(20,27,38,0.9); border:1px solid var(--line); border-radius:14px;
  padding:12px 12px calc(12px + env(safe-area-inset-bottom));
}
.bar-btn{
  flex:1; padding:11px 4px; border-radius:12px; border:1px solid var(--line); background:var(--bg-elev-2);
  color:var(--text); font-weight:700; font-size:12.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:4px; text-align:center;
}
.bar-btn.undo{color:var(--muted);}
.bar-btn.redo{color:var(--muted);}
.bar-btn.primary{background:var(--good-dim); border-color:rgba(55,201,138,0.4); color:var(--good);}
.bar-btn:active{transform:scale(0.97);}
.bar-btn:disabled{opacity:0.35;}

/* ===== Sheet (bottom modal) ===== */
.sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:40; display:flex; align-items:flex-end; justify-content:center;}
.sheet{
  width:100%; max-width:720px; background:var(--bg-elev); border-radius:20px 20px 0 0; border:1px solid var(--line); border-bottom:none;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-height:82vh; overflow-y:auto;
  animation:sheetUp .18s ease-out;
}
@keyframes sheetUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:36px;height:4px;background:var(--line); border-radius:2px; margin:0 auto 12px;}
.sheet-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.sheet-header .who{font-family:'Teko',sans-serif; font-size:26px; font-weight:600;}
.sheet-header .close-x{color:var(--muted); font-size:22px; cursor:pointer; padding:4px;}

/* ===== Set/Match end overlay ===== */
.celebrate{position:fixed; inset:0; z-index:50; background:rgba(6,9,14,0.88); display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:24px;}
.celebrate h2{font-family:'Teko',sans-serif; font-size:44px; margin:0 0 6px;}
.celebrate p{color:var(--muted); margin:0 0 22px; font-size:14px;}
.celebrate .cel-btn{padding:13px 28px; border-radius:12px; border:none; background:var(--teamA); color:#04252a; font-weight:800; cursor:pointer;}

.toast{position:fixed; top:64px; left:50%; transform:translateX(-50%); background:var(--bg-elev-2); border:1px solid var(--line); padding:9px 16px; border-radius:10px; font-size:13px; z-index:60; color:var(--text); box-shadow:var(--shadow);}
.toast-error{background:var(--bad-dim); border-color:rgba(229,86,106,0.5); color:var(--bad); font-weight:700;}

.error-banner{
  background:var(--bad-dim); color:var(--bad); border-bottom:2px solid var(--bad);
  font-size:13px; font-weight:800; text-align:center; padding:9px 12px; letter-spacing:0.2px;
}

@media (max-width:360px){
  .score-num{font-size:90px;}
}

/* ===== Modo paisagem: tela mais larga, 6 jogadores sem rolagem, abas abaixo da quadra ===== */
@media (orientation: landscape){
  .app{max-width:100%; padding-bottom:12px;}
  #playersA, #playersB{display:flex; flex-direction:column; gap:6px;}

  .topbar{padding:4px 10px;}
  .brand{display:none;}
  .icon-btn{width:26px; height:26px; font-size:12px;}
  .version-badge{padding:2px 6px;}
  .version-badge #versionTag{font-size:9px;}
  .version-badge .version-date{font-size:8px;}

  .scoreboard{margin:5px 10px 6px;}
  .score-side{padding:8px 8px 6px;}
  .score-num{font-size:78px;}
  .score-name{font-size:18px;}
  .score-mid{width:96px; padding:5px 2px;}
  .set-num{font-size:39px;}
  .sets-score{font-size:18px; margin-top:2px;}
  .set-label{font-size:13px;}

  #matchScreen{display:flex; flex-direction:column;}
  .scoreboard{order:0;}
  #tabCourt{order:1;}
  .tabs{order:6;}
  #tabStats{order:7;}
  #tabHistory{order:7;}

  .court-view{padding:4px 10px 0; gap:12px; flex:1;}
  .team-col{gap:6px;}
  .team-col-header{padding:0 1px 0;}
  .tname{font-size:16px;}
  .quick-pt{font-size:10px; padding:4px 7px;}

  .player-card{flex-direction:row; align-items:center; gap:5px; padding:8px 8px; border-radius:11px;}
  .player-info{flex-shrink:0; width:auto; max-width:38%;}
  .serving-tag{font-size:8px; padding:1px 4px;}
  .pos-badge{width:22px; height:19px; font-size:9.5px; border-radius:6px;}
  .player-name{font-size:18px; max-width:150px;}
  .player-pts{font-size:10.5px;}
  .mini-action-grid{grid-template-columns:repeat(9,1fr); gap:1px; flex:1;}
  .mini-action{padding:8px 10px; min-height:34px; font-size:12px; border-radius:8px;}

  .bottombar{order:5; padding:6px 10px calc(6px + env(safe-area-inset-bottom)); margin:32px auto 16px;}
  .bar-btn{padding:9px 4px; font-size:11.5px;}
}
</style>
</head>
<body>
<div class="court-bg"></div>

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand"><span class="ball"></span> Marcação Vôlei</div>
  <div class="topbar-actions">
    <div class="icon-btn" id="btnSaveCloud" title="Salvar na nuvem (opcional)">☁<span class="unsaved-dot" id="unsavedDot"></span></div>
    <div class="icon-btn" id="btnArchive" title="Partidas encerradas">📋</div>
    <div class="icon-btn" id="btnSpeech" title="Narração por voz: ligada">🔊</div>
    <div class="icon-btn" id="btnVoiceCmd" title="Marcar pontos por comando de voz">🎤</div>
    <div class="icon-btn" id="btnWidthAdjust" title="Ajustar largura e altura da tela">↕↔</div>
    <div class="version-badge" id="btnVersion" title="Ver histórico de versões">
      <span id="versionTag">v1.0</span><span class="version-date" id="versionDate"></span>
    </div>
    <div class="icon-btn hidden" id="btnEditTeams" title="Voltar para formação dos times">👥</div>
    <div class="icon-btn hidden" id="btnBackTab" title="Voltar para aba anterior">←</div>
    <div class="icon-btn" id="btnReset" title="Novo jogo">⟳</div>
  </div>
</div>

<div class="width-panel hidden" id="widthPanel">
  <div class="dim-row">
    <span class="width-panel-label">Largura</span>
    <input type="range" id="widthSlider" min="360" max="1400" step="20" value="720">
    <span class="width-panel-value" id="widthValue">720px</span>
  </div>
  <div class="dim-row">
    <span class="width-panel-label">Altura</span>
    <input type="range" id="heightSlider" min="300" max="1400" step="20" value="700">
    <span class="width-panel-value" id="heightValue">Auto</span>
  </div>
  <div class="dim-actions">
    <button class="width-panel-reset" id="widthSavePrefs" title="Salvar como preferência">💾 Salvar preferências</button>
    <button class="width-panel-reset" id="widthReset" title="Voltar ao automático">↺ Redefinir automático</button>
  </div>
</div>

<div class="error-banner hidden" id="errorBanner"></div>

<div class="app">

  <!-- ===================== SETUP SCREEN ===================== -->
  <div id="setupScreen" class="setup-wrap hidden">
    <div class="setup-hero">
      <h1>Nova Partida</h1>
      <p>Cadastre os times, o elenco e comece a marcar.</p>
    </div>

    <div id="teamsContainer"></div>
    <button class="add-team-btn" id="btnAddTeam">+ adicionar time</button>

    <div class="card" id="matchConfigCard">
      <div id="matchupWrap" class="hidden">
        <label class="field-label">Times desta partida</label>
        <div class="opt-row">
          <select id="selectActiveA"></select>
          <select id="selectActiveB"></select>
        </div>
      </div>
    </div>

    <button class="start-btn secondary hidden" id="btnBackToMatch">Voltar para a partida</button>
    <button class="start-btn" id="btnStart">Iniciar Partida</button>
    <button class="start-btn danger hidden" id="btnEndMatchSetup">Encerrar partida</button>
    <button class="export-btn" id="btnExportXls">📤 Exportar dados (XLS)</button>
    <div class="err-msg hidden" id="setupErr"></div>
  </div>

  <!-- ===================== MATCH SCREEN ===================== -->
  <div id="matchScreen" class="hidden">

    <div class="scoreboard">
      <div class="score-side a">
        <div class="score-name" id="mNameA">TIME 1</div>
        <div class="score-num" id="mScoreA">0<span class="serve-dot hidden" id="serveDotA">🏐</span></div>
      </div>
      <div class="score-mid">
        <div class="set-label">Set</div>
        <div class="set-num" id="mSetNum">1</div>
      </div>
      <div class="score-side b">
        <div class="score-name" id="mNameB">TIME 2</div>
        <div class="score-num" id="mScoreB"><span class="serve-dot hidden" id="serveDotB">🏐</span>0</div>
      </div>
    </div>

    <!-- COURT / players — sempre visível, logo abaixo do placar -->
    <div id="tabCourt" class="court-view">
      <div class="team-col a">
        <div class="team-col-header"><span class="tname" id="colNameA">Time 1</span><span class="quick-pt" data-team="A">+1 direto</span></div>
        <div id="playersA"></div>
      </div>
      <div class="team-col b">
        <div class="team-col-header"><span class="tname" id="colNameB">Time 2</span><span class="quick-pt" data-team="B">+1 direto</span></div>
        <div id="playersB"></div>
      </div>
    </div>

    <!-- Ações de desfazer/refazer/encerrar set — bem abaixo dos jogadores,
         de propósito, para não aparecer junto do resto e exigir rolagem -->
    <div class="bottombar hidden" id="bottomBar">
      <button class="bar-btn undo" id="btnUndo">↩︎ Desfazer</button>
      <button class="bar-btn redo" id="btnRedo">↪︎ Refazer</button>
      <button class="bar-btn primary" id="btnEndSet">Encerrar set</button>
    </div>

    <!-- Estatísticas / Histórico — ainda mais abaixo, depois das ações -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="court">Quadra</button>
      <button class="tab-btn" data-tab="stats">Estatísticas</button>
      <button class="tab-btn" data-tab="history">Histórico</button>
    </div>

    <div id="tabStats" class="stats-view hidden">
      <div id="statsContent"></div>
    </div>

    <div id="tabHistory" class="history-view hidden"></div>

  </div>
</div>

<script>

let state = null;      // full match state
let undoStack = [];    // snapshots for undo
let redoStack = [];    // snapshots for redo (desfeitos pelo botão Desfazer)
let activeTab = "court";
let tabStack = [];

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

function uid(){ return Math.random().toString(36).slice(2,9); }
function emptyStats(){ const o={}; ALL_STAT_KEYS.forEach(k=>o[k]=0); return o; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

function newPlayer(name, pos){
  return {id:uid(), name:name||"", pos:pos||"P1", stats: emptyStats()};
}
function newTeam(name){
  return {
    id:uid(),
    name:name||"",
    players:[newPlayer("","LE"), newPlayer("","P1"), newPlayer("","CE"), newPlayer("","OP"), newPlayer("","P2"), newPlayer("","LI")]
  };
}
function teamBy(id){ return state.teams.find(t=>t.id===id); }
function findPlayerAnywhereById(id){
  for(const t of state.teams){
    const p = t.players.find(pl=>pl.id===id);
    if(p) return p;
  }
  return null;
}
function slotTeam(slot){ return teamBy(slot==='A' ? state.activeAId : state.activeBId); }
function teamDisplayName(team){
  if(!team) return '';
  const idx = state.teams.findIndex(t=>t.id===team.id);
  return 'Time ' + (idx+1);
}

/* ---------------- rodízio automático de saque -----------------
   Sequência fixa de posições: LE, P1, CE, OP, P2, LI (POSITIONS).
   Cada time tem seu próprio ponteiro de rodízio, independente do
   adversário: toda vez que o time reconquista o saque (side-out a
   favor dele), avança uma posição — ex: depois que o Levantador (LE)
   sacou, a próxima vez que o MESMO time sacar será com o P1. */
function assignServerForRotation(team){
  const startedKey = team==='A' ? 'rotationStartedA' : 'rotationStartedB';
  const idxKey = team==='A' ? 'rotationIndexA' : 'rotationIndexB';
  if(state[startedKey]){
    state[idxKey] = (state[idxKey] + 1) % POSITIONS.length;
  } else {
    state[startedKey] = true; // primeira vez sacando neste set — começa no Levantador (LE)
  }
  const pos = POSITIONS[state[idxKey]];
  const teamObj = slotTeam(team);
  const player = teamObj ? teamObj.players.find(p=>p.pos===pos) : null;
  if(player) state.servingPlayerId = player.id;
  state.serveConfirmed = false; // ainda não confirmado — precisa marcar o saque
}
function resetRotation(){
  state.rotationIndexA = 0;
  state.rotationIndexB = 0;
  state.rotationStartedA = false;
  state.rotationStartedB = false;
}

function defaultState(){
  const t1 = newTeam(""), t2 = newTeam("");
  return {
    started:false,
    teams:[t1, t2],
    activeAId: t1.id,
    activeBId: t2.id,
    serve: null, // indefinido até o primeiro saque ser marcado na quadra
    servingPlayerId: null, // jogador marcado como sacando (indicação visual)
    serveConfirmed: false, // true depois que o saque desta jogada foi marcado (botão Saq)
    errorMessage: null,    // erro de marcação (saque esquecido/errado) — some só quando corrigido
    rotationIndexA: 0,      // posição atual do rodízio do time A (índice em POSITIONS)
    rotationIndexB: 0,      // posição atual do rodízio do time B
    rotationStartedA: false, // time A já sacou nesse set?
    rotationStartedB: false, // time B já sacou nesse set?
    setNum: 1,
    score: {A:0, B:0},
    setsHistory: [],   // completed sets {a,b}
    setsWonA: 0,
    setsWonB: 0,
    matchOver: false,
    history: []        // event log: {set, team, player, actionKey, label, pt}
  };
}

/* ---------------- persistence ----------------
   Os dados da partida ficam apenas na memória deste dispositivo/aba.
   O salvamento na nuvem só acontece quando o usuário toca no botão ☁ (manual). */
function delay(ms){ return new Promise(res=>setTimeout(res,ms)); }

let hasUnsavedChanges = false;
function markDirty(){
  hasUnsavedChanges = true;
  updateSaveIndicator();
}
function markClean(){
  hasUnsavedChanges = false;
  updateSaveIndicator();
}
function updateSaveIndicator(){
  const dot = $('#unsavedDot'), cloudBtn = $('#btnSaveCloud');
  if(dot) dot.classList.toggle('show', hasUnsavedChanges);
  if(cloudBtn) cloudBtn.title = hasUnsavedChanges ? 'Alterações não salvas — toque para salvar na nuvem' : 'Salvar na nuvem (opcional)';
}

let matchArchive = [];

async function saveState(){
  const payload = JSON.stringify({ match: state, archive: matchArchive });
  for(let attempt=0; attempt<2; attempt++){
    try{
      const result = await window.storage.set('volei_match_current', payload);
      if(result){
        showToast('Partida salva na nuvem.');
        markClean();
        return true;
      }
      throw new Error('Resposta vazia do armazenamento');
    }catch(e){
      console.error('Falha ao salvar (tentativa '+(attempt+1)+'):', e);
      if(attempt===0) await delay(500);
    }
  }
  showToast('Não foi possível salvar na nuvem agora. Tente novamente.');
  return false;
}
async function loadState(){
  try{
    const r = await window.storage.get('volei_match_current');
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      let loadedMatch, loadedArchive;
      if(parsed && parsed.match){
        loadedMatch = parsed.match;
        loadedArchive = Array.isArray(parsed.archive) ? parsed.archive : [];
      } else {
        // formato salvo antes de existir o arquivo de partidas encerradas
        loadedMatch = parsed;
        loadedArchive = [];
      }
      migrateState(loadedMatch);
      matchArchive = loadedArchive;
      return loadedMatch;
    }
  }catch(e){ /* not found */ }
  return null;
}
function migrateState(loaded){
  // versões antigas guardavam teamA/teamB fixos + bestOf; converte para lista de times
  if(!loaded.teams && loaded.teamA && loaded.teamB){
    const tA = {id:uid(), name:loaded.teamA.name||"", players:loaded.teamA.players||[]};
    const tB = {id:uid(), name:loaded.teamB.name||"", players:loaded.teamB.players||[]};
    loaded.teams = [tA, tB];
    loaded.activeAId = tA.id;
    loaded.activeBId = tB.id;
    delete loaded.teamA;
    delete loaded.teamB;
    delete loaded.bestOf;
  }
  if(loaded.servingPlayerId === undefined) loaded.servingPlayerId = null;
  if(loaded.serveConfirmed === undefined) loaded.serveConfirmed = false;
  if(loaded.errorMessage === undefined) loaded.errorMessage = null;
  if(loaded.rotationIndexA === undefined) loaded.rotationIndexA = loaded.rotationIndex || 0;
  if(loaded.rotationIndexB === undefined) loaded.rotationIndexB = loaded.rotationIndex || 0;
  if(loaded.rotationStartedA === undefined) loaded.rotationStartedA = !!loaded.rotationServedA;
  if(loaded.rotationStartedB === undefined) loaded.rotationStartedB = !!loaded.rotationServedB;
  delete loaded.rotationIndex;
  delete loaded.rotationServedA;
  delete loaded.rotationServedB;
}

function expectedServerForTeam(team){
  const teamObj = slotTeam(team);
  if(!teamObj) return null;
  // se o jogador marcado como sacando agora pertence a este time, prioriza ele
  // (cobre correções manuais feitas pelo botão Saq)
  if(state.servingPlayerId){
    const marked = teamObj.players.find(p=>p.id===state.servingPlayerId);
    if(marked) return marked;
  }
  const idx = team==='A' ? state.rotationIndexA : state.rotationIndexB;
  const pos = POSITIONS[idx];
  return teamObj.players.find(p=>p.pos===pos) || null;
}

function renderScoreboard(){
  const a = slotTeam('A'), b = slotTeam('B');
  $('#mNameA').textContent = teamDisplayName(a).toUpperCase();
  $('#mNameB').textContent = teamDisplayName(b).toUpperCase();
  // início do set: ninguém sacou ainda (placar 0-0 e nenhum saque confirmado) —
  // não mostra bolinha nem lembrete de saque em nenhum time até isso ser definido,
  // mesmo que "state.serve" tenha ficado com um valor antigo de antes dessa regra
  const serveUndetermined = state.serve===null || (state.score.A===0 && state.score.B===0 && !state.serveConfirmed);
  const servingNowA = !serveUndetermined && state.serve==='A';
  const servingNowB = !serveUndetermined && state.serve==='B';
  const serverA = servingNowA ? expectedServerForTeam('A') : null;
  const serverB = servingNowB ? expectedServerForTeam('B') : null;
  $('#colNameA').textContent = teamDisplayName(a) + (serverA ? ' Saque de ' + serverA.name : '');
  $('#colNameB').textContent = teamDisplayName(b) + (serverB ? ' Saque de ' + serverB.name : '');
  // rebuild score nodes safely
  $('#mScoreA').innerHTML = state.score.A + '<span class="serve-dot '+(servingNowA?'':'hidden')+'" id="serveDotA">🏐</span>';
  $('#mScoreB').innerHTML = '<span class="serve-dot '+(servingNowB?'':'hidden')+'" id="serveDotB">🏐</span>' + state.score.B;
  $('#mSetNum').textContent = state.setNum;
}

/* ---------------- exportar dados em tabela (XLS) ---------------- */
function downloadBlob(filename, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

/* Gera um Excel Spreadsheet XML (formato "Excel XML 2003") na mão, sem
   nenhuma biblioteca externa nem internet — o Excel/LibreOffice/Numbers
   abrem esse XML normalmente com extensão .xls. */
function xmlEscape(str){
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[ch]));
}
function xlsCell(value){
  if(value===null || value===undefined || value===''){
    return '<Cell></Cell>';
  }
  if(typeof value === 'number' && isFinite(value)){
    return '<Cell><Data ss:Type="Number">' + value + '</Data></Cell>';
  }
  return '<Cell><Data ss:Type="String">' + xmlEscape(value) + '</Data></Cell>';
}
function xlsSheetXml(sheetName, rows){
  const rowsXml = rows.map(r => '<Row>' + r.map(xlsCell).join('') + '</Row>').join('');
  return '<Worksheet ss:Name="' + xmlEscape(sheetName) + '"><Table>' + rowsXml + '</Table></Worksheet>';
}
function buildXlsWorkbook(sheets){
  // sheets: [{name, rows}, ...]
  const sheetsXml = sheets.map(sh => xlsSheetXml(sh.name, sh.rows)).join('');
  return '<?xml version="1.0"?>' +
    '<?mso-application progid="Excel.Sheet"?>' +
    '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" ' +
    'xmlns:o="urn:schemas-microsoft-com:office:office" ' +
    'xmlns:x="urn:schemas-microsoft-com:office:excel" ' +
    'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" ' +
    'xmlns:html="http://www.w3.org/TR/REC-html40">' +
    sheetsXml +
    '</Workbook>';
}

function exportMatchXls(){
  const teamA = slotTeam('A'), teamB = slotTeam('B');
  const nameA = teamDisplayName(teamA), nameB = teamDisplayName(teamB);
  const totalSets = state.setNum; // sets já encerrados + o set em curso

  // ---- aba "Sets": placar de cada set jogado ----
  const setsRows = [['Set', nameA, nameB, 'Situação']];
  for(let i=1; i<=totalSets; i++){
    if(i <= state.setsHistory.length){
      const s = state.setsHistory[i-1];
      setsRows.push([i, s.a, s.b, 'Encerrado']);
    } else {
      setsRows.push([i, state.score.A, state.score.B, 'Em andamento']);
    }
  }
  setsRows.push([]);
  setsRows.push(['Sets vencidos', state.setsWonA, state.setsWonB]);

  // ---- aba "Estatísticas": uma linha por jogador em cada set jogado ----
  const statsHeader = ['Nome','Saque','Ataque','Bloqueio','Pingada','Ataque errado','Saque errado','Passe errado','Infração','Ace','Set','Data'];
  const statsRows = [statsHeader];
  const exportDate = new Date().toLocaleDateString('pt-BR');
  for(let setN=1; setN<=totalSets; setN++){
    [teamA, teamB].forEach(team=>{
      team.players.forEach(p=>{
        const s = statsForPlayerInSet(p.id, setN);
        statsRows.push([p.name, s.saqueCerto, s.ataqueCerto, s.bloqueio, s.pingada, s.ataqueErrado, s.saqueErrado, s.passeErrado, s.infracao, s.ace, setN, exportDate]);
      });
    });
  }

  // ---- aba "Jogadas": registro completo de cada marcação individual (nada resumido) ----
  const playsHeader = ['Set','Time','Jogador','Ação','Placar ' + nameA, 'Placar ' + nameB];
  const playsRows = [playsHeader];
  state.history.forEach(ev=>{
    const tname = ev.team==='A' ? nameA : nameB;
    playsRows.push([ev.set, tname, ev.playerName, ev.label, ev.scoreA, ev.scoreB]);
  });

  const xml = buildXlsWorkbook([
    {name:'Sets', rows: setsRows},
    {name:'Estatísticas', rows: statsRows},
    {name:'Jogadas', rows: playsRows}
  ]);
  const blob = new Blob([xml], {type:'application/vnd.ms-excel'});
  const now = new Date();
  const fileName = 'JOGO ' + now.getDate() + '-' + (now.getMonth()+1) + '-' + now.getFullYear() + '.xls';
  downloadBlob(fileName, blob);
  showToast('Dados exportados: ' + fileName);
}

      </tr></thead>

    `;

function formatArchiveDate(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  }catch(e){ return ''; }
}

function buildArchiveStatsTable(players){
  let tot = {ataqueCerto:0,ataqueErrado:0,bloqueio:0,pingada:0,ace:0,saqueCerto:0,saqueErrado:0,passeErrado:0,infracao:0,pts:0};
  const rows = players.map(p=>{
    const s = p.stats;
    const pts = ((s.ataqueCerto||0)+(s.pingada||0)+(s.bloqueio||0)+(s.ace||0)) - ((s.ataqueErrado||0)+(s.saqueErrado||0)+(s.passeErrado||0)+(s.infracao||0));
    Object.keys(tot).forEach(k=>{ if(k!=='pts') tot[k]+=s[k]||0; });
    tot.pts += pts;
    return `<tr><td>${escapeHtml(p.name)}</td><td>${s.ataqueCerto||0}</td><td>${s.ataqueErrado||0}</td><td>${s.bloqueio||0}</td><td>${s.pingada||0}</td><td>${s.ace||0}</td><td>${s.saqueCerto||0}</td><td>${s.saqueErrado||0}</td><td>${s.passeErrado||0}</td><td>${s.infracao||0}</td><td>${pts}</td></tr>`;
  }).join('');
  return `
    <table class="stats-table">
      <thead><tr><th>Jogador</th><th>Atq✓</th><th>Atq✗</th><th>Blq</th><th>Png</th><th>Ace</th><th>Saq</th><th>Sq✗</th><th>Ps✗</th><th>Inf</th><th>Pts</th></tr></thead>
      <tbody>${rows}<tr class="tot-row"><td>Total</td><td>${tot.ataqueCerto}</td><td>${tot.ataqueErrado}</td><td>${tot.bloqueio}</td><td>${tot.pingada}</td><td>${tot.ace}</td><td>${tot.saqueCerto}</td><td>${tot.saqueErrado}</td><td>${tot.passeErrado}</td><td>${tot.infracao}</td><td>${tot.pts}</td></tr></tbody>
    </table>
  `;
}

/* ---------------- narração por voz ---------------- */
let speechEnabled = true;
let suppressVoiceRestart = false;
function speak(text){
  if(!speechEnabled) return;
  try{
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel(); // evita fila/atraso em toques rápidos seguidos
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'pt-BR';
      utter.rate = 1.05;
      // pausa o comando de voz enquanto o app fala, para o microfone não
      // "escutar" a própria narração e disparar uma marcação por engano
      if(voiceListening && voiceRecognition){
        suppressVoiceRestart = true;
        try{ voiceRecognition.stop(); }catch(e){ /* ignore */ }
        utter.onend = ()=>{
          suppressVoiceRestart = false;
          if(voiceListening){ try{ voiceRecognition.start(); }catch(e){ /* ignore */ } }
        };
      }
      window.speechSynthesis.speak(utter);
    }
  }catch(e){ console.error('Falha na narração por voz:', e); }
}

/* ---------------- comando de voz para marcar pontos/saque -----------------
   Fala algo como "Ataque João" ou "Bloqueio Maria" e o app marca sozinho,
   sem precisar tocar no botão do card do jogador. */
function normalizeVoiceText(str){
  return String(str||'')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,''); // remove acentos
}

// ordem importa: frases mais específicas primeiro, para não confundir
// "ataque errado" com "ataque", "saque errado" com "saque" etc.
const VOICE_ACTION_PHRASES = [
  {key:'ataqueErrado', phrases:['ataque errado','erro de ataque','erro ataque']},
  {key:'saqueErrado',  phrases:['saque errado','erro de saque','erro saque']},
  {key:'passeErrado',  phrases:['passe errado','erro de passe','erro passe']},
  {key:'infracao',     phrases:['infracao','falta']},
  {key:'bloqueio',     phrases:['bloqueio','bloco','block']},
  {key:'pingada',      phrases:['pingada','larga','largada','pingar','pingo','pigada']},
  {key:'ace',          phrases:['ace','eice','eis','aice','ecis','ei si','eici','ei se','esse','ici','ah ci','issi']},
  {key:'ataqueCerto',  phrases:['ataque certo','ataque']},
  {key:'saqueCerto',   phrases:['saque certo','saque','sac']},
];

// só processa a fala como comando se ela começar com uma dessas palavras
// (ou uma variação parecida) — evita reagir a conversas/ruído de fundo
const VOICE_TRIGGER_WORDS = ['saque','sac','ataque','pingada','larga','largada','pingar','pingo','pigada','bloqueio','bloco','block','infracao','falta','eice','ace','eis','esse','ici','issi','ei','ah','desfazer','erro','ponto'];
function startsWithVoiceTrigger(text){
  const firstWord = (text.split(/\s+/)[0] || '').trim();
  if(!firstWord) return false;
  return VOICE_TRIGGER_WORDS.some(trig=>{
    if(firstWord===trig || firstWord.startsWith(trig) || trig.startsWith(firstWord)) return true;
    const threshold = Math.max(1, Math.floor(trig.length/3));
    return levenshteinDistance(firstWord, trig) <= threshold;
  });
}

// distância de edição (Levenshtein) — usada para aceitar variações de fala/
// transcrição parecidas com o nome do jogador (ex: "joao"/"jao", "adauto"/"adaltom")
function levenshteinDistance(a, b){
  const m = a.length, n = b.length;
  if(m===0) return n;
  if(n===0) return m;
  const dp = new Array(n+1);
  for(let j=0;j<=n;j++) dp[j] = j;
  for(let i=1;i<=m;i++){
    let prevDiag = dp[0];
    dp[0] = i;
    for(let j=1;j<=n;j++){
      const temp = dp[j];
      dp[j] = a[i-1]===b[j-1] ? prevDiag : 1 + Math.min(prevDiag, dp[j], dp[j-1]);
      prevDiag = temp;
    }
  }
  return dp[n];
}

function findPlayerByVoiceName(text){
  const words = text.split(/\s+/).filter(w=>w.length>=2);
  let best = null; // {player, team, dist, nameLen}

  [slotTeam('A'), slotTeam('B')].forEach((teamObj, idx)=>{
    if(!teamObj) return;
    const slot = idx===0 ? 'A' : 'B';
    teamObj.players.forEach(p=>{
      const pname = normalizeVoiceText(p.name).trim();
      if(pname.length<2) return;

      // 1) correspondência exata (substring) — a mais confiável
      if(text.includes(pname)){
        if(!best || best.dist>0 || pname.length > best.nameLen){
          best = {player:p, team:slot, dist:0, nameLen:pname.length};
        }
        return;
      }

      // 2) correspondência aproximada, palavra por palavra da fala,
      // tolerando variações de pronúncia/transcrição do nome
      words.forEach(w=>{
        const dist = levenshteinDistance(w, pname);
        const threshold = Math.max(1, Math.floor(pname.length/3));
        if(dist <= threshold && (!best || dist < best.dist)){
          best = {player:p, team:slot, dist, nameLen:pname.length};
        }
      });
    });
  });
  return best;
}

function processVoiceCommand(rawText){
  const text = normalizeVoiceText(rawText);

  // ignora silenciosamente falas que não começam com uma palavra de comando
  // reconhecida (conversas de fundo, ruído etc. não geram aviso nenhum)
  if(!startsWithVoiceTrigger(text)) return;

  // "desfazer"
  if(text.startsWith('desfazer') || levenshteinDistance(text.split(/\s+/)[0]||'', 'desfazer') <= 2){
    performUndo();
    return;
  }

  // "ponto direto time 1 / time 2"
  if(text.includes('ponto')){
    const teamA = slotTeam('A'), teamB = slotTeam('B');
    if(teamA && text.includes(normalizeVoiceText(teamDisplayName(teamA)))){
      quickPoint('A'); showToast('Comando de voz: ponto direto ' + teamDisplayName(teamA)); return;
    }
    if(teamB && text.includes(normalizeVoiceText(teamDisplayName(teamB)))){
      quickPoint('B'); showToast('Comando de voz: ponto direto ' + teamDisplayName(teamB)); return;
    }
  }

  const actionMatch = VOICE_ACTION_PHRASES.find(a => a.phrases.some(ph => text.includes(ph)));
  if(!actionMatch){
    showToast('Comando de voz não reconhecido: "' + rawText + '"');
    speak('Comando não reconhecido.');
    return;
  }
  const found = findPlayerByVoiceName(text);
  if(!found){
    showToast('Não entendi o jogador em: "' + rawText + '"');
    speak('Não entendi o jogador.');
    return;
  }
  applyAction(found.team, found.player, actionMatch.key);
}

let voiceRecognition = null;
let voiceListening = false;
function getSpeechRecognitionCtor(){
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}
function startVoiceCommand(){
  const Ctor = getSpeechRecognitionCtor();
  if(!Ctor){
    showToast('Reconhecimento de voz não é suportado neste navegador.');
    return;
  }
  if(location.protocol === 'file:'){
    showErrorToast('O comando de voz não funciona abrindo o arquivo direto (file://). Hospede o app em um site (https) ou servidor local para usar o microfone.');
    return;
  }
  let insideIframe = false;
  try{ insideIframe = (window.self !== window.top); }catch(e){ insideIframe = true; }

  // diagnóstico: confere o estado real da permissão antes de tentar (quando suportado)
  if(navigator.permissions && navigator.permissions.query){
    navigator.permissions.query({name:'microphone'}).then(status=>{
      console.log('[voz] estado da permissão de microfone via Permissions API:', status.state);
      if(status.state === 'denied'){
        showErrorToast('O navegador informa a permissão de microfone como "denied" (negada) para esta página — meio caminho pra não confiar só na configuração geral do navegador. Confira nas configurações do site (ícone de cadeado ao lado do endereço).');
      }
    }).catch(err=>{
      console.log('[voz] não foi possível checar a permissão via Permissions API:', err);
    });
  }

  voiceRecognition = new Ctor();
  voiceRecognition.lang = 'pt-BR';
  voiceRecognition.continuous = true;
  voiceRecognition.interimResults = false;

  voiceRecognition.onresult = (e)=>{
    const last = e.results[e.results.length-1];
    if(last && last.isFinal){
      const transcript = last[0].transcript;
      processVoiceCommand(transcript);
    }
  };
  voiceRecognition.onerror = (e)=>{
    console.error('Erro no reconhecimento de voz:', e.error);
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      // permissão negada/bloqueada — parar de tentar de novo sozinho
      voiceListening = false;
      $('#btnVoiceCmd').classList.remove('listening');
      $('#btnVoiceCmd').title = 'Marcar pontos por comando de voz';
      if(insideIframe){
        showErrorToast('Microfone bloqueado porque o app está sendo aberto dentro de outra página/moldura (iframe) sem permissão de microfone liberada — mesmo com o microfone autorizado no navegador. Abra o arquivo .html sozinho, numa aba própria do navegador (fora de qualquer visualização incorporada), para funcionar.');
      } else {
        showErrorToast('Permissão de microfone negada para esta página. Se já autorizou no navegador, verifique também a permissão de microfone do PRÓPRIO SISTEMA (Windows/macOS/Android) para este navegador — é uma segunda camada de bloqueio, separada da permissão do site.');
      }
    } else if(e.error === 'audio-capture'){
      voiceListening = false;
      $('#btnVoiceCmd').classList.remove('listening');
      showErrorToast('Nenhum microfone encontrado no dispositivo.');
    } else if(e.error === 'no-speech'){
      // normal, sem fala detectada — o onend cuida de reiniciar sozinho
    } else if(e.error === 'network'){
      showToast('Erro de rede no reconhecimento de voz.');
    }
  };
  voiceRecognition.onend = ()=>{
    if(voiceListening && !suppressVoiceRestart){
      try{ voiceRecognition.start(); } // navegador para sozinho após silêncio; reinicia
      catch(e){ /* já iniciado */ }
    }
  };

  try{
    voiceRecognition.start();
    voiceListening = true;
    $('#btnVoiceCmd').classList.add('listening');
    $('#btnVoiceCmd').title = 'Ouvindo comandos de voz... (toque para parar)';
    showToast('Comando de voz ativado — fale, por exemplo, "Ataque João".');
  }catch(e){
    console.error('Falha ao iniciar reconhecimento de voz:', e);
    showToast('Não foi possível ativar o comando de voz.');
  }
}
function stopVoiceCommand(){
  voiceListening = false;
  if(voiceRecognition){
    try{ voiceRecognition.stop(); }catch(e){ /* ignore */ }
  }
  $('#btnVoiceCmd').classList.remove('listening');
  $('#btnVoiceCmd').title = 'Marcar pontos por comando de voz';
  showToast('Comando de voz desativado.');
}
$('#btnVoiceCmd').addEventListener('click', ()=>{
  if(voiceListening) stopVoiceCommand();
  else startVoiceCommand();
});

function applyAction(team, player, actionKey){
  pushUndoSnapshot();

  const isStatOnly = actionKey === STAT_ONLY.key;
  if(isStatOnly){
    // início do set: ninguém sacou ainda (placar 0-0 e nenhum saque confirmado) —
    // vale mesmo que "state.serve" tenha ficado com um valor antigo de antes dessa regra
    const isFirstServeEver = state.serve === null || (state.score.A===0 && state.score.B===0 && !state.serveConfirmed);
    const isTeamMismatch = !isFirstServeEver && team !== state.serve; // jogador é do time que NÃO está sacando

    if(isTeamMismatch){
      const servingTeamName = teamDisplayName(slotTeam(state.serve));
      state.errorMessage = 'Esse jogador não é do time que está sacando! Quem saca agora é ' + servingTeamName + '.';
      speak('Atenção! Time errado para o saque.');
      markDirty();
      renderAll();
      return;
    }

    const expectedId = state.servingPlayerId;
    const isWrongServer = !isFirstServeEver && expectedId && expectedId !== player.id;
    const isDoubleServe = !isFirstServeEver && state.serveConfirmed; // já tinha marcado um saque e nenhum ponto aconteceu desde então
    player.stats.saqueCerto += 1;
    state.errorMessage = null; // marcar o saque agora corrige o aviso de "saque esquecido"
    if(isFirstServeEver){
      // primeira marcação de saque da partida/set: define quem saca primeiro
      state.serve = team;
      const idx = POSITIONS.indexOf(player.pos);
      if(team==='A'){ state.rotationIndexA = idx>=0 ? idx : 0; state.rotationStartedA = true; }
      else { state.rotationIndexB = idx>=0 ? idx : 0; state.rotationStartedB = true; }
      speak(STAT_ONLY.title + ' ' + player.name);
    } else if(isDoubleServe){
      state.errorMessage = 'Saque marcado 2 vezes seguidas sem ponto! Marque o ponto antes de sacar de novo.';
      speak('Atenção! Dois saques seguidos sem ponto.');
    } else if(isWrongServer){
      const expectedPlayer = findPlayerAnywhereById(expectedId);
      const expectedName = expectedPlayer ? expectedPlayer.name : 'outro jogador';
      state.errorMessage = 'Sacador errado! O certo era ' + expectedName + '.';
      speak('Atenção! Sacador errado.');
    } else {
      speak(STAT_ONLY.title + ' ' + player.name);
    }
    state.servingPlayerId = player.id;
    state.serveConfirmed = true;
    logEvent(team, player, STAT_ONLY.title, team, STAT_ONLY.key);
    markDirty();
    renderAll();
    return;
  }
  const actionDef = ACTIONS.find(a=>a.key===actionKey);
  player.stats[actionKey] += 1;
  speak(actionDef.title + ' ' + player.name);

  const winningTeam = actionDef.pt>0 ? team : (team==='A'?'B':'A');
  logEvent(team, player, actionDef.title, winningTeam, actionDef.key);
  awardPoint(winningTeam);
}

function quickPoint(team){
  pushUndoSnapshot();
  logEvent(team, {name:'Ponto direto'}, 'Ponto direto', team, null);
  speak('Ponto direto ' + teamDisplayName(slotTeam(team)));
  awardPoint(team);
}

function logEvent(actingTeam, player, label, winningTeam, actionKey){
  state.history.push({
    set: state.setNum,
    team: actingTeam,
    playerId: player.id || null,
    playerName: player.name,
    label: label,
    actionKey: actionKey || null,
    winningTeam: winningTeam,
    scoreA: state.score.A,
    scoreB: state.score.B
  });
}

function awardPoint(team){
  const isSideOut = state.serve !== team; // o saque mudou de time

  if(!state.serveConfirmed){
    state.errorMessage = 'Você esqueceu de marcar o saque!';
    speak('Atenção! Marque o saque.');
  }

  state.score[team] += 1;
  state.serve = team; // rally scoring: team that wins the point serves next
  // update the last history entry's displayed score to reflect new score
  const last = state.history[state.history.length-1];
  if(last){ last.scoreA = state.score.A; last.scoreB = state.score.B; }

  if(isSideOut){
    assignServerForRotation(team);
  } else {
    state.serveConfirmed = false; // a cada ponto novo, precisa marcar o saque de novo
  }

  markDirty();
  renderAll();
}

function finishSet(){
  const a = state.score.A, b = state.score.B;
  state.setsHistory.push({a,b});
  if(a>b) state.setsWonA++;
  else if(b>a) state.setsWonB++;
  // empate: o set é registrado, mas nenhum time soma vitória de set

  state.setNum += 1;
  state.score = {A:0,B:0};
  // quem saca o novo set é definido pela primeira marcação de saque, como no início da partida
  state.serve = null;
  resetRotation();
  state.servingPlayerId = null;
  state.errorMessage = null;

  markDirty();

  // volta para a tela Nova Partida; o próximo set já fica pronto para continuar
  cameFromMatch = true;
  editEntryActiveA = state.activeAId;
  editEntryActiveB = state.activeBId;
  showSetup();
}

function showEndSetDialog(){
  const a = state.score.A, b = state.score.B;
  showConfirmDialog(`Tem certeza que deseja encerrar o Set ${state.setNum} (placar ${a}–${b})?`, ()=>{
    pushUndoSnapshot();
    finishSet();
  });
}

function showConfirmDialog(message, onConfirm){
  const overlay = document.createElement('div');
  overlay.className = 'celebrate';
  overlay.innerHTML = `
    <h2 style="font-size:28px;">Confirmar</h2>
    <p>${escapeHtml(message)}</p>
    <div style="display:flex; gap:10px;">
      <button class="cel-btn" id="confirmCancelBtn" style="background:var(--bg-elev-2); color:var(--text); border:1px solid var(--line);">Cancelar</button>
      <button class="cel-btn" id="confirmOkBtn">Confirmar</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#confirmCancelBtn').addEventListener('click', ()=> overlay.remove());
  overlay.querySelector('#confirmOkBtn').addEventListener('click', ()=>{
    overlay.remove();
    onConfirm();
  });
}

// Altere a senha abaixo para a que você quiser usar.
const END_MATCH_PASSWORD = "1234";

function showPasswordDialog(onSuccess){
  const overlay = document.createElement('div');
  overlay.className = 'celebrate';
  overlay.innerHTML = `
    <h2 style="font-size:26px;">Senha necessária</h2>
    <p>Digite a senha para encerrar a partida.</p>
    <input type="password" id="endMatchPassInput" inputmode="numeric" placeholder="Senha"
      style="width:100%; max-width:220px; text-align:center; margin-bottom:6px; letter-spacing:3px;">
    <div id="endMatchPassError" style="color:var(--bad); font-size:12px; min-height:16px; margin-bottom:6px;"></div>
    <div style="display:flex; gap:10px;">
      <button class="cel-btn" id="passCancelBtn" style="background:var(--bg-elev-2); color:var(--text); border:1px solid var(--line);">Cancelar</button>
      <button class="cel-btn" id="passOkBtn">Confirmar</button>
    </div>
  `;
  document.body.appendChild(overlay);
  const input = overlay.querySelector('#endMatchPassInput');
  const errEl = overlay.querySelector('#endMatchPassError');
  setTimeout(()=> input.focus(), 50);

  function tryConfirm(){
    if(input.value === END_MATCH_PASSWORD){
      overlay.remove();
      onSuccess();
    } else {
      errEl.textContent = 'Senha incorreta.';
      input.value = '';
      input.focus();
    }
  }
  overlay.querySelector('#passOkBtn').addEventListener('click', tryConfirm);
  overlay.querySelector('#passCancelBtn').addEventListener('click', ()=> overlay.remove());
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryConfirm(); });
}

/* quick point buttons + mini action buttons (marcação por jogador) */
document.body.addEventListener('click', (e)=>{
  const q = e.target.closest('.quick-pt');
  if(q){ quickPoint(q.dataset.team); return; }

  const miniBtn = e.target.closest('.mini-action');
  if(miniBtn){
    const team = miniBtn.dataset.team;
    const player = slotTeam(team).players.find(p=>p.id===miniBtn.dataset.player);
    if(player) applyAction(team, player, miniBtn.dataset.action);
    return;
  }
});

/* ---------------- undo / reset / end ---------------- */
function performUndo(){
  if(undoStack.length===0){
    showToast('Não há nada para desfazer.');
    return false;
  }
  redoStack.push(clone(state));
  state = undoStack.pop();
  markDirty();
  speak('Desfazer');
  renderAll();
  return true;
}
function performRedo(){
  if(redoStack.length===0){
    showToast('Não há nada para refazer.');
    return false;
  }
  undoStack.push(clone(state));
  state = redoStack.pop();
  markDirty();
  speak('Refazer');
  renderAll();
  return true;
}
$('#btnUndo').addEventListener('click', performUndo);
$('#btnRedo').addEventListener('click', performRedo);

$('#btnEndSet').addEventListener('click', showEndSetDialog);

$('#btnEndMatchSetup').addEventListener('click', ()=>{
  showPasswordDialog(()=>{
    showConfirmDialog('Encerrar esta partida e voltar para a tela de Nova Partida?', ()=>{
      const teamAObj = slotTeam('A'), teamBObj = slotTeam('B');
      const hadProgress = state.setsHistory.length>0 || state.score.A>0 || state.score.B>0;
      if(hadProgress){
        matchArchive.unshift({
          id: uid(),
          endedAt: new Date().toISOString(),
          teamAName: teamDisplayName(teamAObj),
          teamBName: teamDisplayName(teamBObj),
          setsWonA: state.setsWonA,
          setsWonB: state.setsWonB,
          setsHistory: clone(state.setsHistory),
          teamAPlayers: teamAObj.players.map(p=>({name:p.name, pos:p.pos, stats:clone(p.stats)})),
          teamBPlayers: teamBObj.players.map(p=>({name:p.name, pos:p.pos, stats:clone(p.stats)}))
        });
        if(matchArchive.length>30) matchArchive.length = 30;
      }

      state.started = false;
      state.matchOver = true;
      state.score = {A:0,B:0};
      state.setNum = 1;
      state.setsHistory = [];
      state.setsWonA = 0; state.setsWonB = 0;
      state.history = [];
      state.serve = null;
      resetRotation();
      state.servingPlayerId = null;
      state.errorMessage = null;
      state.teams.forEach(t=> t.players.forEach(p=> p.stats = emptyStats()));
      undoStack = [];
      redoStack = [];
      tabStack = [];
      activeTab = 'court';
      cameFromMatch = false;
      if(hadProgress) markDirty(); else markClean();
      showToast(hadProgress ? 'Partida encerrada e salva no histórico de partidas.' : 'Partida encerrada.');
      showSetup();
    });
  });
});

$('#btnReset').addEventListener('click', ()=>{
  const doReset = ()=>{
    state = defaultState();
    undoStack = [];
    redoStack = [];
    tabStack = [];
    activeTab = 'court';
    cameFromMatch = false;
    markClean();
    showSetup();
  };
  if(state.started){
    showConfirmDialog('Começar um novo jogo? A partida atual será perdida.', doReset);
  } else {
    doReset();
  }
});

function showToast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 2200);
}

function showErrorToast(msg){
  const t = document.createElement('div');
  t.className='toast toast-error'; t.textContent = '⚠️ ' + msg;
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 3200);
}

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

/* ---------------- init ---------------- */
renderVersionBadge();
(async function init(){
  const loaded = await loadState();
  state = loaded || defaultState();
  // sempre abre na tela Nova Partida; se havia uma partida em andamento,
  // permite voltar a ela pelo botão "Voltar para a partida"
  if(state.started){
    cameFromMatch = true;
    editEntryActiveA = state.activeAId;
    editEntryActiveB = state.activeBId;
  } else {
    cameFromMatch = false;
  }
  updateSaveIndicator();
  await loadDisplayPrefs();
  showSetup();
})();

})();
</script>
