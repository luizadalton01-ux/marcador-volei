/* ---------------- fórmula de pontuação ponderada por posição ----------------
   Pts = Ataque + Pingada + Ace + Bloqueio + Saque + Levantamentos
         - Ataque errado - Saque errado - Passe errado - Infração

   Pesos (aplicados conforme a posição do jogador no momento de cada ação):
   - Ataque certo/errado, Pingada, Ace, Bloqueio: peso 1,0 para P1,P2,OP,CE,AT
     e peso 0,1 para LE,LI.
   - Saque certo/errado: peso 0,25 para P1,P2,OP,CE,LE,AT e peso 0,125 para LI.
   - Levantamentos: não é uma ação marcada diretamente — é uma fração do
     total de ataques certos do TIME (no mesmo set/período), creditada por
     posição: 0,28 para LE; 0,23 para LI; 0,14 para P1,P2; 0,0 para OP,CE
     (e para qualquer posição não listada, como AT ou sem posição definida).
   - Infração e Passe errado: peso 1,0 para todas as posições. */
function attackActionWeight(pos){
  return (pos==='LE' || pos==='LI') ? 0.1 : 1.0;
}
function serveActionWeight(pos){
  return pos==='LI' ? 0.125 : 0.25;
}
function levantamentoWeight(pos){
  if(pos==='LE') return 0.28;
  if(pos==='LI') return 0.23;
  if(pos==='P1' || pos==='P2') return 0.14;
  return 0; // OP, CE, AT ou sem posição definida
}
/* Levantamentos de um jogador: fração (por posição) do total de ataques
   certos do time no mesmo período. */
function levantamentosFor(pos, teamAtaqueCerto){
  return levantamentoWeight(pos) * (teamAtaqueCerto||0);
}
/* Pontuação ponderada de um jogador, a partir do objeto de estatísticas dele
   (s), da posição dele no momento das ações (pos) e do total de ataques
   certos do TIME no mesmo período (teamAtaqueCerto), usado para calcular a
   parcela de levantamentos. */
function totalPointsFor(s, pos, teamAtaqueCerto){
  s = s || {};
  const aw = attackActionWeight(pos);
  const sw = serveActionWeight(pos);
  return (
    (s.ataqueCerto||0)*aw + (s.pingada||0)*aw + (s.ace||0)*aw + (s.bloqueio||0)*aw
    + (s.saqueCerto||0)*sw
    + levantamentosFor(pos, teamAtaqueCerto)
    - (s.ataqueErrado||0)*aw - (s.saqueErrado||0)*sw
    - (s.passeErrado||0) - (s.infracao||0)
  );
}
/* Formata um número ponderado (Pts ou Levantamentos) com até 2 casas
   decimais, sem casas desnecessárias (ex.: 3 fica "3", 3.4 fica "3.4"). */
function fmtWeighted(n){
  const r = Math.round((n||0)*100)/100;
  return Number.isInteger(r) ? String(r) : r.toFixed(2).replace(/0$/,'');
}
/* Total de ataques certos de um TIME em um set — soma direto do histórico
   (e não do elenco atual), para não perder ataques de jogadores já
   substituídos naquele set (mesmo raciocínio de buildSetPlayerRows). */
function teamAttackTotalInSet(team, setNum){
  let total = 0;
  state.history.forEach(ev=>{
    if(ev.set===setNum && ev.team===team && ev.actionKey==='ataqueCerto') total++;
  });
  return total;
}
/* Pontuação ponderada acumulada de um jogador (por id) em TODA a partida —
   soma os sets já encerrados (setArchive, usando as estatísticas por
   identidade reconstruídas em buildSetPlayerRows) mais os pontos já
   calculados do set em andamento (currentSetPts) — usada no badge "Tt" do
   card, ao lado do "Pt" (que mostra só o set atual). Procura em ambos os
   lados (A/B) de cada set arquivado porque o jogador pode ter ocupado
   slots diferentes ao longo da partida (troca de lado entre times). */
function totalAccumulatedPointsFor(playerId, currentSetPts){
  let total = currentSetPts || 0;
  setArchive.forEach(setEntry=>{
    [setEntry.teamAPlayers, setEntry.teamBPlayers].forEach(list=>{
      if(!list) return;
      const teamAtaqueCerto = list.reduce((sum,p)=> sum + ((p.stats && p.stats.ataqueCerto)||0), 0);
      list.forEach(p=>{
        if(p.playerId === playerId) total += totalPointsFor(p.stats, p.pos, teamAtaqueCerto);
      });
    });
  });
  return total;
}

function renderCourt(){
  const pa = $('#playersA'), pb = $('#playersB');
  pa.innerHTML=''; pb.innerHTML='';
  slotTeam('A').players.forEach((p,idx)=> pa.appendChild(playerCard(p,'A',idx)));
  slotTeam('B').players.forEach((p,idx)=> pb.appendChild(playerCard(p,'B',idx)));
  bindCourtPlayerEditors();
}

/* Nome e posição editáveis direto no card da quadra — mesmo molde, mesmas
   funções e regras da caixa de posição/nome do elenco na aba Times (ver
   renderRosterFor): entre os 6 primeiros jogadores do time, a posição não
   pode se repetir (trocando com quem já estiver na posição escolhida); a
   partir do 7º jogador (ou com a posição extra "AT", quando o time tem
   menos de 6 jogadores no rodízio) a posição pode ser repetida livremente.
   As posições continuam sempre reordenadas como LE, P1, CE, OP, P2, LI. */
function bindCourtPlayerEditors(){
  $$('.court-name-input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const teamObj = slotTeam(e.target.dataset.team);
      const player = teamObj && teamObj.players[+e.target.dataset.idx];
      if(!player) return;
      player.name = e.target.value;
      markDirty();
      renderScoreboard(); // atualiza o nome do sacador no cabeçalho da coluna, sem redesenhar a quadra
    });
  });
  $$('.court-pos-select').forEach(sel=>{
    sel.addEventListener('change', e=>{
      const teamId = e.target.dataset.team;
      const idx = +e.target.dataset.idx;
      const teamObj = slotTeam(teamId);
      const player = teamObj && teamObj.players[idx];
      if(!player) return;
      const oldPos = player.pos;
      const newPos = e.target.value;
      if(idx < 6 && newPos && !EXTRA_POSITIONS.includes(newPos)){
        // se outro dos 6 primeiros já está nessa posição, os dois trocam:
        // ele passa a usar a posição que este jogador tinha antes.
        const conflict = teamObj.players.slice(0,6).find((pl, i2)=> i2!==idx && pl.pos===newPos);
        if(conflict) conflict.pos = oldPos;
      }
      player.pos = newPos;
      teamObj.players = reorderFirstSixByPosition(teamObj.players);
      markDirty();
      renderAll(); // reordena e atualiza a quadra após a troca
    });
  });
}

function playerCard(p, team, idx){
  const card = document.createElement('div');
  const isServing = state.servingPlayerId === p.id;
  const isLastScorer = state.lastScorerPlayerId === p.id;
  const isLastError = state.lastErrorPlayerId === p.id;
  card.className = 'player-card' + (isServing ? ' is-serving' : '') + (isLastScorer ? ' is-last-scorer' : '');
  const actionBtns = ACTIONS.map(a=>
    `<button class="mini-action ${a.cls}" data-team="${team}" data-player="${p.id}" data-action="${a.key}">${a.short}</button>`
  ).join('');
  const servingLabel = state.serveConfirmed ? '🏐 Sacou' : '🏐 Sacar';

  // bolinha de quem está sacando (🏐 branca, sigla "SQ" acima), bolinha de
  // quem fez o último ponto certo (🏐 azul, sigla "PT" acima) e bolinha de
  // quem cometeu o último erro (🏐 vermelha, sigla "ER" acima): ficam num
  // selo no cantinho do card, por cima dos botões — no time à esquerda (A),
  // no canto inferior direito (perto de onde fica o botão Infração); no
  // time à direita (B), no canto superior esquerdo (perto do botão Ataque).
  const serveFigurine = isServing
    ? '<div class="corner-marker-item"><span class="corner-marker-label">SQ</span><span class="corner-marker-icon serve-ball" title="Sacando">🏐</span></div>'
    : '';
  const lastPointDot = isLastScorer
    ? '<div class="corner-marker-item"><span class="corner-marker-label">PT</span><span class="corner-marker-icon point-ball" title="Último ponto certo">🏐</span></div>'
    : '';
  const lastErrorDot = isLastError
    ? '<div class="corner-marker-item"><span class="corner-marker-label">ER</span><span class="corner-marker-icon error-ball" title="Último erro">🏐</span></div>'
    : '';
  const cornerCls = team === 'A' ? 'corner-end' : 'corner-start';
  const cornerMarkers = (serveFigurine || lastPointDot || lastErrorDot)
    ? `<div class="card-corner-markers ${cornerCls}">${serveFigurine}${lastPointDot}${lastErrorDot}</div>`
    : '';

  const teamObj = slotTeam(team);
  const allowExtraPositions = (teamObj.playerCount || 6) < 6;
  const posOptions = allowExtraPositions ? POSITIONS.concat(EXTRA_POSITIONS) : POSITIONS;
  const emptyPosOption = idx < 6 ? `<option value="" ${p.pos?'':'selected'}>—</option>` : '';
  const posSelect = `
    <select class="pos-badge court-pos-select" data-team="${team}" data-idx="${idx}">
      ${emptyPosOption}
      ${posOptions.map(pos=>`<option value="${pos}" ${pos===p.pos?'selected':''}>${pos}</option>`).join('')}
    </select>`;
  const nameInput = `<input type="text" maxlength="16" class="player-name court-name-input" data-team="${team}" data-idx="${idx}" value="${escapeHtml(p.name)}">`;

  // O badge de saques e o badge de pontos do card mostram os números do SET
  // ATUAL — mesma fonte (histórico filtrado pelo set) usada na aba
  // Estatísticas e nos PDFs/planilhas exportados. Antes, esses dois badges
  // liam p.stats direto, que acumula desde o início da partida e nunca é
  // zerado a cada set — por isso os números do card divergiam (ficavam
  // maiores) dos números do PDF/estatísticas a partir do 2º set.
  const currentSetStats = statsForPlayerInCurrentSet(p.id);
  const teamAtaqueCerto = teamAttackTotalInSet(team, state.setNum);
  const currentPts = totalPointsFor(currentSetStats, p.pos, teamAtaqueCerto);
  const totalPts = totalAccumulatedPointsFor(p.id, currentPts); // acumulado de TODOS os sets já jogados na partida

  card.innerHTML = `
    ${cornerMarkers}
    <div class="player-info">
      ${posSelect}
      ${nameInput}
      ${isServing ? '<span class="serving-tag">'+servingLabel+'</span>' : ''}
      <div class="player-serves"><span class="serve-player-icon" title="Saque">🤾</span>${currentSetStats.saqueCerto}</div>
      <div class="player-pts">🏐${fmtWeighted(currentPts)}pt <span class="player-total-pts" title="Total acumulado na partida">Tt ${fmtWeighted(totalPts)}</span></div>
    </div>
    <div class="mini-action-grid">
      ${actionBtns}
    </div>
  `;
  return card;
}

function statsForPlayerInSet(playerId, setNum){
  const s = emptyStats();
  state.history.forEach(ev=>{
    if(ev.set===setNum && ev.playerId===playerId && ev.actionKey && s.hasOwnProperty(ev.actionKey)){
      s[ev.actionKey] += 1;
    }
  });
  return s;
}
function statsForPlayerInCurrentSet(playerId){
  return statsForPlayerInSet(playerId, state.setNum);
}

/* Monta a lista de jogadores + estatísticas de um set (por time), a partir
   do HISTÓRICO DE AÇÕES do próprio set — não do elenco atual do time.
   Isso evita que um jogador substituído no meio do set (ex.: campo de nome
   editado na quadra, trocando "Adalton" por "Teste" no mesmo cartão)
   "suma" das estatísticas e tenha seus pontos somados ao substituto: cada
   ação do histórico já guarda o nome do jogador no momento em que ela
   aconteceu, então agrupamos por (id do jogador + nome no momento da ação).
   Se o nome mudar no meio do set, isso naturalmente cria dois grupos
   diferentes — um para cada "identidade" que jogou o set — cada um só com
   as próprias ações. Jogadores do elenco atual sem nenhuma ação nesse set
   também entram (com tudo zerado), para não sumirem da tabela. */
function buildSetPlayerRows(team, setNum, rosterPlayers){
  const groups = new Map(); // chave "playerId||nome" -> {name, pos, stats, order}
  let order = 0;
  state.history.forEach(ev=>{
    if(ev.set !== setNum || ev.team !== team || !ev.playerId) return;
    const key = ev.playerId + '||' + ev.playerName;
    if(!groups.has(key)){
      groups.set(key, {playerId: ev.playerId, name: ev.playerName, pos: ev.pos || null, stats: emptyStats(), order: order++});
    }
    const g = groups.get(key);
    if(ev.pos) g.pos = ev.pos; // guarda a posição mais recente registrada para essa identidade no set
    if(ev.actionKey && g.stats.hasOwnProperty(ev.actionKey)) g.stats[ev.actionKey] += 1;
  });

  // jogador do elenco atual que não teve nenhuma ação registrada nesse set
  // (ex.: entrou como reserva e o set acabou antes de ele jogar) — mantém
  // aparecendo, com estatísticas zeradas, como já acontecia antes.
  (rosterPlayers||[]).forEach(p=>{
    const alreadyCovered = Array.from(groups.values()).some(g=> g.playerId===p.id && g.name===p.name);
    if(!alreadyCovered){
      groups.set('roster||'+p.id+'||'+p.name, {playerId:p.id, name:p.name, pos:p.pos, stats: emptyStats(), order: order++});
    }
  });

  return Array.from(groups.values())
    .sort((a,b)=> a.order-b.order)
    .map(g=> ({playerId: g.playerId, name: g.name, pos: g.pos, stats: g.stats}));
}

/* ---------------- exportar dados em tabela (XLS) ---------------- */
function downloadBlob(filename, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

/* Gera um Excel Spreadsheet XML (formato "Excel XML 2003") na mão, sem
   nenhuma biblioteca externa nem internet — o Excel/LibreOffice/Numbers
   abrem esse XML normalmente com extensão .xls. */
function xmlEscape(str){
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[ch]));
}
function xlsCell(value){
  if(value===null || value===undefined || value===''){
    return '<Cell></Cell>';
  }
  if(typeof value === 'number' && isFinite(value)){
    return '<Cell><Data ss:Type="Number">' + value + '</Data></Cell>';
  }
  return '<Cell><Data ss:Type="String">' + xmlEscape(value) + '</Data></Cell>';
}
function xlsSheetXml(sheetName, rows){
  const rowsXml = rows.map(r => '<Row>' + r.map(xlsCell).join('') + '</Row>').join('');
  return '<Worksheet ss:Name="' + xmlEscape(sheetName) + '"><Table>' + rowsXml + '</Table></Worksheet>';
}
function buildXlsWorkbook(sheets){
  // sheets: [{name, rows}, ...]
  const sheetsXml = sheets.map(sh => xlsSheetXml(sh.name, sh.rows)).join('');
  return '<?xml version="1.0"?>' +
    '<?mso-application progid="Excel.Sheet"?>' +
    '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" ' +
    'xmlns:o="urn:schemas-microsoft-com:office:office" ' +
    'xmlns:x="urn:schemas-microsoft-com:office:excel" ' +
    'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" ' +
    'xmlns:html="http://www.w3.org/TR/REC-html40">' +
    sheetsXml +
    '</Workbook>';
}

function exportMatchXls(){
  // Usa a MESMA fonte de dados do PDF (setArchive: sets já encerrados,
  // com o elenco e as posições de cada jogador tal como estavam naquele
  // set) — evita divergência entre os dois arquivos e não inclui o set
  // em andamento (ainda não encerrado).
  const statsHeader = ['Posição','Nome','Saque','Ataque','Bloqueio','Pingada','Ataque errado','Saque errado','Passe errado','Infração','Ace','Data','Set'];
  const statsRows = [statsHeader];
  const sets = [...setArchive].sort((a,b)=> a.setNum - b.setNum);
  sets.forEach(set=>{
    const setDate = new Date(set.endedAt).toLocaleDateString('pt-BR');
    [set.teamAPlayers, set.teamBPlayers].forEach(players=>{
      (players||[]).forEach(p=>{
        const s = p.stats || {};
        statsRows.push([p.pos, p.name, s.saqueCerto||0, s.ataqueCerto||0, s.bloqueio||0, s.pingada||0, s.ataqueErrado||0, s.saqueErrado||0, s.passeErrado||0, s.infracao||0, s.ace||0, setDate, set.setNum]);
        if(p.pos === 'LI'){
          // duas linhas em branco após cada líbero (LI), com 0 (numérico) na coluna de nomes
          for(let k=0; k<2; k++){
            statsRows.push(statsHeader.map(col => col==='Nome' ? 0 : ''));
          }
        }
      });
    });
  });

  const xml = buildXlsWorkbook([
    {name:'Planilha1', rows: statsRows}
  ]);
  const blob = new Blob([xml], {type:'application/vnd.ms-excel'});
  const now = new Date();
  const fileName = 'JOGO ' + now.getDate() + '-' + (now.getMonth()+1) + '-' + now.getFullYear() + '.xls';
  downloadBlob(fileName, blob);
  showToast('Dados exportados: ' + fileName);
}

function renderHelpBody(filterId, query){
  const q = normalizeVoiceText(query||'').trim();
  let anyItem = false;
  const sectionsHtml = HELP_DATA.map(group=>{
    if(filterId!=='all' && group.id!==filterId) return '';

    const itemsHtml = (group.items||[]).map(it=>{
      const haystack = normalizeVoiceText([it.name, it.tag, it.desc||'', it.say||'', it.variants||''].join(' '));
      if(q && !haystack.includes(q)) return '';
      anyItem = true;
      return `
        <div class="help-item">
          <div class="help-item-head">
            <span class="help-item-name">${escapeHtml(it.name)}</span>
            <span class="help-item-tag help-tag-${it.tagCls}">${escapeHtml(it.tag)}</span>
          </div>
          ${it.desc ? `<div class="help-item-desc">${escapeHtml(it.desc)}</div>` : ''}
          ${it.say ? `<div class="help-item-say">"${escapeHtml(it.say)}"</div>` : ''}
          ${it.variants ? `<div class="help-item-variants">${escapeHtml(it.variants)}</div>` : ''}
        </div>
      `;
    }).join('');

    // grupo pode ter também (ou só) uma tabela, além dos cards de item
    let tableHtml = '';
    if(group.table){
      const tableHaystack = normalizeVoiceText(group.table.replace(/<[^>]+>/g,' '));
      if(!q || tableHaystack.includes(q)){
        anyItem = true;
        tableHtml = `<div class="help-table-wrap">${group.table}</div>`;
      }
    }

    if(!itemsHtml && !tableHtml) return '';
    return `
      <div class="help-section">
        <div class="help-section-title">${group.icon} ${escapeHtml(group.title)}</div>
        ${itemsHtml ? `<div class="help-card">${itemsHtml}</div>` : ''}
        ${tableHtml}
        ${group.note ? `<div class="help-note">${group.note}</div>` : ''}
      </div>
    `;
  }).join('');
  return anyItem ? sectionsHtml : '<div class="help-empty">Nada encontrado.</div>';
}

    Object.keys(tot).forEach(k=>{ if(k!=='pts') tot[k]+=s[k]||0; });
    tot.pts += pts;
    return `<tr><td class="nm">${escapeHtml(p.name)}</td><td>${fmtWeighted(pts)}</td><td>${s.saqueCerto||0}</td><td>${s.ataqueCerto||0}</td><td>${s.ataqueErrado||0}</td><td>${s.bloqueio||0}</td><td>${s.pingada||0}</td><td>${s.ace||0}</td><td>${s.saqueErrado||0}</td><td>${s.passeErrado||0}</td><td>${s.infracao||0}</td></tr>`;
  }).join('');
  return `
    <table class="pdf-table">
      <thead><tr><th class="nm">Jogador</th><th>Pts</th><th>Saq</th><th>Atq✓</th><th>Atq✗</th><th>Blq</th><th>Png</th><th>Ace</th><th>Sq✗</th><th>Ps✗</th><th>Inf</th></tr></thead>
      <tbody>${rows}<tr class="tot"><td class="nm">Total</td><td>${fmtWeighted(tot.pts)}</td><td>${tot.saqueCerto}</td><td>${tot.ataqueCerto}</td><td>${tot.ataqueErrado}</td><td>${tot.bloqueio}</td><td>${tot.pingada}</td><td>${tot.ace}</td><td>${tot.saqueErrado}</td><td>${tot.passeErrado}</td><td>${tot.infracao}</td></tr></tbody>
    </table>
  `;
}

/* Monta o quadro de totalização geral (todos os sets exportados), agrupado
   por JOGADOR: sets jogados, vitórias, derrotas, todas as ações (saque,
   ataque certo/errado, bloqueio, pingada, ace, saque errado, passe errado,
   infração), levantamentos (soma dos ataques certos do time, creditada
   inteira ao jogador na posição LE em cada set — modelo simples, só para
   essa tabela), pontuação ponderada (Pts — ver totalPointsFor, que usa os
   pesos por posição também para a parcela de levantamentos), acertos, erros
   e %acertos — com destaque de cor (azul >50%, amarelo =50%, vermelho
   <50%). Acertos e erros da totalização são contagens simples (não
   ponderadas) e NÃO incluem saques nem levantamentos. */
function buildPdfTotalsTable(sets){
  const players = new Map(); // nome do jogador -> acumulado

  function ensurePlayer(name){
    if(!players.has(name)){
      players.set(name, {
        sets:0, wins:0, losses:0,
        saqueCerto:0, ataqueCerto:0, ataqueErrado:0, bloqueio:0, pingada:0, ace:0,
        saqueErrado:0, passeErrado:0, infracao:0, levantamentos:0, pts:0,
        acertos:0, erros:0
      });
    }
    return players.get(name);
  }

  function accumulate(playerList, teamAtaqueCerto, won, lost){
    (playerList||[]).forEach(p=>{
      const t = ensurePlayer(p.name);
      const s = p.stats || {};
      t.sets++;
      if(won) t.wins++;
      if(lost) t.losses++;
      t.saqueCerto += s.saqueCerto||0;
      t.ataqueCerto += s.ataqueCerto||0;
      t.ataqueErrado += s.ataqueErrado||0;
      t.bloqueio += s.bloqueio||0;
      t.pingada += s.pingada||0;
      t.ace += s.ace||0;
      t.saqueErrado += s.saqueErrado||0;
      t.passeErrado += s.passeErrado||0;
      t.infracao += s.infracao||0;
      if(p.pos === 'LE') t.levantamentos += teamAtaqueCerto; // modelo anterior: tudo para o LE
      t.pts += totalPointsFor(s, p.pos, teamAtaqueCerto);
      // acertos/erros da totalização não incluem saque nem levantamentos
      const ac = (s.ataqueCerto||0) + (s.pingada||0) + (s.bloqueio||0) + (s.ace||0);
      const er = (s.ataqueErrado||0) + (s.saqueErrado||0) + (s.passeErrado||0) + (s.infracao||0);
      t.acertos += ac;
      t.erros += er;
    });
  }

  sets.forEach(s=>{
    const aWon = s.scoreA > s.scoreB, aLost = s.scoreB > s.scoreA;
    const bWon = s.scoreB > s.scoreA, bLost = s.scoreA > s.scoreB;
    const levA = (s.teamAPlayers||[]).reduce((sum,p)=> sum + ((p.stats && p.stats.ataqueCerto)||0), 0);
    const levB = (s.teamBPlayers||[]).reduce((sum,p)=> sum + ((p.stats && p.stats.ataqueCerto)||0), 0);
    accumulate(s.teamAPlayers, levA, aWon, aLost);
    accumulate(s.teamBPlayers, levB, bWon, bLost);
  });

  const rows = Array.from(players.entries())
    .sort((a,b)=> a[0].localeCompare(b[0], 'pt-BR', {sensitivity:'base'}))
    .map(([name, t])=>{
    const total = t.acertos + t.erros;
    const pct = total>0 ? (t.acertos/total*100) : 0;
    let cls = 'pct-red';
    if(pct > 50) cls = 'pct-blue';
    else if(pct === 50) cls = 'pct-yellow';
    return `<tr>
      <td class="nm">${escapeHtml(name)}</td>
      <td class="lev">${fmtWeighted(t.pts)}</td>
      <td>${t.sets}</td><td>${t.wins}</td><td>${t.losses}</td>
      <td>${t.saqueCerto}</td><td>${t.ataqueCerto}</td><td>${t.ataqueErrado}</td>
      <td>${t.bloqueio}</td><td>${t.pingada}</td><td>${t.ace}</td>
      <td>${t.saqueErrado}</td><td>${t.passeErrado}</td><td>${t.infracao}</td>
      <td class="lev">${t.levantamentos}</td>
      <td>${t.acertos}</td><td>${t.erros}</td>
      <td class="${cls}">${pct.toFixed(1)}%</td>
    </tr>`;
  }).join('');

  return `
    <table class="pdf-totals-table">
      <thead><tr>
        <th class="nm">Jogador</th>
        <th class="lev">Pts</th>
        <th>Sets</th><th>Vit</th><th>Der</th>
        <th>Saq</th><th>Atq✓</th><th>Atq✗</th>
        <th>Blq</th><th>Png</th><th>Ace</th>
        <th>Sq✗</th><th>Ps✗</th><th>Inf</th>
        <th class="lev">Levantamentos</th>
        <th>Acertos</th><th>Erros</th><th>%Acer</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

/* Gera o PDF abrindo uma janela só com o relatório formatado e chamando a
   impressão do navegador (o usuário escolhe "Salvar como PDF" no destino) —

function exportArchivePdf(){
  if(!setArchive || setArchive.length===0){
    showToast('Nenhum set encerrado para exportar.');
    return;
  }
  const now = new Date();
  const genDate = now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});

  function chunk(arr, size){
    const out = [];
    for(let i=0; i<arr.length; i+=size) out.push(arr.slice(i, i+size));
    return out;
  }

  const pages = chunk(setArchive, 9); // 9 sets por página = 3 colunas x 3 linhas
  const setsHtml = pages.map((pageSets, pageIdx)=>{
    const blocks = pageSets.map(s=>{
      return `
        <section class="set-block">
          <div class="set-head">
            <div class="matchup">${escapeHtml(s.teamAName)} <span class="vs">×</span> ${escapeHtml(s.teamBName)}</div>

          </div>
          <div class="score">${s.scoreA} – ${s.scoreB}</div>
          <div class="team-name a">${escapeHtml(s.teamAName)}</div>
          ${buildPdfStatsTable(s.teamAPlayers)}
          <div class="team-name b">${escapeHtml(s.teamBName)}</div>
          ${buildPdfStatsTable(s.teamBPlayers)}
        </section>
      `;
    }).join('');
    const lastPageCls = pageIdx === pages.length-1 ? ' last-page' : '';
    return `<div class="pdf-page${lastPageCls}">${blocks}</div>`;
  }).join('');

  const totalsHtml = `
    <section class="totals-block">
      <h2 class="totals-title">Totalização Geral — Todos os Sets</h2>
      ${buildPdfTotalsTable(setArchive)}
    </section>
  `;

  const html = `<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<title>Estatisticas - Sets encerrados</title>
<style>
  * { box-sizing:border-box; }
  body{ font-family: Arial, Helvetica, sans-serif; color:#111; margin:14px; }
  h1{ font-size:14px; margin:0 0 1px; }
  .gen-date{ font-size:8px; color:#666; margin-bottom:6px; }
  .pdf-page{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 6px; page-break-after:always; }
  .pdf-page.last-page{ page-break-after:auto; }
  .set-block{ page-break-inside: avoid; margin-bottom:5px; border-bottom:1px solid #ccc; padding-bottom:3px; min-width:0; }
  .set-head{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:3px; }
  .matchup{ font-size:8px; font-weight:700; }
  .vs{ color:#888; font-weight:400; }
  .meta{ font-size:6px; color:#666; }
  .score{ font-size:10px; font-weight:700; margin:1px 0 2px; }
  .team-name{ font-size:7px; font-weight:700; margin:2px 0 1px; }
  .team-name.a{ color:#0f7c88; }
  .team-name.b{ color:#b85a1f; }
  table.pdf-table{ width:100%; border-collapse:collapse; margin-bottom:2px; table-layout:fixed; }
  table.pdf-table th, table.pdf-table td{ border:1px solid #ccc; padding:0.5px 0.5px; text-align:center; font-size:5px; line-height:1.1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  table.pdf-table th{ background:#f0f0f0; font-weight:700; }
  table.pdf-table td.nm, table.pdf-table th.nm{ text-align:left; }
  table.pdf-table tr.tot td{ font-weight:700; background:#f7f7f7; }
  .totals-block{ page-break-inside: avoid; margin-bottom:8px; padding-bottom:6px; border-bottom:2px solid #333; }
  .totals-title{ font-size:10.5px; margin:0 0 4px; }
  table.pdf-totals-table{ width:100%; border-collapse:collapse; table-layout:fixed; }
  table.pdf-totals-table th, table.pdf-totals-table td{ border:1px solid #ccc; padding:1px 2px; text-align:center; font-size:5.5px; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  table.pdf-totals-table th{ background:#f0f0f0; font-weight:700; }
  table.pdf-totals-table td.nm, table.pdf-totals-table th.nm{ text-align:left; font-weight:700; width:12%; }
  table.pdf-totals-table th.lev{ white-space:normal; word-break:break-word; width:8%; }
  table.pdf-totals-table td.pct-blue{ background:#2f6fd6; color:#fff; font-weight:700; }
  table.pdf-totals-table td.pct-yellow{ background:#e8c72f; color:#111; font-weight:700; }
  table.pdf-totals-table td.pct-red{ background:#d9433f; color:#fff; font-weight:700; }
  @media print{
    body{ margin:8mm; }
    table.pdf-totals-table td.pct-blue,
    table.pdf-totals-table td.pct-yellow,
    table.pdf-totals-table td.pct-red{ -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact; }
  }
</style>
</head>
<body>
  <h1>Estatisticas &mdash; Sets encerrados</h1>
  <div class="gen-date">Gerado em ${genDate}</div>
  ${totalsHtml}
  ${setsHtml}
  <script>window.onload = function(){ setTimeout(function(){ window.print(); }, 200); };<\/script>
</body></html>`;

  const win = window.open('', '_blank');
  if(!win){
    showErrorToast('Não foi possível abrir a janela de impressão. Verifique o bloqueador de pop-ups.');
    return;
  }
  win.document.open();
  win.document.write(html);

    }
  });
}

const TAB_ORDER = ['court','stats','history'];

function switchTab(tabName){
  activeTab = tabName;
  $$('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tabName));
  $('#tabCourt').classList.toggle('hidden', activeTab!=='court');
  $('#tabStats').classList.toggle('hidden', activeTab!=='stats');
  $('#tabHistory').classList.toggle('hidden', activeTab!=='history');
  updateTabNavButtons();
}
function updateTabNavButtons(){
  const backBtn = $('#btnTabBack'), fwdBtn = $('#btnTabForward');
  const idx = TAB_ORDER.indexOf(activeTab);
  // "Voltar" agora sempre pode ser clicado durante uma partida: dentro das
  // abas (Quadra/Estatísticas/Histórico) e, a partir da Quadra, até a tela
  // inicial "Nova Partida".
  if(backBtn) backBtn.disabled = !(state && state.started);
  if(fwdBtn) fwdBtn.disabled = !(state && state.started && idx>=0 && idx<TAB_ORDER.length-1);
}

function goTabBack(){
  const idx = TAB_ORDER.indexOf(activeTab);
  if(idx>0){
    switchTab(TAB_ORDER[idx-1]);
    return true;
  }
  // já está na primeira aba (Quadra) — volta para a tela inicial "Nova Partida"
  if(state && state.started){
    cameFromMatch = true;
    editEntryActiveA = state.activeAId;
    editEntryActiveB = state.activeBId;
    showSetup();
    return true;
  }
  return false;
}
function goTabForward(){
  const idx = TAB_ORDER.indexOf(activeTab);
  if(idx===-1 || idx>=TAB_ORDER.length-1) return false;
  switchTab(TAB_ORDER[idx+1]);
  return true;
}

$$('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
});

$('#btnTabBack').addEventListener('click', goTabBack);
$('#btnTabForward').addEventListener('click', goTabForward);

/* ---------------- narração por voz ---------------- */
let speechEnabled = true;
let suppressVoiceRestart = false;
function speak(text){
  if(!speechEnabled) return;
  try{
    if('speechSynthesis' in window){
      const synth = window.speechSynthesis;
      synth.cancel(); // evita fila/atraso em toques rápidos seguidos
      const doSpeak = ()=>{
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'pt-BR';
        utter.rate = 1.05;
        // pausa o comando de voz enquanto o app fala, para o microfone não
        // "escutar" a própria narração e disparar uma marcação por engano
        if(voiceListening && voiceRecognition){
          suppressVoiceRestart = true;
          try{ voiceRecognition.stop(); }catch(e){ /* ignore */ }
          utter.onend = ()=>{
            suppressVoiceRestart = false;
            if(voiceListening){ try{ voiceRecognition.start(); }catch(e){ /* ignore */ } }
          };
        }
        synth.speak(utter);
      };
      // pequena espera entre "cancel" e "speak": em muitos navegadores de
      // celular (principalmente Chrome/Android), chamar os dois colados na
      // mesma execução faz a narração parar de funcionar silenciosamente
      setTimeout(doSpeak, 60);
    }
  }catch(e){ console.error('Falha na narração por voz:', e); }
}

// alguns navegadores de celular "travam" o motor de narração depois que a
// tela é bloqueada ou o app fica em segundo plano — resetar ao voltar ajuda
// a evitar que a narração pare de funcionar sem nenhum aviso
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && 'speechSynthesis' in window){
    try{ window.speechSynthesis.cancel(); }catch(e){ /* ignore */ }
  }
});

// bug conhecido em Chrome/Android: o motor de narração "dorme" depois de um
// tempo parado e para de falar sem avisar nada — chamar resume() de tempos
// em tempos evita isso
if('speechSynthesis' in window){
  setInterval(()=>{
    try{ window.speechSynthesis.resume(); }catch(e){ /* ignore */ }
  }, 5000);
}

/* ---------------- comando de voz para marcar pontos/saque -----------------
   Fala algo como "Ataque João" ou "Bloqueio Maria" e o app marca sozinho,
   sem precisar tocar no botão do card do jogador. */
function normalizeVoiceText(str){
  return String(str||'')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,''); // remove acentos
}

// converte variações de transcrição para a forma canônica de cada palavra,
// pra funcionar com todas as frases já cadastradas sem precisar duplicá-las
function applyVoiceSynonyms(text){
  text = text.replace(/\b(err|erru|ero|eru|erro)\b/g, 'erro');
  text = text.replace(/\b(sac|saque)\b/g, 'saque');
  text = text.replace(/\b(paz|pass|passi|pasi|passe)\b/g, 'passe');
  return text;
}

/* ---------------- comando de voz por código numérico ----------------
   Cada jogador tem uma posição fixa de 1 a 12 (1-6 = jogadores do Time 1,
   na ordem do elenco; 7-12 = jogadores do Time 2, na ordem do elenco) e
   cada ação tem um dígito de 1 a 8 (1=ataque, 2=pingada, 3=bloqueio,
   4=ace, 5=ataque errado, 6=saque errado, 7=passe errado, 8=infração).
   O código falado é: posição*10 + ação (ex.: jogador 7, ataque = 71;
   jogador 12, infração = 128). Basta falar só o número, em algarismos
   ("setenta e um") ou por extenso ("71"), para marcar direto. */
const VOICE_CODE_ACTION_MAP = {1:'ataqueCerto', 2:'pingada', 3:'bloqueio', 4:'ace', 5:'ataqueErrado', 6:'saqueErrado', 7:'passeErrado', 8:'infracao'};

/* mapa de códigos usado SÓ nas combinações "nome + código"/"código + nome"
   (ex.: "João 10", "10 João") — independente da tabela posição*10+ação
   acima. 1=ataque, 2=pingada, 3=bloqueio, 4=ace, 10=ataque errado,
   20=saque errado, 30=passe errado, 40=infração. */
const NAME_CODE_ACTION_MAP = {1:'ataqueCerto', 2:'pingada', 3:'bloqueio', 4:'ace', 10:'ataqueErrado', 20:'saqueErrado', 30:'passeErrado', 40:'infracao'};
const NAME_CODE_VALID_DIGITS = Object.keys(NAME_CODE_ACTION_MAP).map(Number);

const VOICE_NUMBER_WORDS = {
  'zero':0,'um':1,'uma':1,'dois':2,'duas':2,'tres':3,'quatro':4,'cinco':5,'seis':6,'sete':7,'oito':8,'nove':9,
  'dez':10,'onze':11,'doze':12,'treze':13,'catorze':14,'quatorze':14,'quinze':15,
  'dezesseis':16,'dezasseis':16,'dezessete':17,'dezassete':17,'dezoito':18,'dezenove':19,'dezanove':19,
  'vinte':20,'trinta':30,'quarenta':40,'cinquenta':50,'sessenta':60,'setenta':70,'oitenta':80,'noventa':90,
  'cem':100,'cento':100
};

// interpreta um número falado (em algarismos ou por extenso) como inteiro,
// ou retorna null se o texto não for um número reconhecível
function parseSpokenNumber(text){
  const trimmed = (text||'').trim();
  if(!trimmed) return null;
  if(/^\d{1,3}$/.test(trimmed)) return parseInt(trimmed, 10);
  const words = trimmed.split(/\s+/).filter(w => w && w!=='e');
  if(words.length===0 || words.length>4) return null; // códigos são curtos (até "cento e vinte e oito")
  let total = 0;
  for(const w of words){
    if(VOICE_NUMBER_WORDS[w]===undefined) return null; // alguma palavra não é numérica -> não é um código
    total += VOICE_NUMBER_WORDS[w];
  }
  return total;
}

// converte um código (ex.: 71) no time/jogador/ação correspondentes,
// segundo a tabela posição*10+ação; retorna null se o código não existir
// (fora da faixa, ação inválida, ou jogador inexistente naquela posição)
function decodeVoiceCode(num){
  if(num===null || num<11 || num>128) return null;
  const actionDigit = num % 10;
  const position = Math.floor(num/10);
  if(position<1 || position>12) return null;
  const actionKey = VOICE_CODE_ACTION_MAP[actionDigit];
  if(!actionKey) return null;
  const team = position<=6 ? 'A' : 'B';
  const idx = position<=6 ? position-1 : position-7;
  const teamObj = slotTeam(team);
  const player = teamObj && teamObj.players[idx];
  if(!player) return null;
  return {team, player, actionKey};
}

// tenta tratar a fala inteira como um código numérico; retorna true se
// tratou (marcou a ação ou avisou erro), false se não era um código
function tryVoiceCodeCommand(rawNormText, rawText){
  const num = parseSpokenNumber(rawNormText);
  if(num===null) return false;
  const decoded = decodeVoiceCode(num);
  if(!decoded){
    showToast('Código de voz não corresponde a nenhum jogador: "' + rawText + '"');
    speak('Código não reconhecido.');
    return true;
  }
  applyAction(decoded.team, decoded.player, decoded.actionKey);
  return true;
}

// interpreta uma palavra como o código de uma ação nas combinações
// "nome + código" (em algarismo ou por extenso — reaproveita
// VOICE_NUMBER_WORDS); válido apenas para os códigos de NAME_CODE_ACTION_MAP
// (1,2,3,4,10,20,30,40); retorna null se não for
function parseActionDigitToken(word){
  if(/^-?\d{1,2}$/.test(word)){
    const n = parseInt(word, 10);
    return NAME_CODE_VALID_DIGITS.includes(n) ? n : null;
  }
  const val = VOICE_NUMBER_WORDS[word];
  if(val!==undefined && NAME_CODE_VALID_DIGITS.includes(val)) return val;
  return null;
}

// reconhece as combinações "nome do jogador + código da ação" (ex.: "joao 1")
// e "código da ação + nome do jogador" (ex.: "1 joao"), onde o código segue
// NAME_CODE_ACTION_MAP: 1=ataque, 2=pingada, 3=bloqueio, 4=ace,
// 10=ataque errado, 20=saque errado, 30=passe errado, 40=infração.
// Retorna true se reconheceu o padrão (marcou a ação ou avisou erro do
// jogador), false se a fala não tem essa forma (código só na ponta).
function tryVoiceNameCodeCommand(text, rawText){
  const words = text.split(/\s+/).filter(Boolean);
  if(words.length < 2) return false;

  const firstDigit = parseActionDigitToken(words[0]);
  const lastDigit = parseActionDigitToken(words[words.length-1]);

  let actionDigit, nameWords;
  if(firstDigit!==null){
    actionDigit = firstDigit;
    nameWords = words.slice(1);
  } else if(lastDigit!==null){
    actionDigit = lastDigit;
    nameWords = words.slice(0, -1);
  } else {
    return false;
  }
  if(nameWords.length===0) return false;

  const actionKey = NAME_CODE_ACTION_MAP[actionDigit];
  const found = findPlayerByVoiceName(nameWords.join(' '));
  if(!found){
    showToast('Não entendi o jogador em: "' + rawText + '"');
    speak('Não entendi o jogador.');
    return true;
  }
  applyAction(found.team, found.player, actionKey);
  return true;
}

// quando o comando de voz tem 2 ou mais palavras, a PRIMEIRA palavra é
// entendida pelo prefixo com que começa (cobre qualquer variação de
// transcrição que comece assim, mesmo que não esteja na lista de sinônimos):
// "at"->ataque, "sa"->saque, "pi"->pingada, "bl"->bloqueio, "ei"->ace,
// "er"->erro, "pa"->passe, "in"->infração
const VOICE_FIRST_WORD_PREFIXES = [
  {prefix:'at', word:'ataque'},
  {prefix:'sa', word:'saque'},
  {prefix:'pi', word:'pingada'},
  {prefix:'bl', word:'bloqueio'},
  {prefix:'ei', word:'ace'},
  {prefix:'er', word:'erro'},
  {prefix:'pa', word:'passe'},
  {prefix:'in', word:'infracao'},
];
function applyFirstWordPrefix(text){
  const words = text.split(/\s+/).filter(Boolean);
  if(words.length < 2) return text; // regra só vale com 2+ palavras no comando
  const first = words[0];
  const match = VOICE_FIRST_WORD_PREFIXES.find(m => first.startsWith(m.prefix));
  if(match){
    words[0] = match.word;
    return words.join(' ');
  }
  return text;
}

// ordem importa: frases mais específicas primeiro, para não confundir
// "ataque errado" com "ataque", "saque errado" com "saque" etc.
const VOICE_ACTION_PHRASES = [
  {key:'ataqueErrado', phrases:['ataque errado','erro de ataque','erro ataque','ataque erro']},
  {key:'saqueErrado',  phrases:['saque errado','erro de saque','erro saque','saque erro']},
  {key:'passeErrado',  phrases:['passe errado','erro de passe','erro passe','passe erro']},
  {key:'infracao',     phrases:['infracao','falta']},
  {key:'bloqueio',     phrases:['bloqueio','bloco','block']},
  {key:'pingada',      phrases:['pingada','larga','largada','pingar','pingo','pigada']},
  {key:'ace',          phrases:['ace','eice','eis','aice','ecis','ei si','eici','ei se','esse','ici','ah ci','issi']},
  {key:'ataqueCerto',  phrases:['ataque certo','ataque']},
];

// só processa a fala como comando se ela começar com uma dessas palavras
// (ou uma variação parecida) — evita reagir a conversas/ruído de fundo
const VOICE_TRIGGER_WORDS = ['saque','sac','ataque','pingada','larga','largada','pingar','pingo','pigada','bloqueio','bloco','block','infracao','falta','eice','ace','eis','esse','ici','issi','ei','ah','desfazer','erro','ponto','passe','paz','pass','passi','pasi'];
function startsWithVoiceTrigger(text){
  const firstWord = (text.split(/\s+/)[0] || '').trim();
  if(!firstWord) return false;
  return VOICE_TRIGGER_WORDS.some(trig=>{
    if(firstWord===trig || firstWord.startsWith(trig) || trig.startsWith(firstWord)) return true;
    const threshold = Math.max(1, Math.floor(trig.length/3));
    return levenshteinDistance(firstWord, trig) <= threshold;
  });
}

// distância de edição (Levenshtein) — usada para aceitar variações de fala/
// transcrição parecidas com o nome do jogador (ex: "joao"/"jao", "adauto"/"adaltom")
function levenshteinDistance(a, b){
  const m = a.length, n = b.length;
  if(m===0) return n;
  if(n===0) return m;
  const dp = new Array(n+1);
  for(let j=0;j<=n;j++) dp[j] = j;
  for(let i=1;i<=m;i++){
    let prevDiag = dp[0];
    dp[0] = i;
    for(let j=1;j<=n;j++){
      const temp = dp[j];
      dp[j] = a[i-1]===b[j-1] ? prevDiag : 1 + Math.min(prevDiag, dp[j], dp[j-1]);
      prevDiag = temp;
    }
  }
  return dp[n];
}

function findPlayerByVoiceName(text){
  const words = text.split(/\s+/).filter(w=>w.length>=2);
  let best = null; // {player, team, dist, nameLen}

  [slotTeam('A'), slotTeam('B')].forEach((teamObj, idx)=>{
    if(!teamObj) return;
    const slot = idx===0 ? 'A' : 'B';
    teamObj.players.forEach(p=>{
      const pname = normalizeVoiceText(p.name).trim();
      if(pname.length<2) return;

      // 1) correspondência exata (substring) — a mais confiável
      if(text.includes(pname)){
        if(!best || best.dist>0 || pname.length > best.nameLen){
          best = {player:p, team:slot, dist:0, nameLen:pname.length};
        }
        return;
      }

      // 2) correspondência aproximada, palavra por palavra da fala,
      // tolerando variações de pronúncia/transcrição do nome
      words.forEach(w=>{
        const dist = levenshteinDistance(w, pname);
        const threshold = Math.max(1, Math.floor(pname.length/3));
        if(dist <= threshold && (!best || dist < best.dist)){
          best = {player:p, team:slot, dist, nameLen:pname.length};
        }
      });
    });
  });
  return best;
}

function speakScoreCommand(){
  const a = slotTeam('A'), b = slotTeam('B');
  const msg = 'Placar: ' + teamDisplayName(a) + ' ' + state.score.A + ' a ' + state.score.B + ' ' + teamDisplayName(b) + '.';
  speak(msg);
  showToast(msg);
}
function speakLastMarkingCommand(){
  if(state.history.length===0){
    speak('Nenhuma marcação registrada ainda.');
    showToast('Nenhuma marcação registrada ainda.');
    return;
  }
  const last = state.history[state.history.length-1];
  const msg = 'Última marcação: ' + last.label + ', ' + last.playerName + '.';
  speak(msg);
  showToast(msg);
}

function processVoiceCommand(rawText){
  const rawNorm = normalizeVoiceText(rawText).trim();

  // comando por código numérico da tabela (ex.: "71", "onze", "cento e vinte e oito")
  // tem prioridade e é checado antes de qualquer outra interpretação
  if(tryVoiceCodeCommand(rawNorm, rawText)) return;

  const text = applyVoiceSynonyms(applyFirstWordPrefix(rawNorm));

  // comandos informativos — funcionam em qualquer posição da fala,
  // não dependem de começar com uma palavra-gatilho de ação
  if(text.includes('ultima marcacao') || text.includes('ultimo historico') || text.includes('ultima historico') || text.includes('ultimo marcacao')){
    speakLastMarkingCommand();
    return;
  }
  if(text.includes('placar')){
    speakScoreCommand();
    return;
  }

  // combinações "nome + código" / "código + nome" (ex.: "joao 1", "1 joao")
  // não dependem de começar com uma palavra-gatilho de ação, então são a
  // alternativa quando a fala não bate com nenhum comando por palavra —
  // checadas ANTES de ignorar silenciosamente, mas DEPOIS de garantir que
  // não é um comando por palavra-gatilho normal (ex.: "ponto direto time 1",
  // cujo nome de time termina em dígito e não pode ser confundido com código)
  if(!startsWithVoiceTrigger(text)){
    if(tryVoiceNameCodeCommand(text, rawText)) return;
    // ignora silenciosamente falas que não começam com uma palavra de comando
    // reconhecida (conversas de fundo, ruído etc. não geram aviso nenhum)
    return;
  }

  // "desfazer"
  if(text.startsWith('desfazer') || levenshteinDistance(text.split(/\s+/)[0]||'', 'desfazer') <= 2){
    performUndo();
    return;
  }

  // "ponto direto time 1 / time 2"
  if(text.includes('ponto')){
    const teamA = slotTeam('A'), teamB = slotTeam('B');
    if(teamA && text.includes(normalizeVoiceText(teamDisplayName(teamA)))){
      quickPoint('A'); showToast('Comando de voz: ponto direto ' + teamDisplayName(teamA)); return;
    }
    if(teamB && text.includes(normalizeVoiceText(teamDisplayName(teamB)))){
      quickPoint('B'); showToast('Comando de voz: ponto direto ' + teamDisplayName(teamB)); return;
    }
  }

  const actionMatch = VOICE_ACTION_PHRASES.find(a => a.phrases.some(ph => text.includes(ph)));
  if(!actionMatch){
    showToast('Comando de voz não reconhecido: "' + rawText + '"');
    speak('Comando não reconhecido.');
    return;
  }
  const found = findPlayerByVoiceName(text);
  if(!found){
    showToast('Não entendi o jogador em: "' + rawText + '"');
    speak('Não entendi o jogador.');
    return;
  }
  applyAction(found.team, found.player, actionMatch.key);
}

let voiceRecognition = null;
let voiceListening = false;
let voiceBuffer = '';
let voiceBufferTimer = null;
function getSpeechRecognitionCtor(){
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}
function startVoiceCommand(){
  const Ctor = getSpeechRecognitionCtor();
  if(!Ctor){
    showToast('Reconhecimento de voz não é suportado neste navegador.');
    return;
  }
  if(location.protocol === 'file:'){
    showErrorToast('O comando de voz não funciona abrindo o arquivo direto (file://). Hospede o app em um site (https) ou servidor local para usar o microfone.');
    return;
  }
  let insideIframe = false;
  try{ insideIframe = (window.self !== window.top); }catch(e){ insideIframe = true; }

  // diagnóstico: confere o estado real da permissão antes de tentar (quando suportado)
  if(navigator.permissions && navigator.permissions.query){
    navigator.permissions.query({name:'microphone'}).then(status=>{
      console.log('[voz] estado da permissão de microfone via Permissions API:', status.state);
      if(status.state === 'denied'){
        showErrorToast('O navegador informa a permissão de microfone como "denied" (negada) para esta página — meio caminho pra não confiar só na configuração geral do navegador. Confira nas configurações do site (ícone de cadeado ao lado do endereço).');
      }
    }).catch(err=>{
      console.log('[voz] não foi possível checar a permissão via Permissions API:', err);
    });
  }

  // Solicita o microfone explicitamente ANTES de iniciar o reconhecimento
  // de voz. No Android, chamar apenas SpeechRecognition.start() às vezes não
  // exibe o diálogo nativo "Permitir que o site use o microfone?" — em
  // especial quando o app foi instalado na tela inicial (PWA) ou está rodando
  // dentro de um WebView. Pedir getUserMedia primeiro garante que o
  // navegador mostre essa solicitação de forma explícita e confiável.
  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true})
      .then(stream=>{
        // só precisávamos disparar a solicitação/permissão; a captura de
        // áudio em si fica a cargo do próprio SpeechRecognition
        stream.getTracks().forEach(t=> t.stop());
        beginSpeechRecognition(Ctor, insideIframe);
      })
      .catch(err=>{
        console.error('[voz] solicitação de microfone (getUserMedia) negada/falhou:', err);
        const name = err && err.name;
        if(name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError'){
          showErrorToast('Permissão de microfone negada. No Android: toque no ícone de cadeado/informações ao lado do endereço do site e libere o microfone; se o app estiver instalado na tela inicial, confira também em Configurações do Android → Apps → (nome do app/navegador) → Permissões → Microfone.');
        } else if(name === 'NotFoundError' || name === 'DevicesNotFoundError'){
          showErrorToast('Nenhum microfone encontrado no dispositivo.');
        } else {
          showErrorToast('Não foi possível acessar o microfone' + (err && err.message ? (': ' + err.message) : '') + '.');
        }
      });
  } else {
    // navegador sem suporte a getUserMedia — tenta iniciar o reconhecimento
    // de voz diretamente (ele fará sua própria solicitação de permissão)
    beginSpeechRecognition(Ctor, insideIframe);
  }
}

function beginSpeechRecognition(Ctor, insideIframe){
  voiceRecognition = new Ctor();
  voiceRecognition.lang = 'pt-BR';
  voiceRecognition.continuous = true;
  voiceRecognition.interimResults = false;

  voiceRecognition.onresult = (e)=>{
    const last = e.results[e.results.length-1];
    if(last && last.isFinal){
      const transcript = last[0].transcript;
      processVoiceCommand(transcript);
    }
  };
  voiceRecognition.onerror = (e)=>{
    console.error('Erro no reconhecimento de voz:', e.error);
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      // permissão negada/bloqueada — parar de tentar de novo sozinho
      voiceListening = false;
      $('#btnVoiceCmd').classList.remove('listening');
      $('#btnVoiceCmd').title = 'Marcar pontos por comando de voz';
      if(insideIframe){
        showErrorToast('Microfone bloqueado porque o app está sendo aberto dentro de outra página/moldura (iframe) sem permissão de microfone liberada — mesmo com o microfone autorizado no navegador. Abra o arquivo .html sozinho, numa aba própria do navegador (fora de qualquer visualização incorporada), para funcionar.');
      } else {
        showErrorToast('Permissão de microfone negada para esta página. Se já autorizou no navegador, verifique também a permissão de microfone do PRÓPRIO SISTEMA (Windows/macOS/Android) para este navegador — é uma segunda camada de bloqueio, separada da permissão do site.');
      }
    } else if(e.error === 'audio-capture'){
      voiceListening = false;
      $('#btnVoiceCmd').classList.remove('listening');
      showErrorToast('Nenhum microfone encontrado no dispositivo.');
    } else if(e.error === 'no-speech'){
      // normal, sem fala detectada — o onend cuida de reiniciar sozinho
    } else if(e.error === 'network'){
      showToast('Erro de rede no reconhecimento de voz.');
    }
  };
  voiceRecognition.onend = ()=>{
    if(voiceListening && !suppressVoiceRestart){
      try{ voiceRecognition.start(); } // navegador para sozinho após silêncio; reinicia
      catch(e){ /* já iniciado */ }
    }
  };

  try{
    voiceRecognition.start();
    voiceListening = true;
    $('#btnVoiceCmd').classList.add('listening');
    $('#btnVoiceCmd').title = 'Ouvindo comandos de voz... (toque para parar)';
    showToast('Comando de voz ativado — fale, por exemplo, "Ataque João".');
  }catch(e){
    console.error('Falha ao iniciar reconhecimento de voz:', e);
    showToast('Não foi possível ativar o comando de voz.');
  }
}
function stopVoiceCommand(){
  voiceListening = false;
  if(voiceRecognition){
    try{ voiceRecognition.stop(); }catch(e){ /* ignore */ }
  }
  if(voiceBufferTimer){ clearTimeout(voiceBufferTimer); voiceBufferTimer = null; }
  voiceBuffer = '';
  $('#btnVoiceCmd').classList.remove('listening');
  $('#btnVoiceCmd').title = 'Marcar pontos por comando de voz';
  showToast('Comando de voz desativado.');
}
$('#btnVoiceCmd').addEventListener('click', ()=>{
  if(voiceListening) stopVoiceCommand();
  else startVoiceCommand();
});

function applyAction(team, player, actionKey){
  pushUndoSnapshot();

  const actionDef = ACTIONS.find(a=>a.key===actionKey);

  if(actionKey==='ace' && state.servingPlayerId && state.servingPlayerId !== player.id){
    const server = findPlayerAnywhereById(state.servingPlayerId);
    const serverName = server ? server.name : 'outro jogador';
    state.errorMessage = 'Ace só pode ser marcado para quem sacou! Quem sacou foi ' + serverName + '.';
    speak('Atenção! Ace só vale para quem sacou, ' + serverName + '.');
    markDirty();
    renderAll();
    return;
  }

  player.stats[actionKey] += 1;
  speak((actionDef.speakTitle || actionDef.title) + ' ' + player.name);

  // marca quem efetuou o último ponto — só quando o próprio jogador pontuou
  // diretamente (ataque certo, pingada, bloqueio, ace); erros dão ponto ao
  // adversário, então ninguém "efetuou" o ponto nesse caso
  state.lastScorerPlayerId = actionDef.pt>0 ? player.id : null;
  // marca quem cometeu o último erro (ataque errado, saque errado, passe
  // errado, infração) — o inverso do último ponto certo
  state.lastErrorPlayerId = actionDef.pt<0 ? player.id : null;

  const winningTeam = actionDef.pt>0 ? team : (team==='A'?'B':'A');
  logEvent(team, player, actionDef.title, winningTeam, actionDef.key);
  awardPoint(winningTeam);
}

function quickPoint(team){
  pushUndoSnapshot();
  state.lastScorerPlayerId = null; // ponto direto não tem jogador específico associado
  state.lastErrorPlayerId = null;
  logEvent(team, {name:'Ponto direto'}, 'Ponto direto', team, null);
  speak('Ponto direto ' + teamDisplayName(slotTeam(team)));
  awardPoint(team, true); // exceção: "+1 direto" não exige saque confirmado antes
}

function logEvent(actingTeam, player, label, winningTeam, actionKey){
  state.history.push({
    set: state.setNum,
    team: actingTeam,
    playerId: player.id || null,
    playerName: player.name,
    pos: player.pos || null, // posição do jogador no momento da ação — usada para
                              // reconstruir corretamente as estatísticas do set (ver buildSetPlayerRows)
    label: label,
    actionKey: actionKey || null,
    winningTeam: winningTeam,
    scoreA: state.score.A,
    scoreB: state.score.B
  });
}

function awardPoint(team, skipServeCheck){
  const isSideOut = state.serve !== team; // o saque mudou de time

  if(!skipServeCheck){
    if(!state.serveConfirmed){
      state.errorMessage = 'Você esqueceu de marcar o saque!';
      speak('Atenção! Marque o saque.');
    } else {
      state.errorMessage = null; // saque confirmado certinho — some qualquer aviso de erro pendente
    }
  }

  state.score[team] += 1;
  state.serve = team; // rally scoring: team that wins the point serves next
  // update the last history entry's displayed score to reflect new score
  const last = state.history[state.history.length-1];
  if(last){ last.scoreA = state.score.A; last.scoreB = state.score.B; }

  if(isSideOut){
    assignServerForRotation(team);
  }
  autoConfirmNextServe(team); // marca o saque do próximo sacador sozinho (não precisa mais tocar "Saq")

  markDirty();
  renderAll();
}

/* Depois de cada ponto, o saque do próximo sacador é marcado/confirmado
   automaticamente (conta a estatística de saque, fala o comando de voz do
   saque e libera a marcação do próximo ponto direto). Só o 1º saque da
   partida/de cada set continua exigindo toque manual no botão "Saq" —
   ver isFirstServeEver em applyAction. Fica guardada em lastAutoServe a
   referência desse saque, para poder ser desfeito se o set acabar antes
   dele realmente acontecer (ver removePendingAutoServe/finishSet). */
let lastAutoServe = null;
function autoConfirmNextServe(team){
  const player = findPlayerAnywhereById(state.servingPlayerId);
  if(player){
    player.stats.saqueCerto += 1;
    logEvent(team, player, STAT_ONLY.title, team, STAT_ONLY.key);
    speak(STAT_ONLY.title + ' ' + player.name);
    lastAutoServe = { player, entry: state.history[state.history.length-1] };
  } else {
    lastAutoServe = null;
  }
  state.serveConfirmed = true;
}

/* Remove o saque marcado automaticamente logo após o último ponto do set,
   caso o set seja encerrado antes desse saque realmente acontecer — ele foi
   marcado só como previsão de quem sacaria a seguir. */
function removePendingAutoServe(){
  if(!lastAutoServe) return;
  const { player, entry } = lastAutoServe;
  const idx = state.history.lastIndexOf(entry);
  if(idx !== -1) state.history.splice(idx, 1);
  if(player) player.stats.saqueCerto = Math.max(0, player.stats.saqueCerto - 1);
  lastAutoServe = null;
}

function archiveFinishedSet(a, b){
  const teamA = slotTeam('A'), teamB = slotTeam('B');
  setArchive.unshift({
    id: uid(),
    endedAt: new Date().toISOString(),
    setNum: state.setNum,
    teamAName: teamDisplayName(teamA),
    teamBName: teamDisplayName(teamB),
    scoreA: a,
    scoreB: b,
    teamAPlayers: buildSetPlayerRows('A', state.setNum, teamA.players),
    teamBPlayers: buildSetPlayerRows('B', state.setNum, teamB.players)
  });
}

/* Refaz a entrada arquivada (usada nas telas "Sets encerrados" e no PDF) de
   um set já fechado, a partir do state ATUAL — chamada antes de sair de um
   set fechado que estava sendo visitado/editado pela caixa de seleção, pra
   manter o resumo em dia com qualquer correção feita nele. */
function resyncArchivedSet(setNum){
  const entry = setArchive.find(s=> s.setNum===setNum);
  if(!entry) return;
  const teamA = slotTeam('A'), teamB = slotTeam('B');
  entry.scoreA = state.score.A;
  entry.scoreB = state.score.B;
  entry.teamAPlayers = buildSetPlayerRows('A', setNum, teamA.players);
  entry.teamBPlayers = buildSetPlayerRows('B', setNum, teamB.players);
}

/* Deriva setsHistory / setsWonA / setsWonB (o resuminho "X sets a Y" da
   partida) a partir do setArchive — a fonte única da verdade pra esses
   totais — em vez de confiar na cópia que ficou congelada dentro de cada
   snapshot de set, que pode ter ficado desatualizada depois de uma edição
   feita num set já fechado (por exemplo, se ela virou o placar do set). */
function recomputeMatchSummaryFields(){
  const sorted = setArchive.slice().sort((a,b)=> a.setNum-b.setNum);
  state.setsHistory = sorted.map(s=> ({a:s.scoreA, b:s.scoreB}));
  state.setsWonA = sorted.filter(s=> s.scoreA>s.scoreB).length;
  state.setsWonB = sorted.filter(s=> s.scoreB>s.scoreA).length;
}

function finishSet(){
  removePendingAutoServe(); // o último saque automático (após o ponto final) nunca aconteceu de verdade

  const a = state.score.A, b = state.score.B;
  state.setsHistory.push({a,b});
  if(a>b) state.setsWonA++;
  else if(b>a) state.setsWonB++;
  // empate: o set é registrado, mas nenhum time soma vitória de set

  archiveFinishedSet(a,b); // guarda o set (placar + estatísticas) no histórico de sets encerrados,
                            // já que a partida em si é infinita — só os sets se encerram e trocam

  setSnapshots[state.setNum] = clone(state); // guarda o state completo desse set (placar, saque, rodízio,
                                              // histórico até aqui) — pra poder reabrir e editar depois
                                              // pela caixa de seleção, sem perder nada

  undoRedoBySet[state.setNum] = {undo: undoStack, redo: redoStack}; // guarda a pilha de desfazer/refazer
                                                                     // desse set — o novo set começa com a dele própria, vazia
  undoStack = [];
  redoStack = [];

  state.setNum += 1;
  liveSetNum = state.setNum; // o novo set passa a ser o "em andamento"
  state.score = {A:0,B:0};
  // quem saca o novo set é definido automaticamente, alternando com o set anterior
  resetRotation();
  autoAssignFirstServe();

  // permanece na partida — a quadra já fica pronta para o novo set
  switchTab('court');

  markDirty();
  renderAll();
  showToast('Set encerrado — Set ' + state.setNum + ' iniciado.');
}

function showEndSetDialog(){
  if(state.setNum !== liveSetNum){
    showToast('Volte para o set em andamento (pela caixa de seleção) para poder encerrá-lo.');
    return;
  }
  const a = state.score.A, b = state.score.B;
  showConfirmDialog(`Tem certeza que deseja encerrar o Set ${state.setNum} (placar ${a}–${b}) e avançar para o próximo set?`, ()=>{
    pushUndoSnapshot();
    finishSet();
  });
}

/* Caixa de seleção "Visitar set": deixa abrir qualquer set já encerrado (ou
   voltar para o set em andamento) sem perder NADA de nenhum lado — tudo o
   que está no set que está sendo deixado (fechado ou em andamento) é
   salvo em setSnapshots antes de trocar, e qualquer edição feita num set
   fechado é sincronizada de volta com o resumo arquivado (Sets encerrados
   / PDF) ao sair dele. */
function switchToSet(targetSetNum){
  targetSetNum = Number(targetSetNum);
  if(!targetSetNum || targetSetNum === state.setNum) return;

  const leavingSetNum = state.setNum;
  if(leavingSetNum !== liveSetNum) resyncArchivedSet(leavingSetNum); // só sets fechados têm entrada arquivada pra sincronizar
  setSnapshots[leavingSetNum] = clone(state); // salva o set que está sendo deixado, com tudo que foi feito nele
  undoRedoBySet[leavingSetNum] = {undo: undoStack, redo: redoStack}; // guarda a pilha de desfazer/refazer desse set

  const target = setSnapshots[targetSetNum];
  if(!target){
    showToast('Não foi possível abrir o Set ' + targetSetNum + '.');
    return;
  }

  state = clone(target);
  lastAutoServe = null;
  const savedStacks = undoRedoBySet[targetSetNum];
  undoStack = savedStacks ? savedStacks.undo : []; // cada set tem a própria pilha — "Desfazer"/"Refazer" continuam funcionando ao visitar um set encerrado
  redoStack = savedStacks ? savedStacks.redo : [];
  recomputeMatchSummaryFields();
  markDirty();
  switchTab('court');
  renderAll();
  showToast('Abrindo o Set ' + targetSetNum + (targetSetNum===liveSetNum ? ' (em andamento).' : '.'));
}

/* Preenche a caixa de seleção com um item por set: os já encerrados (em
   ordem) e, por último, o "em andamento" — que é sempre o liveSetNum. */
function renderSetSwitcher(){
  const sel = $('#setSwitcher');
  if(!sel) return;
  const closed = setArchive.slice().sort((a,b)=> a.setNum-b.setNum);
  const opts = closed
    .filter(s=> s.setNum !== liveSetNum && setSnapshots[s.setNum]) // só lista sets que realmente têm um snapshot pra abrir (partidas salvas antes dessa função existir não têm)
    .map(s=> `<option value="${s.setNum}" ${state.setNum===s.setNum?'selected':''}>Set ${s.setNum} (${s.scoreA}–${s.scoreB})</option>`);
  opts.push(`<option value="${liveSetNum}" ${state.setNum===liveSetNum?'selected':''}>Set ${liveSetNum} (em andamento)</option>`);
  sel.innerHTML = opts.join('');
}

function showConfirmDialog(message, onConfirm){
  const overlay = document.createElement('div');
  overlay.className = 'celebrate';
  overlay.innerHTML = `
    <h2 style="font-size:28px;">Confirmar</h2>
    <p>${escapeHtml(message)}</p>
    <div style="display:flex; gap:10px;">
      <button class="cel-btn" id="confirmCancelBtn" style="background:var(--bg-elev-2); color:var(--text); border:1px solid var(--line);">Cancelar</button>
      <button class="cel-btn" id="confirmOkBtn">Confirmar</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#confirmCancelBtn').addEventListener('click', ()=> overlay.remove());
  overlay.querySelector('#confirmOkBtn').addEventListener('click', ()=>{
    overlay.remove();
    onConfirm();
  });
}

/* quick point buttons + mini action buttons (marcação por jogador) */
document.body.addEventListener('click', (e)=>{
  const q = e.target.closest('.quick-pt');
  if(q){ quickPoint(q.dataset.team); return; }

  const miniBtn = e.target.closest('.mini-action');
  if(miniBtn){
    const team = miniBtn.dataset.team;
    const player = slotTeam(team).players.find(p=>p.id===miniBtn.dataset.player);
    if(player) applyAction(team, player, miniBtn.dataset.action);
    return;
  }
});

/* ---------------- undo / reset / end ---------------- */
function performUndo(){
  if(undoStack.length===0){
    showToast('Não há nada para desfazer.');
    return false;
  }
  redoStack.push(clone(state));
  state = undoStack.pop();
  lastAutoServe = null;
  markDirty();
  speak('Desfazer');
  renderAll();
  return true;
}
function performRedo(){
  if(redoStack.length===0){
    showToast('Não há nada para refazer.');
    return false;
  }
  undoStack.push(clone(state));
  state = redoStack.pop();
  lastAutoServe = null;
  markDirty();
  speak('Refazer');
  renderAll();
  return true;
}
$('#btnUndo').addEventListener('click', performUndo);
$('#btnRedo').addEventListener('click', performRedo);

$('#btnEndSet').addEventListener('click', showEndSetDialog);
$('#setSwitcher').addEventListener('change', e=> switchToSet(e.target.value));

function showToast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 2200);
}

function showErrorToast(msg){
  const t = document.createElement('div');
  t.className='toast toast-error'; t.textContent = '⚠️ ' + msg;
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 3200);
}

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

/* ---------------- botão voltar (celular / notebook) ----------------
   Objetivo: o botão/gesto de voltar do dispositivo nunca deve sair do
   app "de repente". Prioridade do que o voltar faz:
     1) fecha um sheet aberto (Ajuda, Versões, Sets encerrados);
     2) fecha um diálogo aberto (confirmação, senha);
     3) se estiver editando os times a partir de uma partida em
        andamento, volta para a partida;
     4) se houver uma aba anterior (Quadra/Estatísticas/Histórico),
        volta para ela; a partir da Quadra (primeira aba), volta para a
        tela inicial "Nova Partida" (a partida continua salva, dá pra
        retomá-la com "Voltar para a partida");
     5) se não houver mais nada para voltar dentro do app, salva os
        dados na nuvem e pergunta se o usuário realmente quer fechar.
   O app nunca é encerrado sem que o salvamento tenha sido concluído. */

/* Salvamento automático periódico: a cada 30 minutos, se houver alterações
   não salvas. Não dispara mais logo após cada ação/ponto marcado. */
setInterval(()=>{
  if(hasUnsavedChanges) saveState();
}, 30*60*1000);

function closeTopSheet(){
  const sheet = $('.sheet-backdrop');
  if(sheet){ sheet.remove(); return true; }
  return false;
}
function closeTopDialog(){
  const dlg = $('.celebrate');
  if(dlg){ dlg.remove(); return true; }
  return false;
}

let closeConfirmOpen = false;
let allowRealExit = false;

async function handleBackNavigation(){
  if(closeConfirmOpen) return; // já tem a pergunta de fechar na tela

  if(closeTopSheet()) return;
  if(closeTopDialog()) return;

  const setupVisible = $('#setupScreen') && !$('#setupScreen').classList.contains('hidden');
  if(cameFromMatch && setupVisible){
    cameFromMatch = false;
    showMatch();
    return;
  }

  if(state && state.started){
    // dentro das abas volta uma aba; a partir da Quadra (primeira aba), volta
    // para a tela inicial "Nova Partida" — mesmo comportamento do botão "◀ Voltar"
    goTabBack();
    return;
  }

  await confirmAppClose();
}

async function confirmAppClose(){
  if(closeConfirmOpen) return;
  closeConfirmOpen = true;

  const saved = await saveState(); // sempre tenta salvar antes de perguntar

  const overlay = document.createElement('div');
  overlay.className = 'celebrate';
  overlay.innerHTML = `
    <h2 style="font-size:26px;">Fechar aplicativo?</h2>
    <p id="closeSaveMsg">${saved ? 'Seus dados foram salvos na nuvem.' : 'Não foi possível confirmar o salvamento agora. Verifique sua conexão antes de sair.'}</p>
    <div style="display:flex; gap:10px;">
      <button class="cel-btn" id="closeCancelBtn" style="background:var(--bg-elev-2); color:var(--text); border:1px solid var(--line);">Continuar no app</button>
      <button class="cel-btn" id="closeOkBtn" style="background:var(--bad);">Fechar app</button>
    </div>
  `;
  document.body.appendChild(overlay);
  const saveMsgEl = overlay.querySelector('#closeSaveMsg');

  overlay.querySelector('#closeCancelBtn').addEventListener('click', ()=>{
    overlay.remove();
    closeConfirmOpen = false;
  });
  overlay.querySelector('#closeOkBtn').addEventListener('click', async ()=>{
    // nunca fecha sem garantir que os dados estão salvos
    if(hasUnsavedChanges){
      const ok = await saveState();
      if(!ok){
        if(saveMsgEl) saveMsgEl.textContent = 'Ainda tentando salvar — verifique sua conexão e toque em "Fechar app" novamente.';
        return;
      }
    }
    overlay.remove();
    closeConfirmOpen = false;
    allowRealExit = true;
    showToast('Dados salvos. Pode fechar o app com segurança.');
    try{ window.close(); }catch(e){ /* navegador pode bloquear */ }
    setTimeout(()=>{ if(allowRealExit) history.back(); }, 30);
  });
}

function trapBack(){
  history.pushState({voleiTrap:true}, '');
}

window.addEventListener('popstate', ()=>{
  if(allowRealExit) return; // deixa a navegação/fechamento real acontecer
  trapBack(); // neutraliza o "voltar" do navegador — o app continua aberto
  handleBackNavigation();
});

window.addEventListener('beforeunload', (e)=>{
  if(hasUnsavedChanges){
    saveState(); // tentativa de salvar mesmo em fechamentos que não passam pelo botão voltar (ex: fechar aba, atualizar a página)
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});

trapBack(); // arma a armadilha assim que o app carrega

/* ---------------- init ---------------- */
renderVersionBadge();
(async function init(){
  const loaded = await loadState();
  state = loaded || defaultState();
  // sempre abre na tela Nova Partida; se havia uma partida em andamento,
  // permite voltar a ela pelo botão "Voltar para a partida"
  if(state.started){
    cameFromMatch = true;
    editEntryActiveA = state.activeAId;
    editEntryActiveB = state.activeBId;
  } else {
    cameFromMatch = false;
  }
  updateSaveIndicator();
  await loadDisplayPrefs();
  showSetup();
})();

})();
</script>
