<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Marcação Vôlei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1119;
  --bg-elev:#141b26;
  --bg-elev-2:#1b2432;
  --line:#26313f;
  --text:#eef1f5;
  --muted:#8b96a6;
  --muted-2:#5c6779;
  --teamA:#2fb8c6;
  --teamA-dim:#1a4249;
  --teamB:#e8823a;
  --teamB-dim:#4a3320;
  --good:#37c98a;
  --good-dim:#123527;
  --bad:#e5566a;
  --bad-dim:#3a1a20;
  --net-white:#eef1f5;
  --radius:14px;
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100%;overscroll-behavior:none;}
body{min-height:100vh; display:flex; flex-direction:column;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

.court-bg{
  position:fixed; inset:0; z-index:-1;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(47,184,198,0.08), transparent 60%),
    radial-gradient(ellipse 900px 500px at 50% 110%, rgba(232,130,58,0.07), transparent 60%),
    var(--bg);
}

/* ===== Net divider (signature element) ===== */
.net-divider{
  position:relative;
  height:22px;
  margin:0 12px;
  background-image:
    repeating-linear-gradient(90deg, transparent 0 14px, rgba(238,241,245,0.16) 14px 15px),
    repeating-linear-gradient(0deg, transparent 0 6px, rgba(238,241,245,0.16) 6px 7px);
  border-top:2px solid rgba(238,241,245,0.5);
  border-bottom:2px solid rgba(238,241,245,0.5);
  opacity:0.7;
}
.net-antenna{
  position:absolute; top:-2px; bottom:-2px; width:4px;
  background:repeating-linear-gradient(0deg, #e5566a 0 6px, #eef1f5 6px 12px);
  border-radius:2px;
}

/* ===== Top bar ===== */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; border-bottom:1px solid var(--line);
  background:rgba(20,27,38,0.7); backdrop-filter:blur(8px);
  position:sticky; top:0; z-index:20;
}
.brand{display:flex; align-items:center; gap:8px; font-family:'Teko',sans-serif; font-size:22px; letter-spacing:0.5px; font-weight:600; color:var(--text);}
.brand .ball{width:16px;height:16px;border-radius:50%;background:conic-gradient(from 45deg,#2fb8c6 0 90deg,#eef1f5 90deg 180deg,#e8823a 180deg 270deg,#eef1f5 270deg 360deg); box-shadow:0 0 0 1px rgba(255,255,255,0.15) inset;}
.topbar-actions{display:flex; gap:8px; align-items:center;}
.version-badge{
  display:flex; flex-direction:column; align-items:flex-end; justify-content:center;
  background:var(--bg-elev-2); border:1px solid var(--line); border-radius:10px;
  padding:4px 10px; cursor:pointer; line-height:1.2;
}
.version-badge #versionTag{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; color:var(--text);}
.version-badge .version-date{font-size:9px; color:var(--muted-2); font-weight:600;}
.version-badge:active{transform:scale(0.96);}

.width-panel{
  display:flex; flex-direction:column; gap:8px; padding:10px 14px;
  background:rgba(20,27,38,0.92); border-bottom:1px solid var(--line); backdrop-filter:blur(8px);
}
.dim-row{display:flex; align-items:center; gap:10px;}
.width-panel-label{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; flex-shrink:0; width:48px;}
.width-panel input[type=range]{
  flex:1; -webkit-appearance:none; appearance:none; height:4px; border-radius:2px;
  background:var(--line); outline:none; cursor:pointer;
}
.width-panel input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:18px; height:18px; border-radius:50%;
  background:var(--teamA); cursor:pointer; border:2px solid var(--bg);
}
.width-panel input[type=range]::-moz-range-thumb{
  width:18px; height:18px; border-radius:50%; background:var(--teamA); cursor:pointer; border:2px solid var(--bg);
}
.width-panel-value{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); flex-shrink:0; width:52px; text-align:right;}
.dim-actions{display:flex; gap:8px; justify-content:center;}
.width-panel-reset{
  background:var(--bg-elev-2); border:1px solid var(--line); color:var(--muted);
  font-size:10.5px; font-weight:700; padding:6px 12px; border-radius:8px; cursor:pointer;
}
.width-panel-reset:active{background:var(--bg-elev);}
#widthSavePrefs{color:var(--good); border-color:rgba(55,201,138,0.35); background:var(--good-dim);}

#btnWidthAdjust{font-size:12px; letter-spacing:-2px;}
.changelog-sheet .sheet{max-height:78vh;}

/* ===== Help sheet (regras e comandos de voz) ===== */
.help-sheet .sheet{max-height:86vh; display:flex; flex-direction:column;}
.help-search{
  width:100%; background:var(--bg-elev-2); border:1px solid var(--line); color:var(--text);
  padding:10px 13px; border-radius:11px; font-size:14.5px; font-family:'Inter',sans-serif; outline:none;
  margin-bottom:12px; flex-shrink:0;
}
.help-search:focus{border-color:var(--teamA);}
.help-tabs{display:flex; gap:7px; margin-bottom:14px; flex-wrap:wrap; flex-shrink:0;}
.help-tab-btn{
  background:var(--bg-elev-2); border:1px solid var(--line); color:var(--muted);
  font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:20px; cursor:pointer;
}
.help-tab-btn.active{background:var(--good-dim); border-color:rgba(55,201,138,0.4); color:var(--good);}
.help-scroll{overflow-y:auto; flex:1;}
.help-section{margin-bottom:18px;}
.help-section-title{
  font-family:'Teko',sans-serif; font-size:21px; font-weight:600; color:var(--teamA);
  letter-spacing:0.3px; margin:0 0 8px; display:flex; align-items:center; gap:7px;
}
.help-card{background:var(--bg-elev-2); border:1px solid var(--line); border-radius:12px; padding:2px 0; overflow:hidden;}
.help-item{padding:11px 14px; border-bottom:1px solid var(--line);}
.help-item:last-child{border-bottom:none;}
.help-item-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:3px; flex-wrap:wrap;}
.help-item-name{font-weight:700; font-size:13.5px; color:var(--text);}
.help-item-tag{
  font-family:'JetBrains Mono',monospace; font-size:9.5px; font-weight:700; text-transform:uppercase;
  padding:2px 6px; border-radius:6px; letter-spacing:0.3px; flex-shrink:0;
}
.help-tag-good{background:var(--good-dim); color:var(--good);}
.help-tag-bad{background:var(--bad-dim); color:var(--bad);}
.help-tag-info{background:var(--bg-elev); color:var(--muted);}
.help-item-desc{font-size:12.5px; color:var(--muted); line-height:1.5;}
.help-item-say{
  font-family:'JetBrains Mono',monospace; font-size:11.5px; background:var(--bg-elev);
  border-radius:7px; padding:5px 8px; margin-top:5px; color:var(--teamA); display:inline-block;
}
.help-item-variants{font-size:11px; color:var(--muted-2); margin-top:4px;}
.help-note{
  background:var(--bg-elev-2); border:1px dashed var(--line); border-radius:11px;
  padding:11px 13px; font-size:11.5px; color:var(--muted); line-height:1.5; margin-top:4px;
}
.help-note b{color:var(--text);}
.help-empty{text-align:center; color:var(--muted-2); font-size:12.5px; padding:24px 0;}
.help-table-wrap{background:var(--bg-elev-2); border:1px solid var(--line); border-radius:12px; overflow-x:auto;}
.help-cmd-table{width:100%; border-collapse:collapse; font-size:12px;}
.help-cmd-table th{
  text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px;
  color:var(--muted); background:var(--bg-elev); padding:9px 12px; border-bottom:1px solid var(--line);
}
.help-cmd-table td{padding:9px 12px; border-bottom:1px solid var(--line); color:var(--text); vertical-align:top; line-height:1.5;}
.help-cmd-table tr:last-child td{border-bottom:none;}
.help-cmd-table td.help-cmd-acao{font-weight:700; white-space:nowrap;}
.help-cmd-table td.help-cmd-lista{color:var(--muted);}
.help-cmd-table td.help-cmd-lista code{
  display:inline-block; background:var(--bg-elev); border:1px solid var(--line); border-radius:6px;
  padding:2px 6px; margin:2px 3px 2px 0; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text);
}
.changelog-entry{border-bottom:1px solid var(--line); padding:12px 2px;}
.changelog-entry:last-child{border-bottom:none;}
.changelog-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px;}
.changelog-ver{font-family:'Teko',sans-serif; font-size:20px; font-weight:600; color:var(--teamA);}
.changelog-date{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted-2);}
.changelog-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px;}
.changelog-list li{font-size:13px; color:var(--muted); padding-left:14px; position:relative;}
.changelog-list li::before{content:"–"; position:absolute; left:0; color:var(--muted-2);}
.changelog-current-tag{font-size:9px; text-transform:uppercase; letter-spacing:0.4px; font-weight:700; color:var(--good); background:var(--good-dim); padding:2px 6px; border-radius:5px;}

.archive-item{border-bottom:1px solid var(--line); padding:14px 2px;}
.archive-item:last-child{border-bottom:none;}
.archive-item-head{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:6px;}
.archive-matchup{font-family:'Teko',sans-serif; font-size:19px; font-weight:600;}
.archive-vs{color:var(--muted-2); font-size:14px; margin:0 4px;}
.archive-date{font-size:10.5px; color:var(--muted-2); font-family:'JetBrains Mono',monospace; white-space:nowrap; padding-top:3px;}
.archive-sets-score{font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; color:var(--text); margin-bottom:6px;}
.archive-sets-label{font-size:10px; color:var(--muted-2); text-transform:uppercase; font-weight:600; font-family:'Inter',sans-serif;}
.archive-sets-list{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
.set-pill-mini{font-family:'JetBrains Mono',monospace; font-size:11px; background:var(--bg-elev-2); border:1px solid var(--line); border-radius:7px; padding:3px 8px; color:var(--muted);}
.archive-stats-toggle{font-size:11.5px; font-weight:700; color:var(--teamA); cursor:pointer; display:inline-block;}
.archive-stats-block{margin-top:10px; display:none;}
.archive-stats-block.show{display:block;}
.icon-btn{
  background:var(--bg-elev-2); border:1px solid var(--line); color:var(--muted);
  width:36px;height:36px;border-radius:10px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:16px; position:relative;
}
.icon-btn:active{transform:scale(0.94);}
.icon-btn.listening{
  background:var(--bad-dim); border-color:rgba(229,86,106,0.5); color:var(--bad);
  animation: micPulse 1.2s ease-in-out infinite;
}
@keyframes micPulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(229,86,106,0.45); }
  50%{ box-shadow:0 0 0 6px rgba(229,86,106,0); }
}
.unsaved-dot{
  position:absolute; top:-3px; right:-3px; width:11px; height:11px; border-radius:50%;
  background:var(--bad); border:2px solid var(--bg); display:none;
}
.unsaved-dot.show{display:block;}

/* ===== Layout ===== */
.app{flex:1; display:flex; flex-direction:column; max-width:720px; margin:0 auto; width:100%; padding-bottom:16px;}
.hidden{display:none !important;}

/* ===== Setup screen ===== */
.setup-wrap{padding:20px 16px 40px;}
.setup-hero{text-align:center; margin-bottom:24px;}
.setup-hero h1{font-family:'Teko',sans-serif; font-size:52px; line-height:0.95; margin:0; font-weight:700; letter-spacing:0.5px;}
.setup-hero p{color:var(--muted); margin:6px 0 0; font-size:14px;}
.card{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
.card h2{font-family:'Teko',sans-serif; font-size:24px; font-weight:600; margin:0 0 12px; letter-spacing:0.3px; color:var(--muted);}
.team-setup{display:flex; gap:12px; margin-bottom:14px;}
.team-setup .card{flex:1; margin-bottom:0;}
.team-setup.stacked{flex-direction:column;}
input[type=text], input[type=password], select{
  width:100%; background:var(--bg-elev-2); border:1px solid var(--line); color:var(--text);
  padding:10px 12px; border-radius:10px; font-size:15px; font-family:'Inter',sans-serif; outline:none;
}
input[type=text]:focus, input[type=password]:focus, select:focus{border-color:var(--muted-2);}
.team-name-input{font-family:'Teko',sans-serif; font-size:22px; font-weight:600; padding:8px 12px;}
.color-dot{width:10px;height:10px;border-radius:50%;display:inline-block; margin-right:6px;}
label.field-label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted-2); margin:10px 0 5px; font-weight:600;}

.player-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.player-row input[type=text]{flex:1;}
.player-row select{width:88px; flex-shrink:0;}
.player-row .rm-btn{
  width:34px;height:34px;flex-shrink:0; border-radius:9px; border:1px solid var(--line); background:var(--bg-elev-2);
  color:var(--bad); font-size:16px; cursor:pointer;
}
.start-serve-radio{
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--bg-elev-2); cursor:pointer;
}
.start-serve-radio input{width:16px; height:16px; accent-color:var(--good); cursor:pointer; margin:0;}
.add-player-btn{
  width:100%; padding:10px; border-radius:10px; border:1px dashed var(--line); background:transparent;
  color:var(--muted); font-size:14px; cursor:pointer; margin-top:2px; font-weight:600;
}
.add-player-btn:active{background:var(--bg-elev-2);}

.team-card{position:relative; padding:10px;}
#teamsContainer{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;}
.team-card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; gap:4px;}
.team-card-head h2{font-size:16px; margin:0;}
.libero-ce-toggle{
  display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--muted);
  margin:0 0 8px; cursor:pointer; line-height:1.3;
}
.libero-ce-toggle input{width:14px; height:14px; flex-shrink:0; accent-color:var(--teamA); cursor:pointer;}
.match-config-card .libero-ce-toggle{font-size:13px; margin-bottom:4px;}
.match-config-card select{margin-bottom:2px;}
.team-card .field-label{font-size:9px; margin:6px 0 4px;}
.team-card .team-size-select{padding:7px 8px; font-size:12px; border-radius:8px;}
.roster-hint{font-size:9.5px; color:var(--muted-2); margin:0 0 6px; line-height:1.35;}
.team-card .player-row{gap:4px; margin-bottom:5px;}
.team-card .player-row input[type=text]{padding:6px 6px; font-size:11px; border-radius:7px;}
.team-card .player-row select{width:38px; flex-shrink:0; padding:6px 1px; font-size:9.5px; border-radius:7px;}
.team-card .player-row .rm-btn{width:22px; height:22px; font-size:12px; border-radius:6px; flex-shrink:0;}
.team-card .player-row .start-serve-radio{width:22px; height:22px; border-radius:6px; flex-shrink:0;}
.team-card .player-row .start-serve-radio input{width:13px; height:13px;}
.team-card .add-player-btn{padding:6px; font-size:11px;}
.rm-team-btn{
  background:transparent; border:1px solid var(--line); color:var(--bad); font-size:9.5px; font-weight:700;
  padding:4px 6px; border-radius:7px; cursor:pointer; white-space:nowrap; flex-shrink:0;
}
.rm-team-btn:active{background:var(--bad-dim);}
.add-team-btn{
  width:100%; padding:12px; border-radius:12px; border:1px dashed var(--muted-2); background:transparent;
  color:var(--text); font-size:14px; cursor:pointer; margin-bottom:14px; font-weight:700;
}
.add-team-btn:active{background:var(--bg-elev-2);}
.infinite-note{
  background:var(--good-dim); border:1px solid rgba(55,201,138,0.3); border-radius:10px;
  padding:10px 12px; font-size:12.5px; color:var(--muted); margin-bottom:14px; line-height:1.5;
}
.infinite-note strong{color:var(--good);}
.opt-row{display:flex; gap:8px;}
.opt-btn{
  flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg-elev-2);
  color:var(--muted); font-weight:700; cursor:pointer; font-family:'Teko',sans-serif; font-size:18px;
}
.opt-btn.active{background:var(--bg-elev-2); border-color:currentColor;}
.opt-btn.active.a{color:var(--teamA); box-shadow:0 0 0 1px var(--teamA) inset;}
.opt-btn.active.b{color:var(--teamB); box-shadow:0 0 0 1px var(--teamB) inset;}

.start-btn{
  width:100%; padding:16px; border-radius:14px; border:none; margin-top:6px;
  background:linear-gradient(180deg, #37c98a, #279c6b); color:#06231a; font-weight:800; font-size:17px;
  cursor:pointer; box-shadow:var(--shadow);
}
.start-btn:active{transform:scale(0.99);}
.start-btn.secondary{background:var(--bg-elev-2); border:1px solid var(--line); color:var(--text); box-shadow:none;}
.start-btn.danger{background:var(--bad-dim); border:1px solid rgba(229,86,106,0.4); color:var(--bad); box-shadow:none;}
.err-msg{color:var(--bad); font-size:13px; margin-top:8px; text-align:center;}

/* ===== Scoreboard ===== */
.scoreboard{
  display:flex; align-items:stretch; gap:0; margin:14px 12px 6px; border-radius:16px; overflow:hidden;
  border:1px solid var(--line); box-shadow:var(--shadow);
}
.score-side{flex:1; padding:21px 15px 18px; text-align:center; position:relative;}
.score-side.a{background:linear-gradient(180deg, var(--teamA-dim), var(--bg-elev));}
.score-side.b{background:linear-gradient(180deg, var(--teamB-dim), var(--bg-elev));}
.score-name{font-size:18px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.score-side.a .score-name{color:var(--teamA);}
.score-side.b .score-name{color:var(--teamB);}
.score-num{font-family:'Teko',sans-serif; font-size:114px; line-height:0.9; font-weight:700; margin:2px 0 0;}

.team-switch-btn{
  position:absolute; top:10px; right:10px; width:24px; height:24px; border-radius:50%;
  background:var(--bg-elev-2); border:1px solid var(--line); color:var(--muted);
  display:flex; align-items:center; justify-content:center; font-size:13px; cursor:pointer; z-index:2;
}
.score-side.b .team-switch-btn{ right:auto; left:10px; }
.team-switch-btn:active{ transform:scale(0.9); }
.team-switch-btn.hidden{ display:none; }
.team-switch-option{
  padding:12px 14px; border-radius:11px; background:var(--bg-elev-2); border:1px solid var(--line);
  margin-bottom:8px; font-size:14.5px; font-weight:600; cursor:pointer;
}
.team-switch-option:active{ transform:scale(0.98); }
.team-switch-option.active{ border-color:var(--good); color:var(--good); background:var(--good-dim); cursor:default; }
.team-switch-option-tag{ font-size:11px; font-weight:600; color:var(--muted-2); margin-left:6px; }
.serve-dot{
  display:inline-block; font-size:15px; line-height:1; margin-left:6px; margin-bottom:2px;
  animation: serveSpin 1.1s linear infinite;
}
@keyframes serveSpin{
  from{ transform:rotate(0deg); }
  to{ transform:rotate(360deg); }
}
.score-mid{
  width:111px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--bg-elev-2); border-left:1px solid var(--line); border-right:1px solid var(--line); padding:12px 6px;
}
.set-label{font-size:15px; color:var(--muted-2); text-transform:uppercase; letter-spacing:0.5px; font-weight:700;}
.set-num{font-family:'Teko',sans-serif; font-size:45px; font-weight:700; line-height:1;}
.sets-score{font-family:'JetBrains Mono',monospace; font-size:20px; color:var(--muted); margin-top:4px;}
.action-alert{
  margin-top:6px; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.3px;
  padding:3px 6px; border-radius:6px; text-align:center; white-space:nowrap;
}
.action-alert.serve{background:rgba(244,199,68,0.18); color:#f4c744;}
.action-alert.point{background:var(--good-dim); color:var(--good);}
.action-alert.wrong{background:var(--bad-dim); color:var(--bad);}

.first-serve-config{
  display:flex; align-items:center; gap:8px; margin:8px 12px 0; padding:8px 10px;
  background:var(--bg-elev); border:1px solid var(--line); border-radius:11px; flex-wrap:wrap;
}
.first-serve-label{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.3px; flex-shrink:0;}
.first-serve-option{
  display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; color:var(--muted);
  cursor:pointer; padding:4px 9px; border-radius:8px; border:1px solid var(--line); background:var(--bg-elev-2);
}
.first-serve-option input{width:14px; height:14px; accent-color:var(--good); cursor:pointer; margin:0;}
.first-serve-option.checked{border-color:rgba(55,201,138,0.4); color:var(--good); background:var(--good-dim);}

/* ===== Tabs ===== */
.tabs{display:flex; margin:14px 12px 0; background:var(--bg-elev); border:1px solid var(--line); border-radius:12px; padding:3px;}
.tab-btn{flex:1; text-align:center; padding:9px 4px; border-radius:9px; font-size:13px; font-weight:700; color:var(--muted); cursor:pointer; border:none; background:transparent; font-family:'Inter',sans-serif;}
.tab-btn.active{background:var(--bg-elev-2); color:var(--text);}

/* ===== Court view: players ===== */
.court-view{padding:14px 12px 0; display:flex; gap:10px;}
#tabCourt.hidden{display:flex !important;} /* quadra fica sempre visível; estatísticas/histórico aparecem abaixo dela */
.team-col{flex:1; display:flex; flex-direction:column; gap:8px;}
.team-col-header{display:flex; align-items:center; justify-content:space-between; padding:0 2px 2px;}
.team-col-header .tname{font-family:'Teko',sans-serif; font-size:19px; font-weight:600; letter-spacing:0.3px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.team-col.a .tname{color:var(--teamA);}
.team-col.b .tname{color:var(--teamB);}
.quick-pt{
  font-size:10px; font-weight:700; color:var(--muted); background:var(--bg-elev-2); border:1px solid var(--line);
  border-radius:7px; padding:4px 7px; cursor:pointer; flex-shrink:0;
}
.player-card{
  display:flex; flex-direction:column; gap:8px; position:relative;
  background:var(--bg-elev); border:1px solid var(--line); border-radius:12px; padding:9px 10px;
}
.player-info{display:flex; align-items:center; gap:7px; min-width:0;}
.pos-badge{
  font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; width:26px; height:20px; flex-shrink:0;
  border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--bg);
}
.team-col.a .pos-badge{background:var(--teamA);}
.team-col.b .pos-badge{background:var(--teamB);}
.player-name{flex:1; min-width:0; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
/* Edição de posição e nome direto na aba de marcação — mesmo molde, mesmas
   regras da caixa de posição e do campo de nome da aba Times (ver
   renderRosterFor / .ppos-select / .pname-input). Reaproveita as classes
   .pos-badge e .player-name (tamanho, cor por time, modo paisagem) e só
   ajusta o necessário para virarem um <select> e um <input> editáveis. */
.player-info select.pos-badge{
  cursor:pointer; border:none; -webkit-appearance:none; appearance:none;
  text-align:center; text-align-last:center; padding:0 2px;
}
.player-info input.player-name{
  border:1px solid var(--line); background:var(--bg-elev-2); border-radius:6px;
  padding:2px 6px; height:22px;
}
.player-info input.player-name:focus{border-color:var(--muted-2);}
.player-pts{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted-2); flex-shrink:0; display:flex; align-items:center; gap:4px;}
.player-total-pts{opacity:0.7; padding-left:4px; border-left:1px solid var(--line);}
.player-serves{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted-2); flex-shrink:0;}
.serve-player-icon{margin-right:2px;}

.player-card.is-serving{border-color:rgba(244,199,68,0.55); box-shadow:0 0 0 1px rgba(244,199,68,0.35) inset;}
.player-card.is-last-scorer{border-color:rgba(255,255,255,0.55); box-shadow:0 0 0 1px rgba(255,255,255,0.35) inset;}
.player-card.is-serving.is-last-scorer{
  border-color:rgba(244,199,68,0.55);
  box-shadow:0 0 0 1px rgba(244,199,68,0.35) inset, 0 0 0 3px rgba(255,255,255,0.35) inset;
}
.serving-tag{
  font-size:9.5px; font-weight:800; color:#0c0904; background:#f4c744;
  padding:2px 6px; border-radius:6px; white-space:nowrap; flex-shrink:0; letter-spacing:0.2px;
}

.mini-action-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:9px;}
.mini-action{
  padding:20px 8px; min-height:58px; border-radius:10px; border:1px solid var(--line); background:var(--bg-elev-2);
  color:var(--text); font-size:14px; font-weight:700; cursor:pointer; text-align:center; font-family:'Inter',sans-serif;
}

/* Bolinha de "sacando" (🏐 amarela, sigla SQ) e bolinha de "último ponto"
   (🏐 branca, sigla PT) no cantinho do card — não fazem mais parte do grid
   de botões. Time à esquerda: canto inferior direito (perto de onde fica o
   botão Infração / fim do card). Time à direita: canto superior esquerdo
   (perto do botão Ataque / início do card). Ver playerCard(). */
.card-corner-markers{
  position:absolute; display:flex; align-items:flex-end; gap:6px;
  pointer-events:none; z-index:2;
}
.card-corner-markers.corner-end{ right:6px; top:50%; transform:translateY(-50%); }
.card-corner-markers.corner-start{ left:6px; top:50%; transform:translateY(-50%); }
.corner-marker-item{display:flex; flex-direction:column; align-items:center; gap:1px;}
.corner-marker-label{
  font-size:9px; font-weight:800; letter-spacing:0.3px; color:var(--text);
  text-shadow:0 1px 2px rgba(0,0,0,0.6);
}
.corner-marker-icon{
  font-size:28px; line-height:1;
  filter: drop-shadow(0 1px 3px rgba(0,0,0,0.55));
}
/* bolinha de "sacando": mesma figurinha de vôlei, tingida de branco */
.corner-marker-icon.serve-ball{
  filter: grayscale(1) brightness(1.6) drop-shadow(0 1px 3px rgba(0,0,0,0.55));
}
/* bolinha de "último ponto certo": tingida de azul (tom mais escuro) */
.corner-marker-icon.point-ball{
  filter: sepia(1) saturate(7) hue-rotate(180deg) brightness(0.65) drop-shadow(0 1px 3px rgba(0,0,0,0.55));
}
/* bolinha de "último erro": tingida de vermelho (tom mais escuro) */
.corner-marker-icon.error-ball{
  filter: sepia(1) saturate(9) hue-rotate(-50deg) brightness(0.6) drop-shadow(0 1px 3px rgba(0,0,0,0.55));
}

/* Modo de expansão: ativado pela régua de altura, faz os quadrinhos dos
   jogadores crescerem para preencher a altura escolhida (mesmo que ultrapasse
   a tela visível — a página rola normalmente para mostrar o restante). */
body.court-expand-mode #playersA,
body.court-expand-mode #playersB{
  display:flex; flex-direction:column; min-height:0;
}
body.court-expand-mode .player-card{
  flex:1; min-height:0; display:flex; flex-direction:column;
}
body.court-expand-mode .player-info{flex-shrink:0;}
body.court-expand-mode .mini-action-grid{
  flex:1; min-height:0; grid-auto-rows:1fr;
}
body.court-expand-mode .mini-action{
  display:flex; align-items:center; justify-content:center;
}
.mini-action.good{border-color:rgba(55,201,138,0.35); background:var(--good-dim); color:var(--good);}
.mini-action.bad{border-color:rgba(229,86,106,0.35); background:var(--bad-dim); color:var(--bad);}
.mini-action.neutral{color:var(--muted);}
.mini-action.yellow{border-color:rgba(244,199,68,0.5); background:rgba(244,199,68,0.16); color:#f4c744;}
.mini-action:active{transform:scale(0.94);}

/* ===== Stats tab ===== */
.stats-view{padding:14px 12px 0;}
.export-btn{
  width:100%; padding:11px; border-radius:12px; border:1px solid rgba(47,184,198,0.4);
  background:var(--teamA-dim); color:var(--teamA); font-weight:700; font-size:13px;
  cursor:pointer; margin-bottom:14px;
}
.export-btn:active{transform:scale(0.98);}
.delete-data-btn{
  width:100%; padding:11px; border-radius:12px; border:1px solid rgba(229,86,106,0.5);
  background:var(--bad-dim); color:var(--bad); font-weight:700; font-size:13px;
  cursor:pointer; margin-bottom:14px;
}
.delete-data-btn:active{transform:scale(0.98);}
.stats-team-block{margin-bottom:16px;}
.stats-team-title{font-family:'Teko',sans-serif; font-size:20px; font-weight:600; margin:0 0 8px 2px;}
.team-col.a .stats-team-title, .stats-team-title.a{color:var(--teamA);}
.team-col.b .stats-team-title, .stats-team-title.b{color:var(--teamB);}
table.stats-table{width:100%; border-collapse:collapse; font-size:11.5px; background:var(--bg-elev); border-radius:12px; overflow:hidden; border:1px solid var(--line);}
table.stats-table th, table.stats-table td{padding:7px 5px; text-align:center; border-bottom:1px solid var(--line); font-family:'JetBrains Mono',monospace;}
table.stats-table th{color:var(--muted-2); font-weight:600; font-size:9.5px; text-transform:uppercase; letter-spacing:0.3px;}
table.stats-table td:first-child, table.stats-table th:first-child{text-align:left; font-family:'Inter',sans-serif; font-weight:600; padding-left:10px; color:var(--text); font-size:12px;}
table.stats-table tr:last-child td{border-bottom:none;}
.tot-row td{font-weight:700; color:var(--text); background:rgba(255,255,255,0.02);}

/* ===== History tab ===== */
.history-view{padding:14px 12px 0;}
.hist-item{display:flex; align-items:center; gap:10px; padding:9px 12px; background:var(--bg-elev); border:1px solid var(--line); border-radius:10px; margin-bottom:6px; font-size:13px;}
.hist-dot{width:8px;height:8px;border-radius:50%; flex-shrink:0;}
.hist-dot.a{background:var(--teamA);} .hist-dot.b{background:var(--teamB);}
.hist-text{flex:1; color:var(--muted);}
.hist-text b{color:var(--text); font-weight:600;}
.hist-set{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--muted-2);}
.empty-note{text-align:center; color:var(--muted-2); font-size:13px; padding:30px 10px;}
.sets-summary{margin-bottom:14px;}
.sets-summary-title{font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted-2); font-weight:700; margin:0 2px 8px;}
.sets-summary-list{display:flex; flex-wrap:wrap; gap:8px;}
.set-pill{
  display:flex; flex-direction:column; align-items:center; gap:2px;
  background:var(--bg-elev); border:1px solid var(--line); border-radius:10px; padding:7px 12px;
}
.set-pill-num{font-size:9.5px; color:var(--muted-2); text-transform:uppercase; letter-spacing:0.4px; font-weight:700;}
.set-pill-score{font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700; color:var(--text);}
.set-pill-score.a{color:var(--teamA);}
.set-pill-score.b{color:var(--teamB);}

/* ===== Bottom action bar ===== */
.bottombar-wrap{
  display:flex; flex-direction:column; gap:8px; width:100%;
  margin:64px auto 24px; max-width:720px;
  background:rgba(20,27,38,0.9); border:1px solid var(--line); border-radius:14px;
  padding:12px 12px calc(12px + env(safe-area-inset-bottom));
}
.bottombar{display:flex; gap:8px; width:100%;}
.bar-btn{
  flex:1; padding:11px 4px; border-radius:12px; border:1px solid var(--line); background:var(--bg-elev-2);
  color:var(--text); font-weight:700; font-size:12.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:4px; text-align:center;
}
.bar-btn.undo{background:var(--bad-dim); border-color:rgba(229,86,106,0.45); color:var(--bad);}
.bar-btn.redo{background:rgba(244,199,68,0.16); border-color:rgba(244,199,68,0.5); color:#f4c744;}
.bar-btn.primary{background:var(--good-dim); border-color:rgba(55,201,138,0.4); color:var(--good);}
select.bar-btn{-webkit-appearance:none; appearance:none; text-align:center; text-align-last:center; cursor:pointer;}
.bar-btn:active{transform:scale(0.97);}
.bar-btn:disabled{opacity:0.35;}

/* ===== Sheet (bottom modal) ===== */
.sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:40; display:flex; align-items:flex-end; justify-content:center;}
.sheet{
  width:100%; max-width:720px; background:var(--bg-elev); border-radius:20px 20px 0 0; border:1px solid var(--line); border-bottom:none;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-height:82vh; overflow-y:auto;
  animation:sheetUp .18s ease-out;
}
@keyframes sheetUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:36px;height:4px;background:var(--line); border-radius:2px; margin:0 auto 12px;}
.sheet-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.sheet-header .who{font-family:'Teko',sans-serif; font-size:26px; font-weight:600;}
.sheet-header .close-x{color:var(--muted); font-size:22px; cursor:pointer; padding:4px;}

/* ===== Set/Match end overlay ===== */
.celebrate{position:fixed; inset:0; z-index:50; background:rgba(6,9,14,0.88); display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:24px;}
.celebrate h2{font-family:'Teko',sans-serif; font-size:44px; margin:0 0 6px;}
.celebrate p{color:var(--muted); margin:0 0 22px; font-size:14px;}
.celebrate .cel-btn{padding:13px 28px; border-radius:12px; border:none; background:var(--teamA); color:#04252a; font-weight:800; cursor:pointer;}

.toast{position:fixed; top:64px; left:50%; transform:translateX(-50%); background:var(--bg-elev-2); border:1px solid var(--line); padding:9px 16px; border-radius:10px; font-size:13px; z-index:60; color:var(--text); box-shadow:var(--shadow);}
.toast-error{background:var(--bad-dim); border-color:rgba(229,86,106,0.5); color:var(--bad); font-weight:700;}

.error-banner{
  background:var(--bad-dim); color:var(--bad); border-bottom:2px solid var(--bad);
  font-size:13px; font-weight:800; text-align:center; padding:9px 12px; letter-spacing:0.2px;
}

@media (max-width:360px){
  .score-num{font-size:90px;}
}

/* ===== Modo paisagem: tela mais larga, 6 jogadores sem rolagem, abas abaixo da quadra ===== */
@media (orientation: landscape){
  .app{max-width:100%; padding-bottom:12px;}
  #playersA, #playersB{display:flex; flex-direction:column; gap:6px;}

  .topbar{padding:4px 10px;}
  .brand{display:none;}
  .icon-btn{width:26px; height:26px; font-size:12px;}
  .version-badge{padding:2px 6px;}
  .version-badge #versionTag{font-size:9px;}
  .version-badge .version-date{font-size:8px;}

  .scoreboard{margin:5px 10px 6px;}
  .score-side{padding:8px 8px 6px;}
  .score-num{font-size:78px;}
  .score-name{font-size:18px;}
  .score-mid{width:96px; padding:5px 2px;}
  .set-num{font-size:39px;}
  .sets-score{font-size:18px; margin-top:2px;}
  .set-label{font-size:13px;}

  #matchScreen{display:flex; flex-direction:column;}
  .scoreboard{order:0;}
  #tabCourt{order:1;}
  .tabs{order:6;}
  #tabStats{order:7;}
  #tabHistory{order:7;}

  .court-view{padding:4px 10px 0; gap:12px; flex:1;}
  .team-col{gap:6px;}
  .team-col-header{padding:0 1px 0;}
  .tname{font-size:16px;}
  .quick-pt{font-size:10px; padding:4px 7px;}

  .player-card{flex-direction:row; align-items:center; gap:5px; padding:8px 8px; border-radius:11px;}
  .player-info{flex-shrink:0; width:auto; max-width:38%;}
  .serving-tag{font-size:8px; padding:1px 4px;}
  .pos-badge{width:22px; height:19px; font-size:9.5px; border-radius:6px;}
  select.pos-badge{width:30px;}
  .player-name{font-size:18px; max-width:150px;}
  input.player-name{height:26px;}
  .player-pts{font-size:10.5px;}
  .player-serves{font-size:10.5px;}
  .mini-action-grid{grid-template-columns:repeat(9,1fr); gap:1px; flex:1;}
  .mini-action{padding:8px 10px; min-height:34px; font-size:12px; border-radius:8px;}
  .corner-marker-icon{font-size:20px;}
  .corner-marker-label{font-size:7px;}

  .bottombar-wrap{order:5; padding:6px 10px calc(6px + env(safe-area-inset-bottom)); margin:32px auto 16px;}
  .bar-btn{padding:9px 4px; font-size:11.5px;}
  .first-serve-config{order:5;}
}
</style>
</head>
<body>
<div class="court-bg"></div>

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand"><span class="ball"></span> Marcação Vôlei</div>
  <div class="topbar-actions">
    <div class="icon-btn" id="btnSaveCloud" title="Salvar na nuvem (opcional)">☁<span class="unsaved-dot" id="unsavedDot"></span></div>
    <div class="icon-btn" id="btnArchive" title="Sets encerrados">📋</div>
    <div class="icon-btn" id="btnHelp" title="Ajuda: regras e comandos de voz">❓</div>
    <div class="icon-btn" id="btnSpeech" title="Narração por voz: ligada">🔊</div>
    <div class="icon-btn" id="btnVoiceCmd" title="Marcar pontos por comando de voz">🎤</div>
    <div class="icon-btn" id="btnWidthAdjust" title="Ajustar largura e altura da tela">↕↔</div>
    <div class="version-badge" id="btnVersion" title="Ver histórico de versões">
      <span id="versionTag">v1.0</span><span class="version-date" id="versionDate"></span>
    </div>
  </div>
</div>

<div class="width-panel hidden" id="widthPanel">
  <div class="dim-row">
    <span class="width-panel-label">Largura</span>
    <input type="range" id="widthSlider" min="360" max="1400" step="20" value="720">
    <span class="width-panel-value" id="widthValue">720px</span>
  </div>
  <div class="dim-row">
    <span class="width-panel-label">Altura</span>
    <input type="range" id="heightSlider" min="300" max="1400" step="20" value="700">
    <span class="width-panel-value" id="heightValue">Auto</span>
  </div>
  <div class="dim-actions">
    <button class="width-panel-reset" id="widthSavePrefs" title="Salvar como preferência">💾 Salvar preferências</button>
    <button class="width-panel-reset" id="widthReset" title="Voltar ao automático">↺ Redefinir automático</button>
  </div>
</div>

<div class="error-banner hidden" id="errorBanner"></div>

<div class="app">

  <!-- ===================== SETUP SCREEN ===================== -->
  <div id="setupScreen" class="setup-wrap hidden">
    <div class="setup-hero">
      <h1>Times</h1>
      <p>Cadastre os times, o elenco e comece a marcar.</p>
    </div>

    <div id="teamsContainer"></div>
    <button class="add-team-btn" id="btnAddTeam">+ adicionar time</button>

    <div class="card match-config-card">
      <h2>Configurações da partida</h2>
      <label class="libero-ce-toggle">
        <input type="checkbox" id="liberoCeCheckbox">
        Líbero saca no lugar do Central (CE não saca)
      </label>
    </div>

    <button class="start-btn secondary hidden" id="btnBackToMatch">Voltar para a partida</button>
    <button class="start-btn" id="btnStart">Iniciar Partida</button>
    <button class="export-btn" id="btnExportXls">📤 Exportar dados (XLS)</button>
    <button class="delete-data-btn" id="btnDeleteAllData">🗑️ Apagar dados</button>
    <div class="err-msg hidden" id="setupErr"></div>
  </div>

  <!-- ===================== MATCH SCREEN ===================== -->
  <div id="matchScreen" class="hidden">

    <div class="scoreboard">
      <div class="score-side a">
        <span class="team-switch-btn hidden" id="btnSwitchTeamA" data-team="A" title="Trocar time">⇄</span>
        <div class="score-name" id="mNameA">TIME 1</div>
        <div class="score-num" id="mScoreA">0<span class="serve-dot hidden" id="serveDotA">🏐</span></div>
      </div>
      <div class="score-mid">
        <div class="set-label">Set</div>
        <div class="set-num" id="mSetNum">1</div>
        <div class="action-alert" id="actionAlert"></div>
      </div>
      <div class="score-side b">
        <span class="team-switch-btn hidden" id="btnSwitchTeamB" data-team="B" title="Trocar time">⇄</span>
        <div class="score-name" id="mNameB">TIME 2</div>
        <div class="score-num" id="mScoreB"><span class="serve-dot hidden" id="serveDotB">🏐</span>0</div>
      </div>
    </div>

    <!-- COURT / players — sempre visível, logo abaixo do placar -->
    <div id="tabCourt" class="court-view">
      <div class="team-col a">
        <div class="team-col-header"><span class="tname" id="colNameA">Time 1</span><span class="quick-pt" data-team="A">+1 direto</span></div>
        <div id="playersA"></div>
      </div>
      <div class="team-col b">
        <div class="team-col-header"><span class="tname" id="colNameB">Time 2</span><span class="quick-pt" data-team="B">+1 direto</span></div>
        <div id="playersB"></div>
      </div>

/* Coleção onde ficam salvos os dados do app (uma coleção só, um doc por chave).
   Isso substitui o antigo window.storage: os dados passam a ficar no Firestore
   e são os mesmos para qualquer pessoa/dispositivo que abrir este app com a
   mesma configuração do Firebase (ou seja, os dados são "compartilhados"). */
const FB_COLLECTION = 'volei_app_data';

const cloudStorage = {
  async set(key, value){
    try{
      await db.collection(FB_COLLECTION).doc(key).set({ value, updatedAt: Date.now() });
      return { key, value, shared: true };
    }catch(e){
      console.error('Firebase set() falhou:', e);
      return null;
    }
  },
  async get(key){
    const snap = await db.collection(FB_COLLECTION).doc(key).get();
    if(!snap.exists) return null;
    const data = snap.data();
    return { key, value: data.value, shared: true };
  },
  async delete(key){
    try{
      await db.collection(FB_COLLECTION).doc(key).delete();
      return true;
    }catch(e){
      console.error('Firebase delete() falhou:', e);
      return false;
    }
  }
};

  { version:"3.40.5", date:"25/07/2026", changes:[

let state = null;      // full match state
let undoStack = [];    // snapshots for undo
let redoStack = [];    // snapshots for redo (desfeitos pelo botão Desfazer)
let activeTab = "court";

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

function uid(){ return Math.random().toString(36).slice(2,9); }
function emptyStats(){ const o={}; ALL_STAT_KEYS.forEach(k=>o[k]=0); return o; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

function newPlayer(name, pos){
  return {id:uid(), name:name||"", pos:pos||"P1", stats: emptyStats()};
}
function newTeam(name){
  const players = [newPlayer("","LE"), newPlayer("","P1"), newPlayer("","CE"), newPlayer("","OP"), newPlayer("","P2"), newPlayer("","LI")];
  return {
    id:uid(),
    name:name||"",
    startServerPlayerId: players[0].id, // por padrão, quem inicia o saque é o jogador na posição de Levantador (LE)
    playerCount: 6, // Jogadores por time (1 a 6) — cada time pode ter uma quantidade diferente
    players
  };
}
function teamBy(id){ return state.teams.find(t=>t.id===id); }
function findPlayerAnywhereById(id){
  for(const t of state.teams){
    const p = t.players.find(pl=>pl.id===id);
    if(p) return p;
  }
  return null;
}
function slotTeam(slot){ return teamBy(slot==='A' ? state.activeAId : state.activeBId); }
function teamDisplayName(team){
  if(!team) return '';
  const idx = state.teams.findIndex(t=>t.id===team.id);
  return 'Time ' + (idx+1);
}

/* ---------------- rodízio automático de saque -----------------
   Sequência de posições usada no rodízio: as N primeiras de POSITIONS
   (LE, P1, CE, OP, P2, LI), onde N vem de "Jogadores por time"
   (elenco de cada time, 1 a 6) — cada time pode ter uma quantidade
   diferente do outro. Cada time tem seu próprio ponteiro de rodízio,
   independente do adversário: toda vez que o time reconquista o saque
   (side-out a favor dele), avança uma posição — ex: depois que o
   Levantador (LE) sacou, a próxima vez que o MESMO time sacar será
   com o P1.

   Cada time pode ter uma posição de rodízio inicial diferente: no card de
   cada jogador (elenco), a caixa "inicia o saque" marca qual jogador
   daquele time começa sacando (guardado em team.startServerPlayerId).
   Por padrão, vem marcado o jogador na posição de Levantador (LE). */
function activePositions(teamObj){
  const n = Math.min(Math.max((teamObj && teamObj.playerCount) || 6, 1), 6);
  return POSITIONS.slice(0, n);
}
function positionForRotationSlot(idx, teamObj){
  const positions = activePositions(teamObj);
  let pos = positions[idx % positions.length];
  if(pos==='CE' && state.liberoServesForCE && positions.includes('LI')){
    pos = 'LI'; // CE não saca — o Líbero saca no lugar dele (LI saca 2x no rodízio)
  }
  return pos;
}
/* Encontra o jogador que deve sacar num determinado ponto do rodízio.
   Primeiro tenta pela posição fixa esperada (LE, P1, CE...); se ninguém do
   time estiver com essa posição no momento — por exemplo, porque ela foi
   trocada para "AT" (Atacante), que pode ser repetida — a rotação continua
   normalmente pelo jogador que ocupa esse mesmo lugar no elenco do time. */
function playerForRotationSlot(idx, teamObj){
  if(!teamObj) return null;
  const pos = positionForRotationSlot(idx, teamObj);
  let player = teamObj.players.find(p=>p.pos===pos);
  if(!player){
    const positions = activePositions(teamObj);
    player = teamObj.players[idx % positions.length] || null;
  }
  return player;
}
/* Índice do rodízio correspondente a um jogador: pela posição fixa dele
   (LE, P1, CE...), quando ele tiver uma; se não tiver (ex.: "AT"), usa o
   lugar dele no elenco do time — assim a rotação continua funcionando
   normalmente mesmo com posições repetidas ou fora do padrão. */
function rotationIndexForPlayer(teamObj, player){
  if(!teamObj || !player) return -1;
  const positions = activePositions(teamObj);
  let idx = positions.indexOf(player.pos);
  if(idx < 0){
    idx = teamObj.players.indexOf(player);
    if(idx >= positions.length) idx = -1; // fora do alcance do rodízio ativo deste time
  }
  return idx;
}
function teamStartServeIndex(teamObj){
  let player = null;
  if(teamObj && teamObj.startServerPlayerId){
    player = teamObj.players.find(p=>p.id===teamObj.startServerPlayerId);
  }
  if(!player && teamObj){
    player = teamObj.players.find(p=>p.pos==='LE') || teamObj.players[0] || null;
  }
  const idx = rotationIndexForPlayer(teamObj, player);
  return idx>=0 ? idx : 0;
}
function assignServerForRotation(team){
  const startedKey = team==='A' ? 'rotationStartedA' : 'rotationStartedB';
  const idxKey = team==='A' ? 'rotationIndexA' : 'rotationIndexB';
  const teamObj = slotTeam(team);
  const positions = activePositions(teamObj);
  if(state[startedKey]){
    state[idxKey] = (state[idxKey] + 1) % positions.length;
  } else {
    state[startedKey] = true; // primeira vez sacando neste set — começa na posição configurada do time
  }
  const player = playerForRotationSlot(state[idxKey], teamObj);
  if(player) state.servingPlayerId = player.id;
}
function resetRotation(){
  const teamA = slotTeam('A'), teamB = slotTeam('B');
  state.rotationIndexA = teamStartServeIndex(teamA);
  state.rotationIndexB = teamStartServeIndex(teamB);
  state.rotationStartedA = false;
  state.rotationStartedB = false;
}

/* Quem saca primeiro em cada set: como não existe mais o botão manual
   "Saq", o time que começa sacando é escolhido manualmente pelo usuário
   (caixa "Começa sacando" na aba de marcação, guardada em
   state.firstServeTeam) — não alterna mais sozinho a cada set. A posição
   em que cada time começa a sacar já vem definida por resetRotation(), a
   partir do jogador marcado como "inicia o saque" no elenco de cada time. */
function autoAssignFirstServe(){
  const startingTeam = state.firstServeTeam === 'B' ? 'B' : 'A';
  const startedKey = startingTeam==='A' ? 'rotationStartedA' : 'rotationStartedB';
  const idxKey = startingTeam==='A' ? 'rotationIndexA' : 'rotationIndexB';
  state[startedKey] = true;

  const teamObj = slotTeam(startingTeam);
  const player = playerForRotationSlot(state[idxKey], teamObj);

  state.serve = startingTeam;
  state.errorMessage = null;
  state.lastScorerPlayerId = null; // não faz sentido carregar o último ponto do set anterior
  state.lastErrorPlayerId = null; // idem, para o último erro
  if(player){
    state.servingPlayerId = player.id;
    player.stats.saqueCerto += 1;
    logEvent(startingTeam, player, STAT_ONLY.title, startingTeam, STAT_ONLY.key);
    lastAutoServe = { player, entry: state.history[state.history.length-1] };
  } else {
    state.servingPlayerId = null;
    lastAutoServe = null;
  }
  state.serveConfirmed = true;
}

/* Quando o jogador marcado como "inicia o saque" de um time é trocado (no
   elenco, tela Times), e esse time já está em quadra numa partida em
   andamento: se o saque que valeu para o início do rodízio deste time
   neste set ainda for o último saque registrado (ninguém sacou de novo
   depois dele), desfaz esse registro e registra de novo para o jogador
   recém-marcado. Se o time ainda não tiver sacado neste set, só atualiza
   o ponteiro do rodízio (nada para desfazer ainda). */
function reassignTeamStartServer(teamId, oldPlayerId, newPlayer){
  if(!state.started) return; // partida ainda não começou — nada registrado ainda
  const team = teamBy(teamId);
  if(!team) return;

  let slot = null;
  if(teamId === state.activeAId) slot = 'A';
  else if(teamId === state.activeBId) slot = 'B';
  if(!slot) return; // time não está em quadra na partida atual

  const startedKey = slot==='A' ? 'rotationStartedA' : 'rotationStartedB';
  const idxKey = slot==='A' ? 'rotationIndexA' : 'rotationIndexB';

  if(!state[startedKey]){
    // este time ainda não sacou neste set — só atualiza o ponteiro do rodízio
    const newIdx = rotationIndexForPlayer(team, newPlayer);
    state[idxKey] = newIdx>=0 ? newIdx : 0;
    markDirty();
    renderAll();
    return;
  }

  const oldPlayer = findPlayerAnywhereById(oldPlayerId);
  const oldIdx = rotationIndexForPlayer(team, oldPlayer);
  const isStillAtStartingServe = oldIdx>=0 && state[idxKey]===oldIdx;
  const lastServeWasThisPlayer = lastAutoServe && lastAutoServe.player && lastAutoServe.player.id===oldPlayerId;

  if(isStillAtStartingServe && lastServeWasThisPlayer){
    // desfaz o saque automático registrado para o antigo sacador...
    removePendingAutoServe();
    // ...e registra o mesmo saque para o jogador recém-marcado
    const newIdx = rotationIndexForPlayer(team, newPlayer);
    state[idxKey] = newIdx>=0 ? newIdx : 0;
    if(state.servingPlayerId === oldPlayerId) state.servingPlayerId = newPlayer.id;
    newPlayer.stats.saqueCerto += 1;
    logEvent(slot, newPlayer, STAT_ONLY.title, slot, STAT_ONLY.key);
    lastAutoServe = { player:newPlayer, entry: state.history[state.history.length-1] };
  }
  markDirty();
  renderAll();
}

/* "Jogadores por time" (1 a 6, por time): ao reduzir, remove do elenco o
   jogador que ocupava a última posição ativa do rodízio (ex.: de 6 para 5,
   remove quem estava no Líbero); ao aumentar, adiciona de volta um
   jogador em branco na posição que passou a ficar ativa. */
function shrinkTeamRoster(team, oldCount, newCount){
  for(let i = oldCount - 1; i >= newCount; i--){
    if(team.players.length <= 1) break; // nunca remove o último jogador do time inteiro
    const pos = POSITIONS[i];
    const idx = team.players.findIndex(p=>p.pos===pos);
    if(idx === -1) continue;
    const removedId = team.players[idx].id;
    team.players.splice(idx, 1);
    if(team.startServerPlayerId === removedId){
      // o jogador removido era quem iniciava o saque — cai para o novo
      // Levantador do time (ou para o primeiro jogador, se não houver)
      const le = team.players.find(p=>p.pos==='LE');
      team.startServerPlayerId = le ? le.id : (team.players[0] ? team.players[0].id : null);
    }
  }
}
function growTeamRoster(team, oldCount, newCount){
  for(let i = oldCount; i < newCount; i++){
    const pos = POSITIONS[i];
    if(!team.players.some(p=>p.pos===pos)){
      team.players.push(newPlayer("", pos));
    }
  }
}

/* Depois de mudar a quantidade de jogadores de um time: se ele estiver em
   quadra numa partida em andamento, garante que o ponteiro do rodízio
   continue dentro da nova quantidade de posições ativas, e reatribui o
   sacador esperado caso o jogador marcado como sacando tenha sido removido. */
function fixRotationAfterTeamSizeChange(teamId){
  if(!state.started) return;
  let slot = null;
  if(teamId === state.activeAId) slot = 'A';
  else if(teamId === state.activeBId) slot = 'B';
  if(!slot) return;

  const team = teamBy(teamId);
  if(!team) return;
  const idxKey = slot==='A' ? 'rotationIndexA' : 'rotationIndexB';
  const positions = activePositions(team);
  state[idxKey] = state[idxKey] % positions.length;

  if(state.servingPlayerId && !team.players.some(p=>p.id===state.servingPlayerId)){
    // o jogador que estava marcado como sacando foi removido — reatribui
    // para quem ocupa a posição atual do rodízio deste time
    const player = playerForRotationSlot(state[idxKey], team);
    if(player) state.servingPlayerId = player.id;
  }
  markDirty();
  renderAll();
}

function defaultState(){
  const t1 = newTeam(""), t2 = newTeam("");
  return {
    started:false,
    teams:[t1, t2],
    activeAId: t1.id,
    activeBId: t2.id,
    liberoServesForCE:true, // Configurações da partida — Líbero saca no lugar do Central (vale para os dois times)
    firstServeTeam:"A",     // Aba de marcação — qual time começa sacando (escolha manual, não alterna sozinho)
    serve: null, // indefinido até o início da partida/set definir quem saca primeiro
    servingPlayerId: null, // jogador marcado como sacando (indicação visual)
    lastScorerPlayerId: null, // jogador que efetuou o último ponto marcado (indicação visual)
    lastErrorPlayerId: null, // jogador que cometeu o último erro marcado (indicação visual)
    serveConfirmed: false, // true depois que o saque desta jogada foi marcado (botão Saq)
    errorMessage: null,    // erro de marcação (saque esquecido/errado) — some só quando corrigido
    rotationIndexA: 0,      // posição atual do rodízio do time A (índice em POSITIONS)
    rotationIndexB: 0,      // posição atual do rodízio do time B
    rotationStartedA: false, // time A já sacou nesse set?
    rotationStartedB: false, // time B já sacou nesse set?
    setNum: 1,
    score: {A:0, B:0},
    setsHistory: [],   // completed sets {a,b}
    setsWonA: 0,
    setsWonB: 0,
    matchOver: false,
    history: []        // event log: {set, team, player, actionKey, label, pt}
  };
}

/* ---------------- persistence ----------------
   Os dados da partida ficam na memória deste dispositivo/aba enquanto você
   usa o app. O salvamento na nuvem acontece automaticamente a cada 30
   minutos (se houver alterações não salvas) ou quando o usuário toca no
   botão ☁ manualmente — não é mais salvo a cada ação/ponto marcado. */
function delay(ms){ return new Promise(res=>setTimeout(res,ms)); }

let hasUnsavedChanges = false;
function markDirty(){
  hasUnsavedChanges = true;
  updateSaveIndicator();
}
function markClean(){
  hasUnsavedChanges = false;
  updateSaveIndicator();
}
function updateSaveIndicator(){
  const dot = $('#unsavedDot'), cloudBtn = $('#btnSaveCloud');
  if(dot) dot.classList.toggle('show', hasUnsavedChanges);
  if(cloudBtn) cloudBtn.title = hasUnsavedChanges ? 'Alterações não salvas — toque para salvar na nuvem' : 'Salvar na nuvem (opcional)';
}

let setArchive = []; // histórico de SETS encerrados (a partida em si é infinita — só os sets se encerram e trocam)
/* setSnapshots: cada set (fechado ou o "ao vivo") tem seu próprio clone
   COMPLETO do state (placar, saque, rodízio, histórico até ali) guardado
   aqui, indexado pelo número do set — é o que permite abrir qualquer set
   já fechado pela caixa de seleção, editar o que for preciso nele, e depois
   voltar pro set em andamento sem perder nada de nenhum dos dois lados.
   liveSetNum é o número do set que está realmente em andamento agora (o
   mais novo, ainda não fechado) — usado para saber quando "Próximo set"
   pode ficar habilitado e para rotular a opção certa na caixa de seleção. */
let setSnapshots = {};
let liveSetNum = 1;
let undoRedoBySet = {}; // cada set (fechado ou em andamento) tem sua própria pilha de desfazer/refazer, guardada aqui por número do set — assim os botões "Desfazer"/"Refazer" continuam funcionando normalmente ao visitar um set encerrado pela caixa de seleção

async function saveState(){
  const payload = JSON.stringify({ match: state, sets: setArchive, setSnapshots: setSnapshots, liveSetNum: liveSetNum });
  for(let attempt=0; attempt<2; attempt++){
    try{
      const result = await cloudStorage.set('volei_match_current', payload);
      if(result){
        showToast('Partida salva na nuvem.');
        markClean();
        return true;
      }
      throw new Error('Resposta vazia do armazenamento');
    }catch(e){
      if(attempt===0) await delay(500);
    }
  }
  showToast('Não foi possível salvar agora.');
  return false;
}
async function loadState(){
  try{
    const r = await cloudStorage.get('volei_match_current');
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      let loadedMatch, loadedArchive;
      if(parsed && parsed.match){
        loadedMatch = parsed.match;
        // 'sets' é o formato atual (histórico de sets encerrados); 'archive' é o
        // nome antigo do campo, de quando a ideia era arquivar partidas inteiras.
        if(Array.isArray(parsed.sets)) loadedArchive = parsed.sets;
        else if(Array.isArray(parsed.archive)) loadedArchive = parsed.archive;
        else loadedArchive = [];
        setSnapshots = (parsed.setSnapshots && typeof parsed.setSnapshots==='object') ? parsed.setSnapshots : {};
        liveSetNum = Number.isFinite(parsed.liveSetNum) ? parsed.liveSetNum : (loadedMatch.setNum || 1);
      } else {
        // formato salvo antes de existir o histórico de sets encerrados
        loadedMatch = parsed;
        loadedArchive = [];
        setSnapshots = {};
        liveSetNum = loadedMatch.setNum || 1;
      }
      migrateState(loadedMatch);
      setArchive = loadedArchive;
      undoRedoBySet = {}; // pilhas de desfazer/refazer não são persistidas (igual undoStack/redoStack)
      return loadedMatch;
    }
  }catch(e){ /* not found */ }
  return null;
}
function migrateState(loaded){
  // versões antigas guardavam teamA/teamB fixos + bestOf; converte para lista de times
  if(!loaded.teams && loaded.teamA && loaded.teamB){
    const tA = {id:uid(), name:loaded.teamA.name||"", players:loaded.teamA.players||[]};
    const tB = {id:uid(), name:loaded.teamB.name||"", players:loaded.teamB.players||[]};
    loaded.teams = [tA, tB];
    loaded.activeAId = tA.id;
    loaded.activeBId = tB.id;
    delete loaded.teamA;
    delete loaded.teamB;
    delete loaded.bestOf;
  }
  if(loaded.servingPlayerId === undefined) loaded.servingPlayerId = null;
  if(loaded.lastScorerPlayerId === undefined) loaded.lastScorerPlayerId = null;
  if(loaded.lastErrorPlayerId === undefined) loaded.lastErrorPlayerId = null;
  if(loaded.serveConfirmed === undefined) loaded.serveConfirmed = false;
  if(loaded.errorMessage === undefined) loaded.errorMessage = null;
  if(loaded.rotationIndexA === undefined) loaded.rotationIndexA = loaded.rotationIndex || 0;
  if(loaded.rotationIndexB === undefined) loaded.rotationIndexB = loaded.rotationIndex || 0;
  if(loaded.rotationStartedA === undefined) loaded.rotationStartedA = !!loaded.rotationServedA;
  if(loaded.rotationStartedB === undefined) loaded.rotationStartedB = !!loaded.rotationServedB;
  delete loaded.rotationIndex;
  delete loaded.rotationServedA;
  delete loaded.rotationServedB;
  // Líbero saca no lugar do Central, posição inicial de saque e jogadores por
  // time agora são configurações únicas da partida (Configurações da partida),
  // em vez de uma opção por time.
  if(loaded.liberoServesForCE === undefined){
    const fromTeam = Array.isArray(loaded.teams) ? loaded.teams.find(t=>t.liberoServesForCE !== undefined) : null;
    loaded.liberoServesForCE = fromTeam ? !!fromTeam.liberoServesForCE : true;
  }
  delete loaded.startPosition; // "Posição que começa sacando" deixou de ser uma configuração global
  const legacyTeamSize = loaded.teamSize; // "Jogadores por time" deixou de ser uma configuração global
  delete loaded.teamSize;
  if(loaded.firstServeTeam === undefined) loaded.firstServeTeam = "A"; // escolha manual de quem começa sacando
  if(Array.isArray(loaded.teams)){
    loaded.teams.forEach(t=>{
      delete t.liberoServesForCE;
      if(t.playerCount === undefined) t.playerCount = Math.min(Math.max(legacyTeamSize || 6, 1), 6);
      // cada time agora escolhe, no próprio elenco, qual jogador inicia o saque
      // (por padrão, o jogador na posição de Levantador)
      const hasValidStarter = t.startServerPlayerId && Array.isArray(t.players) && t.players.some(p=>p.id===t.startServerPlayerId);
      if(!hasValidStarter){
        const le = Array.isArray(t.players) ? t.players.find(p=>p.pos==='LE') : null;
        t.startServerPlayerId = le ? le.id : (t.players && t.players[0] ? t.players[0].id : null);
      }
    });
  }
}

/* ---------------- setup screen ---------------- */
function reorderFirstSixByPosition(players){
  const first6 = players.slice(0,6);
  const rest = players.slice(6);
  first6.sort((a,b)=>{
    const ia = a.pos && POSITIONS.includes(a.pos) ? POSITIONS.indexOf(a.pos) : 999;
    const ib = b.pos && POSITIONS.includes(b.pos) ? POSITIONS.indexOf(b.pos) : 999;
    return ia - ib;
  });
  return first6.concat(rest);
}

function renderRosterFor(teamId){
  const wrap = $('.roster-wrap[data-team-id="'+teamId+'"]');
  if(!wrap) return;
  wrap.innerHTML = '';
  const team = teamBy(teamId);
  // mantém sempre a ordem LE, P1, CE, OP, P2, LI entre os 6 primeiros
  team.players = reorderFirstSixByPosition(team.players);
  const players = team.players;

  // os 6 primeiros jogadores podem escolher qualquer posição, mas não podem
  // repeti-la entre si: ao escolher uma posição já usada por outro dos 6
  // primeiros, os dois trocam de posição automaticamente (ver listener abaixo).
  // A partir do 7º jogador, qualquer posição pode ser escolhida livremente,
  // podendo repetir. Exceção: quando o time não tem os 6 jogadores completos
  // (jogadores por time < 6), a posição extra "AT" (Atacante) também fica
  // disponível e pode ser repetida entre vários jogadores do time.
  const allowExtraPositions = (team.playerCount || 6) < 6;

  players.forEach((p, idx)=>{
    const row = document.createElement('div');
    row.className = 'player-row';
    const posOptions = allowExtraPositions ? POSITIONS.concat(EXTRA_POSITIONS) : POSITIONS;
    const emptyOption = idx < 6 ? `<option value="" ${p.pos?'':'selected'}>—</option>` : '';
    const startServeRadio = idx < 6 ? `
      <label class="start-serve-radio" title="Inicia o saque">
        <input type="radio" name="startServe-${teamId}" class="start-serve-input" data-idx="${idx}" data-team-id="${teamId}" ${team.startServerPlayerId===p.id?'checked':''}>
      </label>` : '';
    row.innerHTML = `
      <input type="text" maxlength="16" placeholder="Nome do jogador" value="${escapeHtml(p.name)}" data-idx="${idx}" data-team-id="${teamId}" class="pname-input">
      <select data-idx="${idx}" data-team-id="${teamId}" class="ppos-select">
        ${emptyOption}
        ${posOptions.map(pos=>`<option value="${pos}" ${pos===p.pos?'selected':''}>${pos}</option>`).join('')}
      </select>
      ${startServeRadio}
      <button class="rm-btn" data-idx="${idx}" data-team-id="${teamId}">×</button>
    `;
    wrap.appendChild(row);
  });

  $$('.pname-input', wrap).forEach(inp=>{
    inp.addEventListener('input', e=>{
      const i = +e.target.dataset.idx;
      teamBy(e.target.dataset.teamId).players[i].name = e.target.value;
    });
  });
  $$('.ppos-select', wrap).forEach(sel=>{
    sel.addEventListener('change', e=>{
      const i = +e.target.dataset.idx;
      const tId = e.target.dataset.teamId;
      const team = teamBy(tId);
      const player = team.players[i];
      const oldPos = player.pos;
      const newPos = e.target.value;
      if(i < 6 && newPos && !EXTRA_POSITIONS.includes(newPos)){
        // se outro dos 6 primeiros já está nessa posição, os dois trocam:
        // ele passa a usar a posição que este jogador tinha antes.
        // "AT" fica de fora dessa troca — pode ser repetida livremente.
        const conflict = team.players.slice(0,6).find((p, idx2) => idx2!==i && p.pos===newPos);
        if(conflict) conflict.pos = oldPos;
      }
      player.pos = newPos;
      renderRosterFor(tId); // reordena e atualiza a lista após a troca
    });
  });
  $$('.start-serve-input', wrap).forEach(radio=>{
    radio.addEventListener('change', e=>{
      const i = +e.target.dataset.idx;
      const tId = e.target.dataset.teamId;
      const team = teamBy(tId);
      const oldPlayerId = team.startServerPlayerId;
      const newPlayer = team.players[i];
      team.startServerPlayerId = newPlayer.id;
      if(oldPlayerId !== newPlayer.id){
        reassignTeamStartServer(tId, oldPlayerId, newPlayer);
      }
    });
  });
  $$('.rm-btn', wrap).forEach(btn=>{
    btn.addEventListener('click', e=>{
      const i = +e.target.dataset.idx;
      const team = teamBy(e.target.dataset.teamId);
      const arr = team.players;
      if(arr.length<=1) return;
      const removedId = arr[i].id;
      arr.splice(i,1);
      if(team.startServerPlayerId === removedId){
        // o jogador removido era quem iniciava o saque — cai para o novo
        // Levantador do time (ou para o primeiro jogador, se não houver)
        const le = arr.find(p=>p.pos==='LE');
        team.startServerPlayerId = le ? le.id : (arr[0] ? arr[0].id : null);
      }
      renderRosterFor(e.target.dataset.teamId);
    });
  });
}

function renderTeamsSetup(){
  const wrap = $('#teamsContainer');
  wrap.innerHTML = '';
  state.teams.forEach((team, idx)=>{
    const card = document.createElement('div');
    card.className = 'card team-card';
    const sizeOptions = [1,2,3,4,5,6].map(n=>`<option value="${n}" ${n===(team.playerCount||6)?'selected':''}>${n}</option>`).join('');
    card.innerHTML = `
      <div class="team-card-head">
        <h2 style="color:${TEAM_PALETTE[idx % TEAM_PALETTE.length]}">Time ${idx+1}</h2>

      renderRosterFor(tId);
    });
  });
}

/* ---------------- match screen render ---------------- */
function expectedServerForTeam(team){
  const teamObj = slotTeam(team);
  if(!teamObj) return null;
  // se o jogador marcado como sacando agora pertence a este time, prioriza ele
  // (cobre correções manuais feitas pelo botão Saq)
  if(state.servingPlayerId){
    const marked = teamObj.players.find(p=>p.id===state.servingPlayerId);
    if(marked) return marked;
  }
  const idx = team==='A' ? state.rotationIndexA : state.rotationIndexB;
  return playerForRotationSlot(idx, teamObj);
}

function renderScoreboard(){
  const a = slotTeam('A'), b = slotTeam('B');
  $('#mNameA').textContent = teamDisplayName(a).toUpperCase();
  $('#mNameB').textContent = teamDisplayName(b).toUpperCase();
  const canSwitchTeams = state.teams.length>2;
  $('#btnSwitchTeamA').classList.toggle('hidden', !canSwitchTeams);
  $('#btnSwitchTeamB').classList.toggle('hidden', !canSwitchTeams);
  // início do set: ninguém sacou ainda (placar 0-0 e nenhum saque confirmado) —
  // não mostra bolinha nem lembrete de saque em nenhum time até isso ser definido,
  // mesmo que "state.serve" tenha ficado com um valor antigo de antes dessa regra
  const serveUndetermined = state.serve===null || (state.score.A===0 && state.score.B===0 && !state.serveConfirmed);
  const servingNowA = !serveUndetermined && state.serve==='A';
  const servingNowB = !serveUndetermined && state.serve==='B';
  const serverA = servingNowA ? expectedServerForTeam('A') : null;
  const serverB = servingNowB ? expectedServerForTeam('B') : null;
  $('#colNameA').textContent = teamDisplayName(a) + (serverA ? ' Saque de ' + serverA.name : '');
  $('#colNameB').textContent = teamDisplayName(b) + (serverB ? ' Saque de ' + serverB.name : '');
  // rebuild score nodes safely
  $('#mScoreA').innerHTML = state.score.A + '<span class="serve-dot '+(servingNowA?'':'hidden')+'" id="serveDotA">🏐</span>';
  $('#mScoreB').innerHTML = '<span class="serve-dot '+(servingNowB?'':'hidden')+'" id="serveDotB">🏐</span>' + state.score.B;
  $('#mSetNum').textContent = state.setNum;

  const alertEl = $('#actionAlert');
  if(alertEl){
    if(state.errorMessage){
      alertEl.textContent = 'Marcação incorreta';
      alertEl.className = 'action-alert wrong';
    } else if(!state.serveConfirmed){
      alertEl.textContent = 'Marcar saque';
      alertEl.className = 'action-alert serve';
    } else {
      alertEl.textContent = 'Marcar ponto';
      alertEl.className = 'action-alert point';
    }
  }
  renderFirstServeConfig();
}

function setFirstServeTeam(newTeam){
  newTeam = newTeam==='B' ? 'B' : 'A';
  const changed = state.firstServeTeam !== newTeam;
  state.firstServeTeam = newTeam;
  if(changed && state.started && !state.matchOver && state.score.A===0 && state.score.B===0){
    // ainda no início do set (nenhum ponto marcado) — refaz a atribuição
    // do 1º saque, desfazendo o saque automático anterior (se houver) e
    // registrando para o time recém-marcado
    removePendingAutoServe();
    resetRotation();
    autoAssignFirstServe();

  renderAll();

   cadastrados) que abre a lista de times para escolher quem joga naquele lado.
   A troca acontece na hora, sem reiniciar placar, set ou histórico — só troca
   qual time está sendo exibido/pontuado naquele lado. */
function openTeamSwitchSheet(slot){
  const currentId = slot==='A' ? state.activeAId : state.activeBId;
  const otherId = slot==='A' ? state.activeBId : state.activeAId;
  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  backdrop.id = 'teamSwitchBackdrop';
  const optsHtml = state.teams.map(t=>{
    const isCurrent = t.id===currentId;

    return `<div class="team-switch-option ${isCurrent?'active':''}" data-team-id="${t.id}">${escapeHtml(teamDisplayName(t))}${isCurrent ? '<span class="team-switch-option-tag">jogando neste lado</span>' : (isOther ? '<span class="team-switch-option-tag">jogando do outro lado</span>' : '')}</div>`;
  }).join('');
  backdrop.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="who">Trocar time — Lado ${slot}</div>
        <div class="close-x" id="teamSwitchClose">✕</div>
      </div>
      ${optsHtml}
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', (e)=>{
    if(e.target===backdrop || e.target.closest('#teamSwitchClose')){ backdrop.remove(); return; }
    const opt = e.target.closest('.team-switch-option');

      backdrop.remove();
      requestTeamSwitch(slot, opt.dataset.teamId);

}

function switchActiveTeam(slot, teamId){
  if(slot==='A') state.activeAId = teamId; else state.activeBId = teamId;
  if(state.activeAId===state.activeBId){
    const alt = state.teams.find(t=>t.id!==teamId);
    if(alt){ if(slot==='A') state.activeBId = alt.id; else state.activeAId = alt.id; }
  }
  editEntryActiveA = state.activeAId;
  editEntryActiveB = state.activeBId;
  markDirty();
  renderAll();
}

function requestTeamSwitch(slot, teamId){
  const currentId = slot==='A' ? state.activeAId : state.activeBId;
  if(teamId===currentId) return;
  switchActiveTeam(slot, teamId);
  showToast('Time alterado.');
}
